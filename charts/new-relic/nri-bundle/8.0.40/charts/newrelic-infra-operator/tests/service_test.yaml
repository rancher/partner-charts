suite: test Service
templates:
  - templates/service.yaml
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: sets the port protocol so Helm 4 server-side apply accepts the Service
    set:
      cluster: test-cluster
      licenseKey: use-whatever
    asserts:
      - equal:
          path: spec.ports[0].protocol
          value: TCP
      - equal:
          path: spec.ports[0].port
          value: 443
