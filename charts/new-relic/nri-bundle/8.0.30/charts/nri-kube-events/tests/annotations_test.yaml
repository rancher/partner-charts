suite: test annotations
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/agent-configmap.yaml
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: sets checksum pod annotations when no values provided
    set:
      cluster: my-cluster
      licenseKey: us-whatever
    asserts:
      - exists:
          path: spec.template.metadata.annotations.checksum/config
        template: templates/deployment.yaml
      - exists:
          path: spec.template.metadata.annotations.checksum/agent-config
        template: templates/deployment.yaml

  - it: sets pod annotations from values alongside checksums
    set:
      cluster: my-cluster
      licenseKey: us-whatever
      podAnnotations:
        podKey1: "podValue1"
        podKey2: "podValue2"
    asserts:
      - exists:
          path: spec.template.metadata.annotations.checksum/config
        template: templates/deployment.yaml
      - exists:
          path: spec.template.metadata.annotations.checksum/agent-config
        template: templates/deployment.yaml
      - equal:
          path: spec.template.metadata.annotations.podKey1
          value: podValue1
        template: templates/deployment.yaml
      - equal:
          path: spec.template.metadata.annotations.podKey2
          value: podValue2
        template: templates/deployment.yaml