suite: test infra-agent ClusterRole monitoring rules
templates:
  - templates/clusterrole.yaml
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: injected infra-agent ClusterRole grants watch on core resources so the sidecar informer works
    documentIndex: 1
    set:
      cluster: test-cluster
      licenseKey: use-whatever
    asserts:
      - equal:
          path: metadata.name
          value: my-release-newrelic-infra-operator-infra-agent
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources:
              - "nodes"
              - "pods"
              - "services"
              - "namespaces"
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources:
              - "nodes/metrics"
              - "nodes/stats"
              - "nodes/proxy"
            verbs: ["get", "list"]

  - it: operator ClusterRole holds the watch permission it grants to injected agents
    documentIndex: 0
    set:
      cluster: test-cluster
      licenseKey: use-whatever
    asserts:
      - equal:
          path: metadata.name
          value: my-release-newrelic-infra-operator
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources:
              - "nodes"
              - "pods"
              - "services"
              - "namespaces"
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources:
              - "nodes/metrics"
              - "nodes/stats"
              - "nodes/proxy"
            verbs: ["get", "list"]
