# Covers config.etcd.volumes / config.etcd.volumeMounts, the knobs that replaced
# the commented-out TLS entries behind the bare `volumes:` (YAML null) in
# templates/etcd.yaml (enterprise-kyverno#1090). A non-empty `volumes` list must
# render under the StatefulSet's `volumes:`, and `volumeMounts` entries must
# follow the built-in `etcd-data` mount; an empty `volumes` list must omit the
# key entirely (checked by .hack/check-chart-render.sh, which asserts the
# etcd-client-tls volume and mount from this file).
# Lint-only: the etcd-client-tls Secret does not exist, so never `ct install`.
config:
  etcd:
    volumes:
      - name: etcd-client-tls
        secret:
          secretName: etcd-client-tls
          optional: false
    volumeMounts:
      - name: etcd-client-tls
        mountPath: /etc/etcd/certs/client
        readOnly: true
