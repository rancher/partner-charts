# Covers templates/database-secret.yaml (config.db.secretCreation=true) with
# every DB value that goes through the `reports-server.quoteOrEmpty` helper
# explicitly set to null, on the PostgreSQL backend (etcd disabled).
# A nil value must render in the Secret's stringData as "" and never as a bare
# `key:` (YAML null), which GitOps tools doing server-side apply reject
# (enterprise-kyverno#1090). .hack/check-chart-render.sh asserts every stringData
# value of this Secret is a string, and that the port still defaults to "5432".
# The Secret name below is asserted by that script; keep the two in sync.
config:
  etcd:
    enabled: false
  db:
    secretCreation: true
    secretName: reports-server-db-credentials
    host: ~
    readReplicaHosts: ~
    name: ~
    user: ~
    password: ~
