{{- if .Values.config.licenseState.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "kyverno.config.licenseStateConfigMapName" . }}
  namespace: {{ template "kyverno.namespace" . }}
  labels:
    {{- include "kyverno.config.labels" . | nindent 4 }}
  {{- if .Values.config.licenseState.preserve }}
  annotations:
    # Kept on uninstall so a reinstall does not hand out a fresh trial window.
    helm.sh/resource-policy: "keep"
  {{- end }}
# `data` is intentionally absent and must stay that way: the leader is the sole
# writer of firstSeen, and a rendered `data` block would let Helm's three-way merge
# revert it on every upgrade, restarting every customer's trial.
{{- end }}
