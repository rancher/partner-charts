# Covers the PostgreSQL backend (etcd disabled) with every DB value that goes
# through the `reports-server.quoteOrEmpty` helper explicitly set to null.
# `quoteOrEmpty` renders only a nil value as "" (every non-nil value is
# rendered exactly as `| quote` would), so a nil DB value must never become a
# bare `value:` (YAML null), which GitOps tools doing server-side apply reject
# (enterprise-kyverno#1090). .hack/check-chart-render.sh asserts the resulting
# env vars are all "".
# config.db.port is intentionally left empty by default (no 5432 default).
# config.db.host is left at its default: the dbHost helper falls back to
# <release>-postgresql.<namespace> for a nil host rather than using quoteOrEmpty.
config:
  etcd:
    enabled: false
  db:
    readReplicaHosts: ~
    port: ~
    name: ~
    user: ~
    password: ~
