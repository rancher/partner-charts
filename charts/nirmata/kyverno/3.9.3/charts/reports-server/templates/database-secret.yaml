{{- if .Values.config.db.secretCreation }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "db.secretName must be set when db.secretCreation=true" .Values.config.db.secretName | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "reports-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database host
  {{ .Values.config.db.hostSecretKeyName }}: {{ include "reports-server.quoteOrEmpty" .Values.config.db.host }}

  # Database port (defaults to "5432" if .Values.db.port is unset)
  {{ .Values.config.db.portSecretKeyName }}: {{ default "5432" .Values.config.db.port | quote }}

  # Database name
  {{ .Values.config.db.dbNameSecretKeyName }}: {{ include "reports-server.quoteOrEmpty" .Values.config.db.name }}

  # Database user
  {{ .Values.config.db.userSecretKeyName }}: {{ include "reports-server.quoteOrEmpty" .Values.config.db.user }}

  # Database password
  {{ .Values.config.db.passwordSecretKeyName }}: {{ include "reports-server.quoteOrEmpty" .Values.config.db.password }}

  # Read-replica hosts (can be empty string)
  {{ .Values.config.db.readReplicaHostsSecretKeyName }}: {{ include "reports-server.quoteOrEmpty" .Values.config.db.readReplicaHosts }}
{{- end }}
