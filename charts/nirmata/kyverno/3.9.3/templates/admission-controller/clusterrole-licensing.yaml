{{- if .Values.admissionController.rbac.create }}
{{/*
  Extra permissions for the licensing evaluator. Aggregated via the label below
  rather than added to the core ClusterRole, so that 200-line file stays untouched.
  Grants a cluster-wide read of nodes.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ template "kyverno.admission-controller.roleName" . }}:licensing
  labels:
    {{- include "kyverno.admission-controller.labels" . | nindent 4 }}
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  # Licensed node units are derived from each node's memory capacity.
  - apiGroups:
      - ''
    resources:
      - nodes
    verbs:
      - get
      - list
  # Counted toward the policy cap, but granted only to the cleanup controller by
  # default. watch is required alongside list: the live policy counter behind the
  # capacity gate reads these through informers, and an informer denied watch
  # lists once then retries forever, leaving the counter permanently unsynced so
  # the gate silently falls back to the stale evaluated count.
  - apiGroups:
      - policies.kyverno.io
    resources:
      - deletingpolicies
      - namespaceddeletingpolicies
    verbs:
      - get
      - list
      - watch
{{- end }}
