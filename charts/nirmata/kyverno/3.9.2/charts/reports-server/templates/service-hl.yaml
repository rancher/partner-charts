apiVersion: v1
kind: Service
metadata:
  name: {{ include "reports-server.headlessServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reports-server.labels" . | nindent 4 }}
spec:
  # Resolves to every replica's pod IP so a terminating leader can tell whether
  # it is the last one before handing the api services back.
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: https
      port: 443
      targetPort: https
  selector:
    {{- include "reports-server.selectorLabels" . | nindent 4 }}
