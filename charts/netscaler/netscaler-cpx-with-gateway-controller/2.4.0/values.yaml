license:
  accept: no
replicaCount: 1

# Generic/Common parameters
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Gateway Controller configuration
gatewayController:
  # OpenShift specific
  openshift: false
  required: true
  gatewayControllerName: ""
  disableAPIServerCertVerify: false
  certBundle: false
  entityPrefix: ""
  imageRegistry: quay.io
  imageRepository: netscaler/netscaler-k8s-ingress-controller
  imageTag: 4.2.20-aigwy-tp
  image: "{{ .Values.gatewayController.imageRegistry }}/{{ .Values.gatewayController.imageRepository }}:{{ .Values.gatewayController.imageTag }}"
  pullPolicy: IfNotPresent
  ipam: false
  jsonLog: false
  kubernetesURL: ""
  enableLivenessProbe: true
  livenessProbe:
    exec:
      command:
      - /bin/sh
      - -c
      - |
        FILE_PATH="$LIVENESS_FILE_PATH"
        [ -f "$FILE_PATH" ] && [ $(( $(date +%s) - $(stat -c %Y "$FILE_PATH") )) -lt 60 ] && exit 0 || exit 1
    initialDelaySeconds: 30
    periodSeconds: 60
  logLevel: INFO
  logProxy: ""
  namespaceLabels: ""
  optimizeEndpointBinding: false
  rbacRole: false
  enableReadinessProbe: true
  readinessProbe:
    exec:
      command:
      - cat
      - /tmp/readiness
    initialDelaySeconds: 30
    periodSeconds: 60
    failureThreshold: 5
    successThreshold: 1
  resources:
    requests:
      cpu: 32m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 200Mi
  # Analytics configuration processed by the Gateway Controller. When required is
  # set to true the NS_ANALYTICS_CONFIG block is rendered into the ConfigMap.
  analyticsConfig:
    required: false
    logAllJsonFields: false
    distributedTracing:
      enable: false
      samplingrate: 100
    splunk:
      enable: false
      servers:
        - name: <name of the Splunk server>
          endpoint: <IP address or DNS name of the Splunk HEC endpoint>
          port: <port of the Splunk HEC endpoint>
          authToken:
            name: <name of the Kubernetes secret holding the Splunk HEC token>
            namespace: <namespace of the secret>
          profiles:
            timeseries: {}
            tcpinsight: {}
            webinsight: {}
            streaminsight: {}
            udpinsight: {}

# NetScaler CPX configuration
netscalerCpx:
  imageRegistry: quay.io
  imageRepository: netscaler/netscaler-cpx
  imageTag: 14.1-72.104
  image: "{{ .Values.netscalerCpx.imageRegistry }}/{{ .Values.netscalerCpx.imageRepository }}:{{ .Values.netscalerCpx.imageTag }}"
  pullPolicy: IfNotPresent
  nsProtocol: "http"
  nsHTTP2ServerSide: "OFF"
  nsCookieVersion: 0
  nsDnsNameserver: ""
  nsLbHashAlgo:
    required: false
    hashFingers: ""
    hashAlgorithm: ""
  hostName: ""
  mgmtHttpPort: 9080
  mgmtHttpsPort: 9443
  cpxLicenseAggregator: ""
  resources:
    requests:
      cpu: 128m
      memory: 500Mi
    limits:
      cpu: 500m
      memory: 512Mi

  nitroReadTimeout: 20
  ADMSettings:
    licenseServerIP: ""
    licenseServerPort: 27000
    ADMIP: ""
    loginSecret: ""
    bandWidthLicense: false
    bandWidth: ""
    vCPULicense: false
    cpxCores: 1
    licenseEdition: "PLATINUM"
    platform: false
    licensingMode: "" # "pool" or "las"
    # For licensingmode "las", set the ADMIP, loginSecret, licenseEdition and bandwidth

  enableStartupProbe: true
  startupProbe:
    exec:
      command:
      - ls
      - /tmp/cpx_started
    periodSeconds:  5
    failureThreshold: 20
    initialDelaySeconds: 30
    successThreshold: 1
  
  enableLivenessProbe: true
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 5
    failureThreshold: 5
    successThreshold: 1
    exec:
      command:
      - /bin/ping
      - -c 1
      - 192.0.0.1
  
  # commands: to provide global config to be applied in CPX. The commands will be executed in order. For e.g.
  # add rewrite action rw_act_x_forwarded_proto insert_http_header X-Forwarded-Proto "\"https\""
  # add rewrite policy rw_pol_x_forwarded_proto CLIENT.SSL.IS_SSL rw_act_x_forwarded_proto
  # bind rewrite global rw_pol_x_forwarded_proto 10 -type REQ_OVERRIDE
  commands: |

  # shellCommands: to provide commands that need to be executed in shell of CPX. For e.g.
  # touch /etc/a.txt
  # echo "this is a" > /etc/a.txt
  # echo "this is the file" >> /etc/a.txt
  # ls >> /etc/a.txt
  shellCommands: |

  extraVolumeMounts: []
    # Example: mount a user-provided ConfigMap for custom metrics config
    #- name: custom-metrics-conf
    #  mountPath: /cpx/custom_metrics_conf

  extraVolumes: []
    # Example: reference a user-provided ConfigMap for custom metrics config
    #- name: custom-metrics-conf
    #  configMap:
    #    name: "my-custom-metrics-configmap"
    #    defaultMode: 420

# Enable CPX config persistence across pod restarts.
# When true, adds init container, preStop hook, rolling update strategy, and mounts the
# external ConfigMap "nsic-reboot-overflow-config" (auto-created by the preStop hook at runtime).
cpxConfigPersistenceEnabled: false

createClusterRoleAndBinding: true
# Service Account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""
  tokenExpirationSeconds: 3600

# Service configuration
service:
  annotations: {}
  spec:
    type: ClusterIP
    ports:
      - port: 80
        targetPort: 80
        protocol: TCP
        name: http
      - port: 443
        targetPort: 443
        protocol: TCP
        name: https

# Node configuration
nodeSelector:
  key: ""
  value: ""
tolerations: []
affinity: {}
podAnnotations: {}

# Exporter config details
exporter:
  required: false
  imageRegistry: quay.io
  imageRepository: netscaler/netscaler-adc-metrics-exporter
  imageTag: 1.5.0
  image: "{{ .Values.exporter.imageRegistry }}/{{ .Values.exporter.imageRepository }}:{{ .Values.exporter.imageTag }}"
  pullPolicy: IfNotPresent
  ports:
    containerPort: 8888
  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  serviceMonitorExtraLabels: {}

# API Priority and Fairness configuration for the gateway controller's API server requests
apiPriorityAndFairness:
  enabled: false
  priorityLevelConfiguration:
    nominalConcurrencyShares: 40
    lendablePercent: 25
    limitResponse:
      type: Queue
      queuing:
        queues: 16
        handSize: 4
        queueLengthLimit: 50
  flowSchema:
    matchingPrecedence: 1000
    distinguisherMethod:
      type: ByNamespace

