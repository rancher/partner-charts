apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rewritepolicies.citrix.com
spec:
  group: citrix.com
  names:
    kind: rewritepolicy
    plural: rewritepolicies
    singular: rewritepolicy
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Status
      type: string
      description: Current Status of the CRD
      jsonPath: .status.state
    - name: Message
      type: string
      description: Status Message
      jsonPath: .status.status_message
    schema:
      openAPIV3Schema:
        type: object
        properties:
          status:
            type: object
            properties:
              state:
                type: string
              status_message:
                type: string
          spec:
            type: object
            properties:
              ingressclass:
                type: string
                description: Ingress class, if not specified then all NetScaler Ingress Controllers in the cluster will process the resource otherwise only the controller with that ingress class will process this resource
              gatewayClassName:
                type: string
                description: Name of the GatewayClass that this SSL profile should be applied to.
              targetRef:
                type: array
                description: A list of target resources where this profile will be applied.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the target resource.
                    namespace:
                      type: string
                      description: Namespace of the target resource.
                    group:
                      type: string
                      description: Group of the target resource.
                    kind:
                      type: string
                      description: Kind of the target resource.
                    sectionName:
                      type: string
                      description: Specific section within the target resource.
              rewrite-policies:
                type: array
                items:
                  type: object
                  properties:
                    servicenames:
                      description: Name of the services that needs to be binded to rewrite policy.
                      type: array
                      items:
                        type: string
                        maxLength: 127
                    goto-priority-expression:
                      description: 'Expression or other value specifying the next policy to be evaluated if the current policy evaluates to TRUE. Specify one of the following values: * NEXT - Evaluate the policy with the next higher priority number. * END - End policy evaluation. Default value of goto-priority-expression: END'
                      type: string
                      maxLength: 1499
                    logpackets:
                      type: object
                      description: Adds an audit message action. The action specifies whether to log the message, and to which log.
                      properties:
                        logexpression:
                          description: Default-syntax expression that defines the format and content of the log message.
                          type: string
                          maxLength: 7991
                        loglevel:
                          description: Audit log level, which specifies the severity level of the log message being generated.
                          type: string
                          enum:
                          - EMERGENCY
                          - ALERT
                          - CRITICAL
                          - ERROR
                          - WARNING
                          - NOTICE
                          - INFORMATIONAL
                          - DEBUG
                      required:
                      - logexpression
                      - loglevel
                    rewrite-policy:
                      type: object
                      properties:
                        rewrite-criteria:
                          description: Expression against which traffic is evaluated.
                          type: string
                          maxLength: 1299
                        default-action:
                          description: Action to perform if the result of policy evaluation is undefined (UNDEF). An UNDEF event indicates an internal error condition.
                          type: string
                          maxLength: 77
                          enum:
                          - NOREWRITE
                          - RESET
                          - DROP
                        operation:
                          description: Type of user-defined rewrite action.
                          type: string
                          enum:
                          - noop
                          - delete
                          - insert_http_header
                          - delete_http_header
                          - corrupt_http_header
                          - insert_before
                          - insert_after
                          - replace
                          - replace_http_res
                          - delete_all
                          - replace_all
                          - insert_before_all
                          - insert_after_all
                          - clientless_vpn_encode
                          - clientless_vpn_encode_all
                          - clientless_vpn_decode
                          - clientless_vpn_decode_all
                          - insert_sip_header
                          - delete_sip_header
                          - corrupt_sip_header
                          - replace_sip_res
                          - replace_diameter_header_field
                          - replace_dns_header_field
                          - replace_dns_answer_section
                        target:
                          description: Default syntax expression that specifies which part of the request or response to rewrite.
                          type: string
                          maxLength: 1229
                        modify-expression:
                          description: Default syntax expression that specifies the content to insert into the request or response at the specified location, or that replaces the specified string.
                          type: string
                          maxLength: 7991
                        multiple-occurence-modify:
                          description: Search facility that is used to match multiple strings in the request or response.
                          type: string
                          maxLength: 171
                        additional-multiple-occurence-modify:
                          description: 'Specify additional criteria to refine the results of the search. Always starts with the "extend(m,n)" operation, where "m" specifies number of bytes to the left of selected data and "n" specifies number of bytes to the right of selected data. You can use refineSearch only on body expressions, and only when rewrite-criteria is any one of this: INSERT_BEFORE_ALL, INSERT_AFTER_ALL, REPLACE_ALL, and DELETE_ALL.'
                          type: string
                          maxLength: 1299
                        direction:
                          description: Bind point to which to bind the policy.
                          type: string
                          enum:
                          - REQUEST
                          - RESPONSE
                          - HTTP_EVENT_REQUEST
                          - HTTP_EVENT_RESPONSE
                        comment:
                          description: Any comments to preserve information about this rewrite policy.
                          type: string
                          maxLength: 255
                      required:
                      - rewrite-criteria
                      - operation
                      - target
                      - direction
                  required:
                  - rewrite-policy
              responder-policies:
                type: array
                items:
                  type: object
                  properties:
                    servicenames:
                      description: Name of the services that needs to be binded to responder policy.
                      type: array
                      items:
                        type: string
                        maxLength: 127
                    goto-priority-expression:
                      description: 'Expression or other value specifying the next policy to be evaluated if the current policy evaluates to TRUE. Specify one of the following values: * NEXT - Evaluate the policy with the next higher priority number. * END - End policy evaluation. Default value of goto-priority-expression: END'
                      type: string
                      maxLength: 1499
                    logpackets:
                      type: object
                      description: Adds an audit message action. The action specifies whether to log the message, and to which log.
                      properties:
                        logexpression:
                          description: Default-syntax expression that defines the format and content of the log message.
                          type: string
                          maxLength: 7991
                        loglevel:
                          description: Audit log level, which specifies the severity level of the log message being generated.
                          type: string
                          enum:
                          - EMERGENCY
                          - ALERT
                          - CRITICAL
                          - ERROR
                          - WARNING
                          - NOTICE
                          - INFORMATIONAL
                          - DEBUG
                      required:
                      - logexpression
                      - loglevel
                    responder-policy:
                      type: object
                      properties:
                        redirect:
                          type: object
                          description: Use this option when you want to Redirect the request when request matches to policy.
                          properties:
                            url:
                              description: URL on which you want to redirect the request.
                              type: string
                              maxLength: 7991
                            redirect-status-code:
                              description: HTTP response status code, for example 200, 302, 404, etc.
                              type: integer
                              minimum: 100
                              maximum: 599
                            redirect-reason:
                              description: Expression specifying the reason for redirecting the request.
                              type: string
                              maxLength: 7991
                          required:
                          - url
                        respondwith:
                          type: object
                          description: Use this parameter when you want to respond to the request when request matches to policy.
                          properties:
                            http-payload-string:
                              description: Expression that you want to sent as response to the request.
                              type: string
                              maxLength: 7991
                          required:
                          - http-payload-string
                        noop:
                          type: string
                          description: Use this option when you want to send the request to the protected server instead of responding to it when request matches to policy.
                          properties:
                            target:
                              description: Default syntax expression that specifies to perform noop operation on
                              type: string
                              maxLength: 1229
                        reset:
                          type: string
                          description: Use this option when you want to Reset the client connection by closing it when request matches to policy.
                          properties: null
                        drop:
                          type: string
                          description: Use this option when you want to drop the request without sending a response to the user when request matches to policy.
                          properties: null
                        respond-criteria:
                          description: Default syntax expression that the policy uses to determine whether to respond to the specified request.
                          type: string
                          maxLength: 1299
                        default-action:
                          description: Action to perform if the result of policy evaluation is undefined (UNDEF). An UNDEF event indicates an internal error condition.
                          type: string
                          maxLength: 77
                          enum:
                          - NOOP
                          - RESET
                          - DROP
                        comment:
                          description: Any comments to preserve information about this responder policy.
                          type: string
                          maxLength: 255
                      required:
                      - respond-criteria
                      oneOf:
                      - required:
                        - redirect
                      - required:
                        - respondwith
                      - required:
                        - noop
                      - required:
                        - reset
                      - required:
                        - drop
                  required:
                  - responder-policy
              mcp-tool-filters:
                type: array
                description: Per-role filters that prune the MCP tools/list response so each role sees only the tools it may use. Each entry generates a delete_all rewrite action over the event stream plus the role-gated policy and binding.
                items:
                  type: object
                  properties:
                    servicenames:
                      description: Name of the services whose vserver this filter binds to.
                      type: array
                      items:
                        type: string
                        maxLength: 127
                    direction:
                      description: Bind point for the generated rewrite policy. For MCP tool-list filtering use HTTP_EVENT_RESPONSE (streamed response).
                      type: string
                      enum:
                      - REQUEST
                      - RESPONSE
                      - HTTP_EVENT_REQUEST
                      - HTTP_EVENT_RESPONSE
                    goto-priority-expression:
                      description: 'Expression or other value specifying the next policy to be evaluated if the current policy evaluates to TRUE. Specify one of the following values: * NEXT - Evaluate the policy with the next higher priority number. * END - End policy evaluation. Default value of goto-priority-expression: END'
                      type: string
                      maxLength: 1499
                    role:
                      type: object
                      description: Identifies the caller role this filter applies to (header value mapped through a stringmap).
                      properties:
                        header:
                          description: Request header carrying the user/role identifier, e.g. X-Citrix-SPA-User.
                          type: string
                          maxLength: 255
                        stringmap:
                          description: Name of a stringmap (defined in this CR) mapping the header value to a role.
                          type: string
                          maxLength: 32
                        equals:
                          description: Role value the mapped header must equal for this filter to apply.
                          type: string
                          maxLength: 255
                      required:
                      - header
                      - stringmap
                      - equals
                    allow-patset:
                      description: Name of a patset (defined in this CR) of operation substrings; only tools whose name contains a member are kept (all others removed).
                      type: string
                      maxLength: 32
                    deny-patset:
                      description: Name of a patset (defined in this CR) of operation substrings; tools whose name contains a member are removed.
                      type: string
                      maxLength: 32
                    always-allow:
                      description: Tool-name prefixes never removed regardless of allow/deny (e.g. get_tool_details).
                      type: array
                      items:
                        type: string
                        maxLength: 127
                    tools-json-path:
                      description: JSON path selecting each tool object in the tools/list result. Default /result/tools/*
                      type: string
                      maxLength: 171
                    name-json-path:
                      description: JSON path (relative to a tool object) of the field matched against the patsets. Default /name
                      type: string
                      maxLength: 171
                  required:
                  - role
                  - direction
                  anyOf:
                  - required:
                    - allow-patset
                  - required:
                    - deny-patset
              dataset:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      description: Name of the dataset.
                      type: string
                      maxLength: 32
                    type:
                      description: Type of value to bind to the dataset.
                      type: string
                      enum:
                      - ipv4
                      - number
                      - ipv6
                      - ulong
                      - double
                      - mac
                    comment:
                      description: Any comments to preserve information about this dataset.
                      type: string
                      maxLength: 255
                    values:
                      description: Value of the specified type that is associated with this dataset.
                      type: array
                      items:
                        type: string
                  required:
                  - name
                  - type
                  - values
              patset:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      description: Name of the Patset.
                      type: string
                      maxLength: 32
                    comment:
                      description: Any comments to preserve information about this patset.
                      type: string
                      maxLength: 255
                    values:
                      description: String of characters that constitutes a pattern and is associated with this patset.
                      type: array
                      items:
                        type: string
                  required:
                  - name
                  - values
              stringmap:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      description: Name of the Stringmap.
                      type: string
                      maxLength: 32
                    comment:
                      description: Any comments to preserve information about this stringmap.
                      type: string
                      maxLength: 255
                    values:
                      description: List of (key,value) pairs to be bound to this string map.
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            description: Character string constituting the key to be bound to this string map.
                            type: string
                            maxLength: 2047
                          value:
                            description: Character string constituting the value associated with the key.
                            type: string
                            maxLength: 2047
                  required:
                  - name
                  - values
              httpcallout_policy:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      description: httpcallout name
                      type: string
                      maxLength: 32
                    server_ip:
                      description: IP Address of the server(callout agent) to which the callout is sent.
                      type: string
                    server_port:
                      description: Port of the server(callout agent) to which the callout is sent.
                      type: integer
                      minimum: 1
                      maximum: 65535
                    http_method:
                      description: "'Method used in the HTTP request that this callout sends.\n Default http method is GET'\n"
                      type: string
                      enum:
                      - GET
                      - POST
                    host_expr:
                      description: "'String expression to configure the Host header. Can contain a literal value\n (for example, 10.101.10.11) or a derived value (for example, http.req.header(\"Host\")).\n The literal value can be an IP address or a fully qualified domain name. Mutually\n exclusive with the full HTTP request expression.'\n"
                      type: string
                      maxLength: 255
                    url_stem_expr:
                      description: "'String expression for generating the URL stem. Can contain a literal string\n (for example, \"/mysite/index.html\") or an expression that derives the value\n (for example, http.req.url).'\n"
                      type: string
                      maxLength: 8191
                    headers:
                      type: array
                      description: "'One or more headers to insert into the HTTP request. Each header is represented by\n name and expr, where expr is an expression that is evaluated at runtime to provide\n the value for the named header. You can configure a maximum of eight headers for\n an HTTP callout.'\n"
                      items:
                        type: object
                        properties:
                          name:
                            description: header name
                            type: string
                          expr:
                            description: header expression
                            type: string
                    parameters:
                      type: array
                      description: "'One or more query parameters to insert into the HTTP request URL (for a GET request)\n or into the request body (for a POST request). Each parameter is represented by\n name and expr, where expr is an expression that is evaluated at run time to provide\n the value for the named parameter (name=value). The parameter values are URL encoded.'\n"
                      items:
                        type: object
                        properties:
                          name:
                            description: parameter name
                            type: string
                          expr:
                            description: parameter expression
                            type: string
                    body_expr:
                      description: "'An advanced string expression for generating the body of the request.\n The expression can contain a literal string or an expression that derives\n the value (for example, client.ip.src).'\n"
                      type: string
                    full_req_expr:
                      description: "'Exact HTTP request, in the form of an expression, which the NetScaler sends\n to the callout agent. The request expression is constrained by the feature\n for which the callout is used. For example, an HTTP.RES expression cannot be\n used in a request-time policy bank or in a TCP content switching policy bank.'\n"
                      type: string
                    scheme:
                      description: "'Type of scheme for the callout server.\n Default scheme is HTTP'\n"
                      type: string
                      enum:
                      - HTTP
                      - HTTPS
                    cache_for_secs:
                      description: "'Duration, in seconds, for which the callout response is cached.\n The cached responses are stored in an integrated caching content\n group named \"calloutContentGroup\". If no duration is configured, \n the callout responses will not be cached unless normal caching\n configuration is used to cache them. This parameter takes precedence over any\n normal caching configuration that would otherwise apply to these responses.'\n"
                      type: integer
                      minimum: 1
                      maximum: 31536000
                    return_type:
                      description: "'Type of data that the target callout agent returns in response to the callout\n Available settings function as follows:\n * TEXT - Treat the returned value as a text string.\n * NUM - Treat the returned value as a number.\n * BOOL - Treat the returned value as a Boolean value.'\n"
                      type: string
                      enum:
                      - TEXT
                      - NUM
                      - BOOL
                    result_expr:
                      description: "'Expression that extracts the callout results from the response sent by the HTTP callout\n agent. Must be a response based expression, that is, it must begin with HTTP.RES. The\n operations in this expression must match the return type. For example, if you configure\n a return type of TEXT, the result expression must be a text based expression. If the\n return type is NUM, the result  expression (resultExpr) must return a numeric value,\n as in the following example: http.res.body(10000).length.'       \n"
                      type: string
                      maxLength: 8191
                    comment:
                      description: Any comments to preserve information about this HTTP callout.
                      type: string
                      maxLength: 255
                  allOf:
                  - properties: null
                    required:
                    - name
                    - server_ip
                    - server_port
                  - properties: null
                    oneOf:
                    - properties: null
                      required:
                      - full_req_expr
                    - properties: null
                      anyOf:
                      - properties: null
                        required:
                        - http_method
                      - properties: null
                        required:
                        - host_expr
                      - properties: null
                        required:
                        - url_stem_expr
                      - properties: null
                        required:
                        - headers
                      - properties: null
                        required:
                        - parameters
                      - properties: null
                        required:
                        - body_expr
            anyOf:
            - required:
              - rewrite-policies
            - required:
              - responder-policies
            - required:
              - mcp-tool-filters
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ratelimits.citrix.com
spec:
  group: citrix.com
  names:
    kind: ratelimit
    plural: ratelimits
    singular: ratelimit
  scope: Namespaced
  versions:
  - name: v1beta1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Status
      type: string
      description: Current Status of the CRD
      jsonPath: .status.state
    - name: Message
      type: string
      description: Status Message
      jsonPath: .status.status_message
    schema:
      openAPIV3Schema:
        type: object
        properties:
          status:
            type: object
            properties:
              state:
                type: string
              status_message:
                type: string
          spec:
            type: object
            properties:
              ingressclass:
                type: string
                description: Ingress class, if not specified then all NetScaler Ingress Controllers in the cluster will process the resource otherwise only the controller with that ingress class will process this resource
              servicenames:
                description: Name of the services to which the ratelimit policies are applied.
                type: array
                items:
                  type: string
                  maxLength: 127
              gatewayClassName:
                type: string
                description: Name of the GatewayClass that this SSL profile should be applied to.
              targetRef:
                type: array
                description: A list of target resources where this profile will be applied.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the target resource.
                    namespace:
                      type: string
                      description: Namespace of the target resource.
                    group:
                      type: string
                      description: Group of the target resource.
                    kind:
                      type: string
                      description: Kind of the target resource.
                    sectionName:
                      type: string
                      description: Specific section within the target resource.
              selector_keys:
                type: object
                description: Traffic match criteria to which apply above rate-limit/throttling. All keys are applied as AND condition. If no keys are specified, rate-limit applies at service level
                properties:
                  basic:
                    type: object
                    description: Basic traffic stream selection criteria to which to apply the ratelimit
                    properties:
                      path:
                        type: array
                        description: api resource path prefix match. e.g. /api/v1/products
                        items:
                          type: string
                      method:
                        type: array
                        items:
                          type: string
                          enum:
                          - GET
                          - PUT
                          - POST
                          - DELETE
                          - HEAD
                          - OPTIONS
                          - TRACE
                          - CONNECT
                          - PATCH
                          - UNKNOWN_METHOD
                      header_name:
                        description: HTTP header that identifies the unique API client for e.g. X-apikey
                        type: string
                      per_client_ip:
                        description: Setting this applies the throttling limit to each unique Client IP address accessing the API resource
                        type: boolean
                  advanced:
                    type: object
                    description: Advanced selector keyed on arbitrary NetScaler stream-selector expressions (e.g. JSON-RPC body fields for MCP per-tool limits). Mutually exclusive with 'basic'.
                    properties:
                      rules:
                        type: array
                        description: NetScaler stream-selector expressions; each item is one selectlet, e.g. HTTP.REQ.BODY(100000).XPATH_JSON(xp%/params/name%)
                        items:
                          type: string
                          maxLength: 7991
                        minItems: 1
                        maxItems: 5
                      include_base_selectors:
                        type: boolean
                        description: When true (default) HTTP.REQ.LB_VSERVER.NAME and HTTP.REQ.HOSTNAME are appended to the selector. Set false to use only the rules above (e.g. a global per-tool limit).
                      match:
                        type: string
                        description: Optional NetScaler boolean expression AND-ed into the rate-limit responder policy so the limit applies only to matching traffic, e.g. http.req.body(100000).xpath_json(xp%/method%).eq("tools/call")
                        maxLength: 7991
              req_threshold:
                description: Max requests per timeslice units to be allowed
                type: integer
              timeslice:
                description: Timeslice in miliseconds in multiple of 10. Defaults to 1000 miliseconds
                type: integer
              limittype:
                description: Burst mode or smooth. Defaults to smooth limittype if not specified
                type: string
                enum:
                - BURSTY
                - SMOOTH
              throttle_action:
                type: string
                enum:
                - DROP
                - RESET
                - REDIRECT
                - RESPOND
                description: Drop will drop the requests exceeding limits, RESET will reset the client connection, Redirect will redirect to specified URL, respond will respond with 429 'Exceeded allowed rate of requests'
              redirect_url:
                type: string
                description: Redirect-URL
              logpackets:
                type: object
                description: Adds an audit message action. The action specifies whether to log the message, and to which log.
                properties:
                  logexpression:
                    description: Default-syntax expression that defines the format and content of the log message.
                    type: string
                    maxLength: 7991
                  loglevel:
                    description: Audit log level, which specifies the severity level of the log message being generated.
                    type: string
                    enum:
                    - EMERGENCY
                    - ALERT
                    - CRITICAL
                    - ERROR
                    - WARNING
                    - NOTICE
                    - INFORMATIONAL
                    - DEBUG
                required:
                - logexpression
                - loglevel
              goto_priority_expression:
                type: string
                description: gotoPriorityExpression applied to the rate-limit responder policy bindings of this resource. NEXT continues policy evaluation after this policy; END stops it.
                enum:
                - NEXT
                - END
              ratelimits:
                type: array
                description: List of stream identifier configurations for traffic analytics and tracking.
                items:
                  type: object
                  required:
                  - req_threshold
                  properties:
                    req_threshold:
                      description: Max requests per timeslice units to be allowed
                      type: integer
                    timeslice:
                      description: Timeslice in miliseconds in multiple of 10. Defaults to 1000 miliseconds
                      type: integer
                    limittype:
                      description: Burst mode or smooth. Defaults to smooth limittype if not specified
                      type: string
                      enum:
                      - BURSTY
                      - SMOOTH
                    mode:
                      description: Burst mode or smooth. Defaults to smooth limittype if not specified
                      type: string
                      enum:
                      - REQUEST_RATE
                      - CONNECTION
                      - TOKEN_RATE
                    alertsintimeslice:
                      description: Burst mode or smooth. Defaults to smooth limittype if not specified
                      type: integer
                    throttle_action:
                      type: string
                      enum:
                      - DROP
                      - RESET
                      - REDIRECT
                      - RESPOND
                      - NOOP
                      description: Drop will drop the requests exceeding limits, RESET will reset the client connection, Redirect will redirect to specified URL, respond will respond with 429 'Exceeded allowed rate of requests'
                    redirect_url:
                      type: string
                      description: Redirect-URL
                    respond_with:
                      type: string
                      description: Custom NetScaler respondwith target expression used when throttle_action is RESPOND; overrides the default HTTP 429 response. e.g. an MCP JSON-RPC error body that echoes the request jsonrpc/id fields.
                      maxLength: 7991
                    logpackets:
                      type: object
                      description: Adds an audit message action. The action specifies whether to log the message, and to which log.
                      properties:
                        logexpression:
                          description: Default-syntax expression that defines the format and content of the log message.
                          type: string
                          maxLength: 7991
                        loglevel:
                          description: Audit log level, which specifies the severity level of the log message being generated.
                          type: string
                          enum:
                          - EMERGENCY
                          - ALERT
                          - CRITICAL
                          - ERROR
                          - WARNING
                          - NOTICE
                          - INFORMATIONAL
                          - DEBUG
                      required:
                      - logexpression
                      - loglevel
              streams:
                type: array
                description: List of stream identifier configurations for traffic analytics and tracking.
                items:
                  type: object
                  required:
                  - sort
                  properties:
                    interval:
                      type: integer
                      description: Number of minutes of data to use when calculating session statistics (number of requests, bandwidth, and response times).
                      minimum: 1
                      maximum: 10080
                    sampleCount:
                      type: integer
                      description: Size of the sample from which to select a request for evaluation. To evaluate all requests, set the sample count to 1.
                      minimum: 1
                      maximum: 65535
                    sort:
                      type: string
                      description: Sort stored records by the specified statistics column, in descending order.
                      enum:
                      - REQUESTS
                      - CONNECTIONS
                      - RESPTIME
                      - BANDWIDTH
                      - RESPTIME_BREACHES
                      - TOKENS
                      - NONE
                      default: REQUESTS
                    snmpTrap:
                      type: string
                      description: Enable/disable SNMP trap for stream identifier.
                      enum:
                      - ENABLED
                      - DISABLED
                    appflowLog:
                      type: string
                      description: Enable/disable Appflow logging for stream identifier.
                      enum:
                      - ENABLED
                      - DISABLED
                    trackAckOnlyPackets:
                      type: string
                      description: Track ack only packets as well. Applicable only when packet rate limiting is being used.
                      enum:
                      - ENABLED
                      - DISABLED
                    trackTransactions:
                      type: string
                      description: Track transactions exceeding configured threshold. When set to TOKENS, minTransactionThreshold, maxTransactionThreshold, acceptanceThreshold and breachThreshold are not applicable.
                      enum:
                      - RESPTIME
                      - TOKENS
                      - NONE
                    maxTransactionThreshold:
                      type: integer
                      description: Maximum per transaction value of metric. Metric to be tracked is specified by trackTransactions attribute.
                      minimum: 0
                    minTransactionThreshold:
                      type: integer
                      description: Minimum per transaction value of metric. Metric to be tracked is specified by trackTransactions attribute.
                      minimum: 0
                    acceptanceThreshold:
                      type: string
                      description: Non-Breaching transactions to Total transactions threshold expressed in percent. Maximum of 6 decimal places is supported.
                      maxLength: 10
                    breachThreshold:
                      type: integer
                      description: Breaching transactions threshold calculated over interval.
                      minimum: 0
                    log:
                      type: string
                      description: Location where objects collected on the identifier will be logged.
                      enum:
                      - SYSLOG
                      - NONE
                    logInterval:
                      type: integer
                      description: Time interval in minutes for logging the collected objects. Should be greater than or equal to the interval of the stream identifier.
                      minimum: 1
                      maximum: 10080
                    logLimit:
                      type: integer
                      description: Maximum number of objects to be logged in the log interval.
                      minimum: 1
                      maximum: 1000
            anyOf:
            - required:
              - req_threshold
            - required:
              - ratelimits
            - required:
              - streams
---
