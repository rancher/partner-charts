  names:
    kind: owasppolicy
    listKind: owasppolicyList
    plural: owasppolicies
    singular: owasppolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Current Status of the CRD
      jsonPath: .status.state
      name: Status
      type: string
    - description: Status Message
      jsonPath: .status.status_message
      name: Message
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              bot:
                properties:
                  allow-and-block-list:
                    properties:
                      rules:
                        items:
                          properties:
                            action:
                              enum:
                              - allow
                              - block
                              type: string
                            expression:
                              description: Rule expression for allow/block logic
                              type: string
                          type: object
                        type: array
                    type: object
                  bot-signature:
                    type: string
                  bot-tps:
                    type: object
                    description: >-
                      TPS based bot enforcement. Use `enforcements` to configure
                      more than one enforcement type; the inline fields below are
                      the single-enforcement short form and are ignored when
                      `enforcements` is present. `enforcement-type: ClientIP`
                      becomes NetScaler type SOURCE_IP, which cannot coexist with
                      a `rate-limit` policy using `sourceip` unless that policy
                      carries a `condition`.
                    properties:
                      action:
                        default: drop
                        enum:
                        - reset
                        - drop
                        - none
                        type: string
                      enforcement-type:
                        type: string
                        description: Bot requests per second (TPS) based enforcement type
                        default: ClientIP
                        enum:
                        - ClientIP
                        - GeoLocation
                        - Host
                        - SourceUrl
                      minimum-tps:
                        type: integer
                        description: Minimum bot TPS threshold for enforcement
                        minimum: 1
                        maximum: 4294967295
                      maximum-tps-percentage:
                        type: integer
                        description: Maximum TPS increase percentage (per 30-minute interval)
                        minimum: 10
                        maximum: 4294967295
                      enabled:
                        type: string
                        description: Enable or disable this TPS binding on the NetScaler
                        enum:
                        - 'ON'
                        - 'OFF'
                      enforcements:
                        type: array
                        description: One TPS binding per enforcement type
                        items:
                          type: object
                          properties:
                            action:
                              default: drop
                              enum:
                              - reset
                              - drop
                              - none
                              type: string
                            enforcement-type:
                              type: string
                              description: Bot requests per second (TPS) based enforcement type
                              default: ClientIP
                              enum:
                              - ClientIP
                              - GeoLocation
                              - Host
                              - SourceUrl
                            minimum-tps:
                              type: integer
                              description: Minimum bot TPS threshold for enforcement
                              minimum: 1
                              maximum: 4294967295
                            maximum-tps-percentage:
                              type: integer
