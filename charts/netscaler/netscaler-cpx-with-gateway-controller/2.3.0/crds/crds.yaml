apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpprofiles.citrix.com
spec:
  group: citrix.com
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
      - name: Accepted
        type: string
        description: "Whether the controller accepted the mcpprofile spec"
        jsonPath: '.status.conditions[?(@.type=="Accepted")].status'
      - name: Programmed
        type: string
        description: "Whether the config was programmed to NetScaler"
        jsonPath: '.status.conditions[?(@.type=="Programmed")].status'
      - name: ResolvedRefs
        type: string
        description: "Whether the mcpTokenOrApi Secret reference resolved"
        jsonPath: '.status.conditions[?(@.type=="ResolvedRefs")].status'
      - name: Profile Type
        type: string
        description: "FRONTEND or BACKEND MCP profile"
        jsonPath: .spec.config.profileType
      - name: Proxy Mode
        type: string
        description: "FORWARD or REVERSE proxy deployment"
        jsonPath: .spec.config.proxyMode
      schema:
        openAPIV3Schema:
          type: object
          properties:
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: "Gateway-API-style conditions for the mcpprofile (Accepted, Programmed, ResolvedRefs)."
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
            spec:
              type: object
              required:
                - config
              properties:
                config:
                  type: object
                  description: "MCP profile configuration applied to NetScaler via NITRO 'add mcpProfile'."
                  x-kubernetes-validations:
                    - rule: "!has(oldSelf.profileType) || !has(self.profileType) || self.profileType == oldSelf.profileType"
                      message: "profileType is immutable once set"
                  properties:
                    profileType:
                      type: string
                      description: "Whether this profile applies on the client-facing (FRONTEND) or backend-facing (BACKEND) side of the MCP proxy."
                      enum:
                        - FRONTEND
                        - BACKEND
                      default: BACKEND
                    proxyMode:
                      type: string
                      description: "FORWARD: NetScaler in client env routing to many MCP servers via a custom header. REVERSE: NetScaler in front of a single MCP backend. BACKEND only; ignored for FRONTEND profiles."
                      enum:
                        - FORWARD
                        - REVERSE
                      default: FORWARD
                    hostReplacement:
                      type: string
                      description: "Forward-proxy only. Replace the client Host header with the target MCP server FQDN before forwarding. BACKEND only; ignored for FRONTEND profiles. Dropped by the controller when proxyMode is REVERSE (NITRO rejects it there)."
                      enum:
                        - ENABLED
                        - DISABLED
                      default: ENABLED
                    urlReplacement:
                      type: string
                      description: "Forward-proxy only. Rewrite the client URL to the backend MCP URL before forwarding. BACKEND only; ignored for FRONTEND profiles. Dropped by the controller when proxyMode is REVERSE (NITRO rejects it there)."
                      enum:
                        - ENABLED
                        - DISABLED
                      default: ENABLED
                    insertHeaderInClientRequest:
                      type: string
                      description: "If ENABLED, NetScaler injects the PAT from mcpTokenOrApi as an Authorization header on client requests, so no rewrite policy is needed. BACKEND only; ignored for FRONTEND profiles."
                      enum:
                        - ENABLED
                        - DISABLED
                      default: DISABLED
                    mcpProtocolVersion:
                      type: string
                      description: "MCP protocol version advertised during monitoring of an MCP server."
                      maxLength: 10
                    mcpTokenOrApi:
                      type: object
                      description: "Reference to a Kubernetes Secret whose value is the full Bearer/API token header (NITRO tokenOrApi, max 255 chars). Used for monitoring probes and, when insertHeaderInClientRequest=ENABLED, for client data traffic. The raw token is never inlined in the CR."
                      required:
                        - name
                      properties:
                        name:
                          type: string
                          description: "Name of the Kubernetes Secret containing the PAT."
                          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                        namespace:
                          type: string
                          description: "Namespace of the Secret. Defaults to the namespace of the mcpprofile."
                          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                        key:
                          type: string
                          description: "Key within the Secret data that holds the PAT."
                          default: token
                    comment:
                      type: string
                      description: "Any information about the MCP profile."
                      maxLength: 255
  scope: Namespaced
  names:
    plural: mcpprofiles
    singular: mcpprofile
    kind: mcpprofile
    shortNames:
    - mcpp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aigatewayprofiles.citrix.com
spec:
  group: citrix.com
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
      - name: Status
        type: string
        description: "Current Status of the CRD"
        jsonPath: .status.state
      - name: Message
        type: string
        description: "Status Message"
        jsonPath: .status.status_message
      - name: Profile Type
        type: string
        description: "Type of AI Gateway Profile"
        jsonPath: .spec.config.profiletype
      - name: Endpoint Type
        type: string
        description: "Endpoint Type"
        jsonPath: .spec.config.endpointtype
      schema:
        openAPIV3Schema:
          type: object
          properties:
            status:
              type: object
              properties:
                state:
                  type: string
                status_message:
                  type: string
            spec:
              type: object
              required:
                - gatewayClassName
              x-kubernetes-validations:
                - rule: "has(self.preconfigured) != has(self.config)"
                  message: "preconfigured and config are mutually exclusive fields. Please specify exactly one of them."
              properties:
                gatewayClassName:
                  type: string
                  description: "Name of the GatewayClass that this AI Gateway profile should be applied to. The profile is applied only when this matches a GatewayClass managed by this controller."
                preconfigured:
                  type: string
                  description: "Mutually exclusive with 'config'. Name of a preconfigured, built-in AI Gateway profile on the NetScaler to use."
                config:
                  type: object
                  description: "Mutually exclusive with 'preconfigured'. Contains all the parameters related to the NetScaler Nitro API for a fully custom AI Gateway profile. Customers can specify any valid Nitro AI Gateway profile parameters."
                  x-kubernetes-validations:
                    - rule: "!has(oldSelf.profiletype) || !has(self.profiletype) || self.profiletype == oldSelf.profiletype"
                      message: "profiletype is immutable once set"
                    - rule: "!has(oldSelf.endpointtype) || !has(self.endpointtype) || self.endpointtype == oldSelf.endpointtype"
                      message: "endpointtype is immutable once set"
                    - rule: "!has(oldSelf.authtoken) || !has(self.authtoken) || self.authtoken == oldSelf.authtoken"
                      message: "authtoken is immutable once set"
                  properties:
                    profiletype:
                      type: string
                      description: "Type of AI Gateway profile: backend or frontend"
                      enum:
                        - backend
                        - frontend
                    endpointtype:
                      type: string
                      description: "Type of AI endpoint (e.g., azureopenai, openai, anthropic, etc.)"
                      enum:
                        - azureopenai
                    tokenquota:
                      type: integer
                      description: "Token quota limit for backend profiles. Only applicable when profiletype is 'backend'."
                      minimum: 0
                      maximum: 2147483647
                    quotarefreshfrequency:
                      type: integer
                      description: "Quota refresh rate, in minutes."
                      minimum: 1
                      maximum: 65535
                    authtoken:
                      type: object
                      description: "Authentication token/API Key for the AI GW Endpoint, sourced from a Kubernetes Secret."
                      required:
                        - name
                      properties:
                        name:
                          type: string
                          description: "Name of the Kubernetes Secret object containing the auth token."
                          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                        namespace:
                          type: string
                          description: "Namespace of the Kubernetes Secret object. Defaults to the namespace of the AI Gateway Profile."
                          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                  additionalProperties: true
  scope: Namespaced
  names:
    plural: aigatewayprofiles
    singular: aigatewayprofile
    kind: aigatewayprofile
    shortNames:
    - aigwp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aigatewayroutes.citrix.com
spec:
  group: citrix.com
  names:
    kind: aigatewayroute
    listKind: aigatewayroutelist
    plural: aigatewayroutes
    singular: aigatewayroute
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.parents[0].conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .status.parents[0].conditions[?(@.type=="Programmed")].status
      name: Programmed
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          AIGatewayRoute combines multiple AIServiceBackends and attaches them to Gateway resources
          for the NetScaler Kubernetes Gateway.

          This serves as a way to define a "unified" AI API for a Gateway which allows downstream
          clients to use a single schema API to interact with multiple AI backends across providers.

          NetScaler Kubernetes Gateway provides the following capabilities for AIGatewayRoute:

            - Header and policy-based routing to AI backends via HTTPRoute of the Gateway API.
              The name of the HTTPRoute is the same as the AIGatewayRoute.
            - Priority-based model spillover to backup backends, enabling automatic failover
              when primary AI backends are unavailable or overloaded.
            - Separate frontend and backend AI gateway profiles for multi-provider deployments,
              allowing independent configuration of client-facing and upstream AI service policies.
            - RateLimit and Rewrite Policy CRD support for fine-grained traffic control
              and request/response transformation.
            - SSLProfile, TCPProfile, and HTTPProfile CRDs for protocol-level tuning
              of AI backend connections.
            - Built-in TCP, HTTP, and streaming analytics for observability of AI traffic
              patterns, token usage, and backend performance.

          All of these resources are created in the same namespace as the AIGatewayRoute. You can
          customize the default behavior by attaching NetScaler policy CRDs (RateLimit, Rewrite,
          SSLProfile, TCPProfile, HTTPProfile) to the generated HTTPRoute.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the details of the AIGatewayRoute.
            properties:
              aigatewayprofiles:
                description: |-
                  AIGatewayProfiles defines the default AI gateway profiles to apply to
                  the generated lbvservers and servicegroups. Frontend profiles are applied
                  to the client-facing lbvserver, spillover-frontend profiles to the spillover
                  lbvserver, and default-backend profiles to all backend servicegroups unless
                  overridden per-backendRef.
                properties:
                  frontend:
                    description: |-
                      Frontend AI gateway profile applied to the primary lbvserver.
                    properties:
                      name:
                        description: Name of the aigatewayprofile CRD resource.
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          Namespace of the aigatewayprofile. Defaults to the AIGatewayRoute namespace.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    type: object
                  spillover-frontend:
                    description: |-
                      Spillover-frontend AI gateway profile applied to the spillover lbvserver.
                    properties:
                      name:
                        description: Name of the aigatewayprofile CRD resource.
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          Namespace of the aigatewayprofile. Defaults to the AIGatewayRoute namespace.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    type: object
                  default-backend:
                    description: |-
                      Default backend AI gateway profile applied to all backend servicegroups
                      unless overridden by a per-backendRef backend-aigatewayprofile.
                    properties:
                      name:
                        description: Name of the aigatewayprofile CRD resource.
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          Namespace of the aigatewayprofile. Defaults to the AIGatewayRoute namespace.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    type: object
                type: object
              hostnames:
                description: |-
                  Hostnames defines a set of hostnames that should match against the HTTP Host
                  header to select an AIGatewayRoute used to process the request. Implementations
                  MUST ignore any port value specified in the HTTP Host header while
                  performing a match and (absent of any applicable header modification
                  configuration) MUST forward this header unmodified to the backend.

                  Valid values for Hostnames are determined by RFC 1123 definition of a
                  hostname with 2 notable exceptions:

                  1. IPs are not allowed.
                  2. A hostname may be prefixed with a wildcard label (`*.`). The wildcard
                     label must appear by itself as the first label.

                  If a hostname is specified by both the Listener and AIGatewayRoute, there
                  must be at least one intersecting hostname for the AIGatewayRoute to be
                  attached to the Listener.

                  Hostnames that are prefixed with a wildcard label (`*.`) are interpreted
                  as a suffix match. That means that a match for `*.example.com` would match
                  both `test.example.com`, and `foo.test.example.com`, but not `example.com`.

                  If both the Listener and AIGatewayRoute have specified hostnames, and none
                  match with the criteria above, then the AIGatewayRoute is not accepted. The
                  implementation must raise an 'Accepted' Condition with a status of
                  `False` in the corresponding RouteParentStatus.

                  Support: Core
                items:
                  description: |-
                    Hostname is the fully qualified domain name of a network host. This matches
                    the RFC 1123 definition of a hostname with 2 notable exceptions:

                     1. IPs are not allowed.
                     2. A hostname may be prefixed with a wildcard label (`*.`). The wildcard
                        label must appear by itself as the first label.

                    Hostname can be "precise" which is a domain name without the terminating
                    dot of a network host (e.g. "foo.example.com") or "wildcard", which is a
                    domain name prefixed with a single wildcard label (e.g. `*.example.com`).

