apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netscaler-ingress-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
{{- if .Values.openshift }}
      router: {{ include "netscaler-ingress-controller.fullname" . }}
{{- else }}
      app: {{ include "netscaler-ingress-controller.fullname" . }}
{{- end }}
  replicas: 1
{{- if and (has (lower (toString .Values.clearStaleServiceStatus)) (list "true" "yes" "on" "1")) (has (lower (toString .Values.updateServiceStatus)) (list "false" "no" "off" "0")) }}
  # Stop the old pod before the new one starts while clearing stale service status.
  strategy:
    type: Recreate
    # Clears the default rollingUpdate settings so helm upgrade succeeds.
    rollingUpdate: null
{{- end }}
  template:
    metadata:
      name: nsic
      labels:
{{- if .Values.openshift }}
        router: {{ include "netscaler-ingress-controller.fullname" . }}
{{- else }}
        app: {{ include "netscaler-ingress-controller.fullname" . }}
{{- end }}
      annotations:
{{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ include "netscaler-ingress-controller.serviceAccountName" . }}
{{- if .Values.nsValidateCert }}
      hostAliases:
      - ip: {{ required "hostAlias.ip is mandatory when nsValidateCert is true: set it to the NetScaler management IP." .Values.hostAlias.ip | quote }}
        hostnames:
          - {{ required "hostAlias.hostName is mandatory when nsValidateCert is true: set it to the hostname present in the NetScaler certificate, and use that hostname in nsIP." .Values.hostAlias.hostName | quote }}
{{- end }}
{{- if .Values.initContainers }}
      initContainers:
{{- toYaml .Values.initContainers | nindent 6 }}
{{- end }}
      containers:
      - name: nsic
        image: "{{ tpl .Values.image . }}"
        imagePullPolicy: {{ .Values.pullPolicy }}
{{- if .Values.enableReadinessProbe }}
        readinessProbe:
        {{- toYaml .Values.readinessProbe | nindent 10 }}
{{- end }}
{{- if .Values.enableLivenessProbe }}
        livenessProbe:
        {{- toYaml .Values.livenessProbe | nindent 10 }}
{{- end }}
        args:
          - --configmap
            {{ .Release.Namespace }}/{{ include "nsicconfigmap.fullname" . }}
{{- if .Values.defaultSSLCertSecret }}
          - --default-ssl-certificate
            {{ .Release.Namespace }}/{{ .Values.defaultSSLCertSecret }}
{{- end }}
{{- if .Values.defaultSSLSNICertSecret }}
          - --default-ssl-sni-certificate
            {{ .Release.Namespace }}/{{ .Values.defaultSSLSNICertSecret }}
{{- end }}
{{- if .Values.ingressClass }}
          - --ingress-classes
{{- range .Values.ingressClass}}
            {{.}}
{{- end }}
{{- end }}
{{- if .Values.serviceClass }}
          - --service-classes
{{- range .Values.serviceClass}}
            {{.}}
{{- end }}
{{- end }}
          - --feature-node-watch
            {{ .Values.nodeWatch }}
          - --enable-cnc-pbr
            {{ .Values.nsncPbr }}
{{- if .Values.ipam }}
          - --ipam
            citrix-ipam-controller
{{- end }}
{{- if .Values.disableAPIServerCertVerify }}
          - --disable-apiserver-cert-verify
            {{ .Values.disableAPIServerCertVerify }}
{{- end }}
{{- if .Values.updateIngressStatus }}
          - --update-ingress-status
            yes
{{- end }}
{{- if has (lower (toString .Values.updateServiceStatus)) (list "false" "no" "off" "0") }}
          - --update-service-status
            no
{{- end }}
{{- if has (lower (toString .Values.clearStaleServiceStatus)) (list "true" "yes" "on" "1") }}
          - --clear-stale-service-status
            yes
{{- end }}
        env:
        - name: "NS_IP"
          value: "{{ .Values.nsIP }}"
{{- if .Values.nsVIP }}
        - name: "NS_VIP"
          value: "{{ .Values.nsVIP }}"
{{- end }}
{{- if .Values.certBundle }}
        - name: "CERT_BUNDLE"
          value: "true"
{{- end }}
{{- if .Values.rbacRole }}
        - name: "SCOPE"
          value: "local"
{{- end }}
{{- if .Values.nitroReadTimeout }}
        - name: "NS_NITRO_READ_TIMEOUT"
          value: "{{ .Values.nitroReadTimeout }}"
{{- end }}
{{- if .Values.enableLivenessProbe }}
        - name: "LIVENESS_FILE_PATH"
          value: '/tmp/liveness_path.log'
{{- end }}
{{- if .Values.nsValidateCert }}
        - name: "NS_VALIDATE_CERT"
          value: "yes"
        - name: "NS_CACERT_PATH"
          value: "/etc/cacerts/nsCA.pem"
{{- end }}
        - name: "ENABLE_LIVENESS_PROBE"
          value: {{ .Values.enableLivenessProbe | quote }}
{{- if .Values.vaultCredentials.enabled }}
        - name: "NS_CRED_HOTRELOAD"
          value: "yes"
        - name: "NS_CREDENTIAL_WAIT_SECONDS"
          value: {{ if kindIs "invalid" .Values.vaultCredentials.credentialWaitSeconds }}"120"{{ else }}{{ .Values.vaultCredentials.credentialWaitSeconds | quote }}{{ end }}
        - name: "NS_SECRET_DIR"
          value: {{ .Values.vaultCredentials.mountPath | quote }}
{{- else }}
        - name: "NS_CRED_HOTRELOAD"
          value: "no"
{{- end }}
{{- if not (and .Values.vaultCredentials.enabled .Values.vaultCredentials.suppressEnvCredentials) }}
        - name: "NS_USER"
        {{- if and .Values.secretStore.enabled .Values.secretStore.username}}
        {{- toYaml .Values.secretStore.username | nindent 10 }}
        {{- else }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.adcCredentialSecret }}
              key: username
        {{- end }}
        - name: "NS_PASSWORD"
        {{- if and .Values.secretStore.enabled .Values.secretStore.password}}
        {{- toYaml .Values.secretStore.password | nindent 10 }}
        {{- else }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.adcCredentialSecret }}
              key: password
        {{- end }}
{{- end }}
        - name: "EULA"
          value: "{{ .Values.license.accept }}"
{{- if and .Values.openshift .Values.routeLabels }}
        - name: "ROUTE_LABELS"
          value: {{ .Values.routeLabels | quote}}
{{- end }}
{{- if and .Values.openshift .Values.namespaceLabels }}
        - name: "NAMESPACE_LABELS"
          value: {{ .Values.namespaceLabels | quote }}
{{- end }}
        - name: "NS_APPS_NAME_PREFIX"
          value: {{ .Values.entityPrefix | default "k8s"| quote }}
        - name: "NS_MC_PREFIX"
          value: {{ .Values.multiClusterPrefix | default "mc"| quote }}
{{- if .Values.kubernetesURL }}
        - name: "kubernetes_url"
          value: "{{ .Values.kubernetesURL }}"
{{- end }}
{{- if .Values.clusterName }}
        - name: "CLUSTER_NAME"
          value: "{{ .Values.clusterName }}"
{{- end }}
{{- if .Values.logProxy }}
        - name: "NS_LOGPROXY"
          value: "{{ .Values.logProxy }}"
{{- end }}
{{- if .Values.disableOpenshiftRoutes }}
        - name: "DISABLE_OPENSHIFT_ROUTES"
          value: "{{ .Values.disableOpenshiftRoutes }}"
{{- end }}
{{- if .Values.nsConfigDnsRec }}
        - name: "NS_CONFIG_DNS_REC"
          value: "{{ .Values.nsConfigDnsRec }}"
{{- end }}
{{- if .Values.nsSvcLbDnsRec }}
        - name: "NS_SVC_LB_DNS_REC"
          value: "{{ .Values.nsSvcLbDnsRec }}"
{{- end }}
{{- if .Values.optimizeEndpointBinding }}
        - name: "OPTIMIZE_ENDPOINT_BINDING"
          value: "{{ .Values.optimizeEndpointBinding }}"
{{- end }}
{{- if .Values.nodeLabels }}
        - name: "NODE_LABELS"
          value: "{{ .Values.nodeLabels }}"
{{- end  }}
{{- if and .Values.nodeWatch .Values.nodeWatchLabelSelector }}
        - name: "NODE_WATCH_LABEL_SELECTOR"
          value: {{ include "nsic.nodeWatchLabelSelectorToString" .Values.nodeWatchLabelSelector | quote }}
{{- end }}
{{- if .Values.openshift }}
        - name: "PLATFORM"
          value: "OPENSHIFT"
{{- else }}
        - name: "PLATFORM"
          value: "KUBERNETES"
{{- end  }}
        - name: "BGP_ADVERTISEMENT"
          value: {{ .Values.bgpAdvertisement | quote }}
{{- if .Values.extraEnv }}
{{- toYaml .Values.extraEnv | nindent 8 }}
{{- end }}
        resources:
            {{- toYaml .Values.resources | nindent 12 }}
        volumeMounts:
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: volume-for-service-account
          readOnly: true
        {{- if .Values.vaultCredentials.enabled }}
        - name: citrix-creds
          mountPath: {{ .Values.vaultCredentials.mountPath }}
        {{- end }}
        {{- if .Values.nsValidateCert }}
        - name: certs
          mountPath: /etc/cacerts
          readOnly: true
        {{- end }}
        {{- if ne (len .Values.extraVolumeMounts) 0 }}
{{- toYaml .Values.extraVolumeMounts | nindent 8 }}
        {{- end }}
{{- if .Values.exporter.required }}
{{- $exporterValidateCert := .Values.exporter.validateCert | toString | lower }}
{{- if .Values.nsValidateCert }}
{{- $exporterValidateCert = "yes" }}
{{- else if has $exporterValidateCert (list "auto" "yes" "true" "y" "on" "1") }}
{{- $exporterValidateCert = "auto" }}
{{- else if has $exporterValidateCert (list "no" "false" "n" "off" "0") }}
{{- $exporterValidateCert = "no" }}
{{- else }}
{{- fail "exporter.validateCert must be set explicitly when exporter.required is true. Set it to \"auto\" so the exporter validates the NetScaler certificate, or set nsValidateCert=true together with nsCertSecret and hostAlias to validate against your own CA, or set it to \"no\" to turn validation off (not recommended). \"auto\" needs exporter 1.7.0 or later, which exporter.imageTag pins by default; with an older image, use nsValidateCert=true instead." }}
{{- end }}
{{- if .Values.nsValidateCert }}
{{- range .Values.exporter.extraVolumeMounts }}
{{- if eq (toString .mountPath) "/etc/cacerts" }}
{{- fail "exporter.extraVolumeMounts declares a mount at /etc/cacerts, which nsValidateCert=true already uses for the NetScaler CA. Kubernetes rejects two volumeMounts sharing a mountPath in one container, and were it accepted the CA at /etc/cacerts/nsCA.pem would be shadowed and the exporter would exit 3 into CrashLoopBackOff. Move your mount to another path, or leave nsValidateCert unset and mount the CA yourself." }}
{{- end }}
{{- end }}
{{- end }}
      - name: exporter
        image: "{{ tpl .Values.exporter.image . }}"
        imagePullPolicy: {{ .Values.exporter.pullPolicy }}
        args:
          # The exporter always uses HTTPS on port 443.
          - "--secure=yes"
          - "--target-nsip={{ .Values.nsIP }}"
          - "--port={{ .Values.exporter.ports.containerPort }}"
        env:
        - name: "NS_VALIDATE_CERT"
          value: {{ $exporterValidateCert | quote }}
{{- if .Values.nsValidateCert }}
        - name: "NS_CACERT_PATH"
          value: "/etc/cacerts/nsCA.pem"
{{- end }}
{{- /* Skip env credentials only when the exporter gets the shared credential files. */}}
{{- if not (and .Values.vaultCredentials.enabled .Values.vaultCredentials.suppressEnvCredentials .Values.vaultCredentials.shareWithExporter) }}
        - name: "NS_USER"
        {{- if and .Values.secretStore.enabled .Values.secretStore.username}}
        {{- toYaml .Values.secretStore.username | nindent 10 }}
        {{- else }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.adcCredentialSecret }}
              key: username
        {{- end }}
        - name: "NS_PASSWORD"
        {{- if and .Values.secretStore.enabled .Values.secretStore.password}}
        {{- toYaml .Values.secretStore.password | nindent 10 }}
        {{- else }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.adcCredentialSecret }}
              key: password
        {{- end }}
{{- end }}
        {{- if or .Values.nsValidateCert (ne (len .Values.exporter.extraVolumeMounts) 0) (and .Values.vaultCredentials.enabled .Values.vaultCredentials.shareWithExporter) }}
        volumeMounts:
        {{- if .Values.nsValidateCert }}
        - name: certs
          mountPath: /etc/cacerts
          readOnly: true
        {{- end }}
        {{- if and .Values.vaultCredentials.enabled .Values.vaultCredentials.shareWithExporter }}
        - name: citrix-creds
          mountPath: /mnt/nslogin
        {{- end }}
        {{- if ne (len .Values.exporter.extraVolumeMounts) 0 }}
        {{- toYaml .Values.exporter.extraVolumeMounts | nindent 8 }}
        {{- end }}
        {{- end }}
        resources:
{{- toYaml .Values.exporter.resources | nindent 12 }}
{{- end }}
{{- if .Values.extraContainers }}
{{- toYaml .Values.extraContainers | nindent 6 }}
{{- end }}
      volumes:
      - name: volume-for-service-account
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: {{ .Values.serviceAccount.tokenExpirationSeconds }}
          - configMap:
              items:
                - key: ca.crt
                  path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
                - fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.namespace
                  path: namespace
      {{- if .Values.nsValidateCert }}
      - name: certs
        secret:
          secretName: {{ required "nsCertSecret is mandatory when nsValidateCert is true: create a secret holding the NetScaler CA certificate as nsCA.pem and set nsCertSecret to its name." .Values.nsCertSecret }}
      {{- end }}
      {{- if .Values.vaultCredentials.enabled }}
      - name: citrix-creds
        emptyDir:
          medium: Memory
      {{- end }}
{{- if ne (len .Values.extraVolumes) 0 }}
{{ toYaml .Values.extraVolumes | indent 6 }}
{{- end }}
{{- if and .Values.nodeSelector.key .Values.nodeSelector.value }}
      nodeSelector:
        {{ .Values.nodeSelector.key }}: {{ .Values.nodeSelector.value }}
{{- end }}
{{- if .Values.tolerations }}
      tolerations: {{ .Values.tolerations | toYaml | nindent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
{{- end }}

---

{{- if .Values.exporter.required }}


apiVersion: v1
kind: Service
metadata:
   name: {{ include "exporter.fullname" . }}
   labels:
     app: {{ include "exporter.fullname" . }}
     service-type: {{ include "servicemonitorlabel" . }}
spec:
   type: ClusterIP
   ports:
   - port: {{ .Values.exporter.ports.containerPort }}
     targetPort: {{ .Values.exporter.ports.containerPort }}
     name: exporter-port
   selector:
{{- if .Values.openshift }}
     router: {{ include "netscaler-ingress-controller.fullname" . }}
{{- else }}
     app: {{ include "netscaler-ingress-controller.fullname" . }}
{{- end }}

---

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "servicemonitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    servicemonitor: netscaler
    {{- with .Values.exporter.serviceMonitorExtraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  endpoints:
  - interval: 30s
    port: exporter-port
  selector:
    matchLabels:
      service-type: {{ include "servicemonitorlabel" . }}
  namespaceSelector:
    matchNames:
    - monitoring
    - default
    - {{ .Release.Namespace }}

{{- end }}
