                    type: object
                    properties:
                      action:
                        default: drop
                        enum:
                        - reset
                        - drop
                        - none
                        type: string
                      enforcement-type:
                        type: string
                        description: Bot requests per second (TPS) based enforcement type
                        default: ClientIP
                        enum: 
                        - ClientIP
                        - GeoLocation
                        - Host
                        - SourceUrl
                      minimum-tps:
                        type: integer
                        description: Minimum bot TPS threshold for enforcement
                      maximum-tps-percentage:
                        type: integer
                        description: Maximum TPS increase percentage (per 30-minute interval)
                  bot-trap:
                    properties:
                      enforcements:
                        items:
                          properties:
                            action:
                              default: block
                              enum:
                              - block
                              - log
                              - redirect
                              - none
                              type: string
                            enforcement-url:
                              type: string
                          type: object
                        type: array
                    type: object
                  device-fingerprint:
                    properties:
                      action:
                        default: log
                        enum:
                        - block
                        - log
                        - none
                        type: string
                    type: object
                  geo-blocking:
                    properties:
                      blocked-countries:
                        items:
                          description: ISO country codes to block (e.g., US, CN, RU)
                          type: string
                        type: array
                    type: object
                  ip-reputation:
                    properties:
                      categories:
                        properties:
                          anonymous-or-suspicious-proxies:
                            default: true
                            type: boolean
                          botnets-ransomware-ccs:
                            default: true
                            type: boolean
                          cloud:
                            default: true
                            type: boolean
                          cloud-aws:
                            default: true
                            type: boolean
                          cloud-azure:
                            default: true
                            type: boolean
                          cloud-ibm:
                            default: true
                            type: boolean
                          cloud-oracle:
                            default: true
                            type: boolean
                          cloud-salesforce:
                            default: true
                            type: boolean
                          dos:
                            default: true
                            type: boolean
                          ip:
                            default: true
                            type: boolean
                          mobile-threats:
                            default: true
                            type: boolean
                          network:
                            default: true
                            type: boolean
                          phishing:
                            default: true
                            type: boolean
                          reputation:
                            default: true
                            type: boolean
                          scanners:
                            default: true
                            type: boolean
                          spam-sources:
                            default: true
                            type: boolean
                          tor-proxies:
                            default: true
                            type: boolean
                          web-exploits:
                            default: true
                            type: boolean
                          windows-exploits:
                            default: true
                            type: boolean
                        type: object
                    type: object
                  rate-limit:
                    properties:
                      policies:
                        items:
                          type: object
                          properties:
                            action:
                              type: string
