# Default values for netscaler GSLB Controller
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# image contains information needed to fetch NSIC image
imageRegistry: quay.io
imageRepository: netscaler/netscaler-k8s-ingress-controller
imageTag: 4.3.22
image: "{{ .Values.imageRegistry }}/{{ .Values.imageRepository }}:{{ .Values.imageTag }}"
pullPolicy: IfNotPresent
imagePullSecrets: []
# openshift is set to true if charts are being deployed in OpenShift environment.
openshift: false
adcCredentialSecret: # K8s Secret Name
# Enable secretStore to implement CSI Secret Provider classes for holding the nslogin credentials
secretStore:
  enabled: false
  username: {}
    #valueFrom:
    #  configMapKeyRef:
    #    name: test1
    #    key: username
  password: {}
    #valueFrom:
    #  configMapKeyRef:
    #    name: test1
    #    key: password
nsIP: ""
license:
   accept: no
# nsPort is port for NetScaler NITRO
nsPort: 443
# nsProtocol is protocol for NetScaler NITRO
nsProtocol: HTTPS
# nitroReadTimeout is timeout value in seconds for nitro api read timeout(default is 20)
nitroReadTimeout: 20
# logLevel is to set level of NSIC Logs
logLevel: INFO
# gseAutoCreation lets the controller create and manage the GSEs of GTP targets.
# Set to false if you create all GSEs yourself.
gseAutoCreation: true
# entityPrefix is the prefix for the resources on the NetScaler
entityPrefix: ""
# API server Cert verification can be disabled, while communicating with API Server, if disableAPIServerCertVerify set to True
disableAPIServerCertVerify: False
# kubernetesURL is for registering events to kubeapi server
kubernetesURL: ""
# localRegion is the region where K8s cluster is deployed 
localRegion: ""
# localCluster is the clustername of the k8s cluster
localCluster: ""
# localSiteSelection sets preference for local site when configuring the priority order for GSLB services.
localSiteSelection: false
# sitedata is list of dictionary containing site related information like name,IP, adcCredentialSecret for credentials.
sitedata:
  - siteName: "site1"
    siteIp: "x.x.x.x"
    siteMask: ""
    sitePublicip: ""
    secretName: "site1-secret"
    siteRegion: "xxxxxxxxx"
  - siteName: "site2"
    siteIp: "x.x.x.x"
    siteMask: ""
    sitePublicip: ""
    secretName: "site2-secret"
    siteRegion: "xxxxxxxxx"

# Specifies whether a ServiceAccount should be created
serviceAccount:
  create: true
  tokenExpirationSeconds: 31536000
  # The name of the ServiceAccount to use.
  # If not set and `serviceAccount.create` is true, a name is generated using the fullname template
  # If you want to use pre-created serviceAccount, set the name and serviceAccount.create to false.
  name:

podAnnotations: {}
resources:
  requests:
    cpu: 32m
    memory: 128Mi
  # limits:
  #   cpu: 1000m
  #   memory: 1000Mi
  limits: {}
affinity: {}
nodeSelector: {}
tolerations: []
extraVolumeMounts: []
extraVolumes: []

# vaultCredentials reads ADC credentials from files written by a Vault agent sidecar
# and reloads them when they change. Add the sidecar via extraContainers.
vaultCredentials:
  enabled: false
  mountPath: /etc/citrix
  credentialWaitSeconds: 120
  suppressEnvCredentials: true

# Extra init containers, sidecar containers, and env vars for the controller pod.
initContainers: []
  # Example (remove the [] above; env and volumeMounts as in your vault-agent sidecar):
  # - name: vault-agent-init
  #   image: hashicorp/vault:1.21   # run as a Vault Agent, not a Vault server
  #   args: ["agent", "-config=/etc/vault/vault-agent-config.hcl", "-exit-after-auth"]
extraContainers: []
extraEnv: []

createClusterRoleAndBinding: true

# gatewayAPI gives the controller read-only access to Gateway API objects
# so it can create GlobalServiceEntries for Gateway-routed services.
gatewayAPI:
  enabled: true

# API Priority and Fairness configuration for the GSLB controller's API server requests
apiPriorityAndFairness:
  enabled: false
  priorityLevelConfiguration:
    nominalConcurrencyShares: 40
    lendablePercent: 25
    limitResponse:
      type: Queue
      queuing:
        queues: 16
        handSize: 4
        queueLengthLimit: 100
  flowSchema:
    matchingPrecedence: 1000
    distinguisherMethod:
      type: ByNamespace
