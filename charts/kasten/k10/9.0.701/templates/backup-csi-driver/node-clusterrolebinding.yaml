{{- if .Values.features.csiDriverIntegration }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "backup-csi-driver.fullname" . }}-node
  labels:
    {{- include "backup-csi-driver.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "backup-csi-driver.fullname" . }}-node
subjects:
  - kind: ServiceAccount
    name: {{ include "backup-csi-driver.fullname" . }}-node-sa
    namespace: {{ .Release.Namespace }}
{{- end }}
