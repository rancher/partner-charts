{{- if .Values.rbac.create }}

{{- if ne (include "get.nonClusterAdminServiceAccounts" .) "" }}
---
# admin for all k8s resources in the release namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
{{ include "helm.labels" . | indent 4 }}
  name: kasten-admin
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [ "*" ]
    resources: [ "*" ]
    verbs: [ "*" ]
{{- end }}

{{- if ne (include "get.DefaultNamespaceAccessServiceAccounts" .) "" }}
---
# access for default namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
{{ include "helm.labels" . | indent 4 }}
  name: kasten-default
  namespace: default
rules:
  - apiGroups: [ "" ]
    resources: [ "namespaces" ]
    verbs: [ "get" ]
{{- end }}

---
# auth-svc Secrets access in the K10 install namespace: OIDC signing keys and
# client secret, the Veeam Vault registration certificate, and multi-cluster
# join/status/cluster-info secrets. Replaces the former cluster-wide grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
{{ include "helm.labels" . | indent 4 }}
  name: kasten-auth-svc
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [ "" ]
    resources: [ "secrets" ]
    verbs: [ "create", "get", "list", "update", "watch" ]

{{- end }}
