{{- if .Values.features.csiDriverIntegration }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "backup-csi-driver.fullname" . }}
  labels:
    {{- include "backup-csi-driver.labels" . | nindent 4 }}
{{- /*
Below system-cluster-critical but above ordinary workloads: evicting the node
plugin while it has volumes mounted would strand every pod using them, so it must
outrank the workloads it serves without competing with the control plane.
*/}}
value: 900001000
globalDefault: false
description: "Priority class for Kopia CSI driver node deployment."
{{- end }}
