{{- if .Values.features.csiDriverIntegration }}
{{- $secretName := printf "%s-snapshot-grpc-tls" (include "backup-csi-driver.fullname" .) -}}
{{- $serverName := "backup-csi-driver-snapshot" -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if $existingSecret }}
# Reuse existing TLS secret to preserve certs across helm upgrade.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backup-csi-driver.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $val := $existingSecret.data }}
  {{ $key }}: {{ $val }}
  {{- end }}
{{- else }}
{{- $ca := genCA "backup-csi-driver-snapshot-ca" 3650 }}
{{- $serverCert := genSignedCert $serverName nil (list $serverName) 3650 $ca }}
{{- $clientCert := genSignedCert "backup-csi-driver-snapshot-client" nil nil 3650 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backup-csi-driver.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $serverCert.Cert | b64enc }}
  tls.key: {{ $serverCert.Key | b64enc }}
  client.crt: {{ $clientCert.Cert | b64enc }}
  client.key: {{ $clientCert.Key | b64enc }}
{{- end }}
{{- end }}
