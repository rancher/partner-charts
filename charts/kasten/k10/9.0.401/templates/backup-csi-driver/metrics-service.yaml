{{- if .Values.features.csiDriverIntegration }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "backup-csi-driver.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backup-csi-driver.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ include "backup-csi-driver.metricsPort" . }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "backup-csi-driver.selectorLabels" . | nindent 4 }}
{{- end }}
