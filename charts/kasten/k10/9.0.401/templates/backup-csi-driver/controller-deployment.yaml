{{- if .Values.features.csiDriverIntegration }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backup-csi-driver.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backup-csi-driver.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.backupCsiDriver.controller.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "backup-csi-driver.controllerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backup-csi-driver.controllerSelectorLabels" . | nindent 8 }}
        {{- if and .Values.backupCsiDriver.kopiaServer.serviceAccount.azureClientID .Values.backupCsiDriver.kopiaServer.serviceAccount.azureTenantID }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      {{- /* Must stay above the 5s preStop delay the sidecars use, so in-flight
      CSI RPCs can land before the containers go away. */}}
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "backup-csi-driver.controllerSelectorLabels" . | nindent 14 }}
      serviceAccountName: {{ include "backup-csi-driver.fullname" . }}-controller-sa
      {{- include "k10.imagePullSecrets" . | indent 6 }}
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: backup-csi-driver
          {{- include "serviceImage" (dict "main" . "k10_service" "backup-csi-driver") | nindent 10 }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args:
            - --mode=controller
            - --endpoint=unix:///csi/csi.sock
            - --nodeid=$(KUBE_NODE_NAME)
            - --verbosity=4
            - --metrics-address=:{{ include "backup-csi-driver.metricsPort" . }}
          ports:
            - name: metrics
              containerPort: {{ include "backup-csi-driver.metricsPort" . }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ include "backup-csi-driver.healthzPort" . }}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CSI_SNAPSHOT_SERVICE_NAME
              value: {{ include "backup-csi-driver.fullname" . }}-snapshot
            - name: CSI_SNAPSHOT_SERVICE_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: CSI_SNAPSHOT_PORT
              value: "{{ include "backup-csi-driver.snapshotPort" . }}"
            - name: CSI_SNAPSHOT_TLS_DIR
              value: "/etc/snapshot-tls"
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: snapshot-grpc-tls
              mountPath: /etc/snapshot-tls
              readOnly: true
          {{- dict "main" . "k10_service_pod_name" "backup-csi-driver-controller" "k10_service_container_name" "backup-csi-driver" | include "k10.resource.request" | trim | nindent 10 }}

        - name: csi-provisioner
          image: {{ include "backup-csi-driver.provisionerImage" . }}
          imagePullPolicy: {{ include "backup-csi-driver.sidecarPullPolicy" . }}
          args:
            - --v=5
            - --csi-address=/csi/csi.sock
            - --feature-gates=Topology=false
            - --leader-election=true
            {{- /* gRPC call timeout for CreateVolume/DeleteVolume against the
            driver, then exponential backoff between retries. */}}
            - --timeout=60s
            - --retry-interval-start=2s
            - --retry-interval-max=5m
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          {{- dict "main" . "k10_service_pod_name" "backup-csi-driver-controller" "k10_service_container_name" "csi-provisioner" | include "k10.resource.request" | trim | nindent 10 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

        - name: csi-snapshotter
          image: {{ include "backup-csi-driver.snapshotterImage" . }}
          imagePullPolicy: {{ include "backup-csi-driver.sidecarPullPolicy" . }}
          args:
            - --v=5
            - --csi-address=/csi/csi.sock
            - --leader-election=true
            {{- /* Higher than the provisioner's timeout: CreateSnapshot can drain
            a live writer over gRPC and flush a kopia upload before returning. */}}
            - --timeout=300s
            - --retry-interval-start=2s
            - --retry-interval-max=5m
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          {{- dict "main" . "k10_service_pod_name" "backup-csi-driver-controller" "k10_service_container_name" "csi-snapshotter" | include "k10.resource.request" | trim | nindent 10 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

        - name: liveness-probe
          image: {{ include "backup-csi-driver.livenessProbeImage" . }}
          imagePullPolicy: {{ include "backup-csi-driver.sidecarPullPolicy" . }}
          args:
            - --v=5
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:{{ include "backup-csi-driver.healthzPort" . }}
          ports:
            - name: healthz
              containerPort: {{ include "backup-csi-driver.healthzPort" . }}
              protocol: TCP
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          {{- dict "main" . "k10_service_pod_name" "backup-csi-driver-controller" "k10_service_container_name" "liveness-probe" | include "k10.resource.request" | trim | nindent 10 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: snapshot-grpc-tls
          secret:
            secretName: {{ include "backup-csi-driver.fullname" . }}-snapshot-grpc-tls
            optional: true
      tolerations:
        - operator: Exists
{{- end }}
