# -- String to partially override cf-runtime.fullname template (will maintain the release name)
nameOverride: ""
# -- String to fully override cf-runtime.fullname template
fullnameOverride: ""
# -- Global parameters
# @default -- See below
global:
  # -- Global Docker image registry
  imageRegistry: ""
  # -- Global Docker registry secret names as array
  imagePullSecrets: []
  # -- URL of Codefresh Platform (required!)
  codefreshHost: "https://g.codefresh.io"
  # -- User token in plain text (required if `global.codefreshTokenSecretKeyRef` is omitted!)
  # Ref: https://g.codefresh.io/user/settings (see API Keys)
  # Minimal API key scopes: Runner-Installation(read+write), Agent(read+write), Agents(read+write)
  codefreshToken: ""
  # -- User token that references an existing secret containing API key (required if `global.codefreshToken` is omitted!)
  codefreshTokenSecretKeyRef: {}
  # E.g.
  # codefreshTokenSecretKeyRef:
  #   name: my-codefresh-api-token
  #   key: codefresh-api-token

  # -- Account ID (required!)
  # Can be obtained here https://g.codefresh.io/2.0/account-settings/account-information
  accountId: ""
  # -- K8s context name (required!)
  context: ""
  # E.g.
  # context: prod-ue1-runtime-1

  # -- Agent Name (optional!)
  # If omitted, the following format will be used `{{ .Values.global.context }}_{{ .Release.Namespace }}`
  agentName: ""
  # E.g.
  # agentName: prod-ue1-runtime-1

  # -- Runtime name (optional!)
  # If omitted, the following format will be used `{{ .Values.global.context }}/{{ .Release.Namespace }}`
  runtimeName: ""
  # E.g.
  # runtimeName: prod-ue1-runtime-1/namespace

  # -- DEPRECATED Agent token in plain text.
  # !!! MUST BE provided if migrating from < 6.x chart version
  agentToken: ""
  # -- DEPRECATED Agent token that references an existing secret containing API key.
  # !!! MUST BE provided if migrating from < 6.x chart version
  agentTokenSecretKeyRef: {}
  # E.g.
  # agentTokenSecretKeyRef:
  #   name: my-codefresh-agent-secret
  #   key: codefresh-agent-token
# DEPRECATED -- Use `.Values.global.imageRegistry` instead
dockerRegistry: ""
# DEPRECATED -- Use `.Values.runtime` instead
re: {}
# -- Runner parameters
# @default -- See below
runner:
  # -- Enable the runner
  enabled: true
  # -- Set runner deployment name
  name: "" # e.g. "runner"
  # -- Set number of pods
  replicasCount: 1
  # -- Upgrade strategy
  updateStrategy:
    type: RollingUpdate
  # -- Set pod annotations
  podAnnotations: {}
  # -- Set image
  image:
    registry: quay.io
    repository: codefresh/venona
    tag: 2.0.12
    digest: sha256:f85cd3b2442f8f58e0fd1250cbe82889c6fc7fc62550733a898c60e6f91304d3
  # -- Init container
  init:
    image:
      registry: quay.io
      repository: codefresh/cli
      tag: 1.2.8-rootless
      digest: sha256:5cb18daf5941018bc64df5ab9be90bc4d31b84e716f1100f671fcaed6bc6a932
    resources:
      limits:
        memory: 512Mi
        cpu: '1'
      requests:
        memory: 256Mi
        cpu: '0.2'
  # -- Add additional env vars
  env:
    # -- DEPRECATED: New Relic instrumentation is no longer supported and will be removed in future version. Use OTel instead.
    NEW_RELIC_ENABLED: "false"
  # E.g.
  # env:
  #   WORKFLOW_CONCURRENCY: 50 # The number of workflow creation and termination tasks the Runner can handle in parallel. Defaults to 50

  # -- Service Account parameters
  serviceAccount:
    # -- Create service account
    create: true
    # -- Override service account name
    name: ""
    # -- Additional service account annotations
    annotations: {}
  # -- RBAC parameters
  rbac:
    # -- Create RBAC resources
    create: true
    # -- Add custom rule to the role
    rules: []
  # -- Set security context for the pod
  # @default -- See below
  podSecurityContext:
    enabled: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  # -- Readiness probe configuration
  # @default -- See below
  readinessProbe:
    failureThreshold: 5
    initialDelaySeconds: 5
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 5
  # -- Set requests and limits
  resources: {}
  # -- Set node selector
  nodeSelector: {}
  # -- Set tolerations
  tolerations: []
  # -- Set affinity
  affinity: {}
# -- Volume Provisioner parameters
# @default -- See below
volumeProvisioner:
  # -- Enable volume-provisioner
  enabled: true
  # -- Set volume-provisioner deployment name
  name: "" # e.g. "dind-volume-provisioner"
  # -- Set number of pods
  replicasCount: 1
  # -- Upgrade strategy
  updateStrategy:
    type: Recreate
  # -- Set pod annotations
  podAnnotations: {}
  # -- Set image
  image:
    registry: quay.io
    repository: codefresh/dind-volume-provisioner
    tag: 2.1.2
    digest: sha256:66ca7c45b31c08e90193b97105e8e890db605ba6231fec3a1b9522e112c96877
  # -- Add additional env vars
  env: {}
  # E.g.
  # env:
  #   THREADINESS: 4 # The number of PVC requests the dind-volume-provisioner can process in parallel. Defaults to 4

  # -- Service Account parameters
  serviceAccount:
    # -- Create service account
    create: true
    # -- Override service account name
    name: ""
    # -- Additional service account annotations
    annotations: {}
    # E.g.
    #   serviceAccount:
    #     annotations:
    #       eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/<IAM_ROLE_NAME>"
  # -- RBAC parameters
  rbac:
    # -- Create RBAC resources
    create: true
    # -- Add custom rule to the role
    rules: []
  # -- Set security context for the pod
  # @default -- See below
  podSecurityContext:
    enabled: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
  # -- Set node selector
  nodeSelector: {}
  # -- Set resources
  resources: {}
  # -- Set tolerations
  tolerations: []
  # -- Set affinity
  affinity: {}
  # -- `dind-lv-monitor` DaemonSet parameters
  # (local volumes cleaner)
  # @default -- See below
  dind-lv-monitor:
    enabled: true
    name: "" # e.g. "dind-lv-monitor"
    image:
      registry: quay.io
      repository: codefresh/dind-volume-utils
      tag: 1.30.11
      digest: sha256:febb79d0ff5699c17366ac49992d0efa261eb39fb183baf98b58119e93d586ed
    podAnnotations: {}
    podSecurityContext:
      enabled: false
      runAsUser: 1000
      fsGroup: 1000
    containerSecurityContext: {}
    env: {}
    resources: {}
    nodeSelector: {}
    tolerations:
      - key: 'codefresh/dind'
        operator: 'Exists'
        effect: 'NoSchedule'
    volumePermissions:
      enabled: false
      image:
        registry: docker.io
        repository: alpine
        tag: 3.23
        digest: sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0
      resources: {}
      securityContext:
        runAsUser: 0 # auto
  # `dind-volume-cleanup` CronJob parameters
  # (external volumes cleaner)
  # @default -- See below
  dind-volume-cleanup:
    enabled: true
    name: "" # e.g. "dind-volume-cleanup"
    image:
      registry: quay.io
      repository: codefresh/dind-volume-cleanup
      tag: 1.2.0
      digest: sha256:1af3e3ecc87bf2e26ba07ecef68f54ad100d7e3b5fcf074099f627fd5d917369
    env: {}
    concurrencyPolicy: Forbid
    schedule: "*/10 * * * *"
    successfulJobsHistory: 1
    failedJobsHistory: 1
    suspend: false
    podAnnotations: {}
    podSecurityContext:
      enabled: true
      fsGroup: 3000
      runAsGroup: 3000
      runAsUser: 3000
    nodeSelector: {}
    affinity: {}
    tolerations: []
# Storage parameters for volume-provisioner
# @default -- See below
storage:
  # -- Override storage class name for dind volumes
  fullnameOverride: ""
  # -- Set backend volume type (`local`/`ebs`/`ebs-csi`/`gcedisk`/`azuredisk`)
  backend: local
  # -- Set filesystem type (`ext4`/`xfs`)
  fsType: "ext4"
  # Storage parametrs example for local volumes on the K8S nodes filesystem (i.e. `storage.backend=local`)
  # https://kubernetes.io/docs/concepts/storage/volumes/#local
  # @default -- See below
  local:
    # -- Set volume path on the host filesystem
    volumeParentDir: /var/lib/codefresh/dind-volumes
  # Storage parameters example for aws ebs disks (i.e. `storage.backend=ebs`/`storage.backend=ebs-csi`)
  # https://aws.amazon.com/ebs/
  # https://codefresh.io/docs/docs/installation/codefresh-runner/#aws-backend-volume-configuration
  # @default -- See below
  ebs:
    # -- Set EBS volume type (`gp2`/`gp3`/`io1`) (required)
    volumeType: "gp2"
    # -- Set EBS volumes availability zone (required)
    availabilityZone: "us-east-1a"
    # -- Enable encryption (optional)
    encrypted: "false"
    # -- Set KMS encryption key ID (optional)
    kmsKeyId: ""
    # -- Set AWS_ACCESS_KEY_ID for volume-provisioner (optional)
    # Ref: https://codefresh.io/docs/docs/installation/codefresh-runner/#dind-volume-provisioner-permissions
    accessKeyId: ""
    # -- Existing secret containing AWS_ACCESS_KEY_ID.
    accessKeyIdSecretKeyRef: {}
    # E.g.
    # accessKeyIdSecretKeyRef:
    #   name:
    #   key:

    # -- Set AWS_SECRET_ACCESS_KEY for volume-provisioner (optional)
    # Ref: https://codefresh.io/docs/docs/installation/codefresh-runner/#dind-volume-provisioner-permissions
    secretAccessKey: ""
    # -- Existing secret containing AWS_SECRET_ACCESS_KEY
    secretAccessKeySecretKeyRef: {}
    # E.g.
    # secretAccessKeySecretKeyRef:
    #   name:
    #   key:
  # E.g.
  # ebs:
  #   volumeType: gp3
  #   availabilityZone: us-east-1c
  #   encrypted: false
  #   iops: "5000"
  #   # I/O operations per second. Only effetive when gp3 volume type is specified.
  #   # Default value - 3000.
  #   # Max - 16,000
  #   throughput: "500"
  #   # Throughput in MiB/s. Only effective when gp3 volume type is specified.
  #   # Default value - 125.
  #   # Max - 1000.
  # ebs:
  #   volumeType: gp2
  #   availabilityZone: us-east-1c
  #   encrypted: true
  #   kmsKeyId: "1234abcd-12ab-34cd-56ef-1234567890ab"
  #   accessKeyId: "MYKEYID"
  #   secretAccessKey: "MYACCESSKEY"

  # Storage parameters example for gce disks
  # https://cloud.google.com/compute/docs/disks#pdspecs
  # https://codefresh.io/docs/docs/installation/codefresh-runner/#gke-google-kubernetes-engine-backend-volume-configuration
  # @default -- See below
  gcedisk:
    # -- Set GCP volume backend type (`pd-ssd`/`pd-standard`)
    volumeType: "pd-ssd"
    # -- Set GCP volume availability zone
    availabilityZone: "us-west1-a"
    # -- Set Google SA JSON key for volume-provisioner (optional)
    serviceAccountJson: ""
    # -- Existing secret containing containing Google SA JSON key for volume-provisioner (optional)
    serviceAccountJsonSecretKeyRef: {}
    # E.g.
    # gcedisk:
    #   volumeType: pd-ssd
    #   availabilityZone: us-central1-c
    #   serviceAccountJson: |-
    #          {
    #           "type": "service_account",
    #           "project_id": "...",
    #           "private_key_id": "...",
    #           "private_key": "...",
    #           "client_email": "...",
    #           "client_id": "...",
    #           "auth_uri": "...",
    #           "token_uri": "...",
    #           "auth_provider_x509_cert_url": "...",
    #           "client_x509_cert_url": "..."
    #           }
  # Storage parameters example for Azure Disks
  # https://codefresh.io/docs/docs/installation/codefresh-runner/#install-codefresh-runner-on-azure-kubernetes-service-aks
  # @default -- See below
  azuredisk:
    # -- Set storage type (`Premium_LRS`)
    skuName: Premium_LRS
    cachingMode: None
    # availabilityZone: northeurope-1
    # resourceGroup:
    # DiskIOPSReadWrite: 500
    # DiskMBpsReadWrite: 100
  mountAzureJson: false
# -- Set runtime parameters
# @default -- See below
runtime:
  # -- Set annotation on engine Service Account
  # Ref: https://codefresh.io/docs/docs/administration/codefresh-runner/#injecting-aws-arn-roles-into-the-cluster
  serviceAccount:
    create: true
    annotations: {}
    # E.g.
    #   serviceAccount:
    #     annotations:
    #       eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/<IAM_ROLE_NAME>"
  # -- Set parent runtime to inherit.
  # Should only be used in On-Premises installations.
  runtimeExtends: []
  # -- Runtime description
  description: ""
  # -- RBAC parameters
  rbac:
    # -- Create RBAC resources
    create: true
    # -- Add custom rule to the engine role
    rules: []
  # -- (for On-Premise only) Enable agent
  agent: true
  # -- (for On-Premise only) Set inCluster runtime
  inCluster: true
  # -- (for On-Premise only) Set kubeconfig name and path
  kubeconfigFilePath: ""
  kubeconfigName: ""
  # -- (for On-Premise only) Assign accounts to runtime (list of account ids)
  accounts: []
  # -- Parameters for DinD (docker-in-docker) pod (aka "runtime" pod).
  dind:
    # -- Set dind image.
    image:
      registry: quay.io
      repository: codefresh/dind
      tag: 3.0.30 # use `latest-rootless/rootless/3.0.20-rootless` tags for rootless-dind
      pullPolicy: IfNotPresent
      digest: sha256:981f2e583aafc7f18ed9181c7973f670cdc227893c9817b430f081687cbc413f
    # -- Set dind resources.
    resources:
      requests: null
      limits:
        cpu: 400m
        memory: 800Mi
    # -- Set termination grace period.
    terminationGracePeriodSeconds: 30
    # -- PV claim spec parametes.
    pvcs:
      # -- Default dind PVC parameters
      dind:
        # -- PVC name prefix.
        # Keep `dind` as default! Don't change!
        name: dind
        # -- PVC storage class name.
        # Change ONLY if you need to use storage class NOT from Codefresh volume-provisioner
        storageClassName: '{{ include "dind-volume-provisioner.storageClassName" . }}'
        # -- PVC size.
        volumeSize: 16Gi
        # -- PV reuse selector.
        # Ref: https://codefresh.io/docs/docs/installation/codefresh-runner/#volume-reuse-policy
        reuseVolumeSelector: codefresh-app,io.codefresh.accountName
        reuseVolumeSortOrder: pipeline_id
        # -- PV annotations.
        annotations: {}
        # E.g.:
        # annotations:
        #   codefresh.io/volume-retention: 7d
    # -- Set additional env vars.
    env:
      # -- Enable in-docker cleaner
      CLEAN_DOCKER: true
      # -- Run cleanup if the last cleanup was more than CLEAN_PERIOD_SECONDS seconds ago
      CLEAN_PERIOD_SECONDS: '21600'
      # -- Run cleanup if there have been more than CLEAN_PERIOD_BUILDS builds since the last cleanup
      CLEAN_PERIOD_BUILDS: '5'
      # -- Do not delete Docker images if they have events newer than `NOW minus IMAGE_RETAIN_PERIOD`
      IMAGE_RETAIN_PERIOD: '14400'
      # -- Do not delete Docker volumes if they have events newer than `NOW minus VOLUMES_RETAIN_PERIOD`
      VOLUMES_RETAIN_PERIOD: '14400'
      # -- Run cleanup if current disk usage exceeds DISK_USAGE_THRESHOLD
      DISK_USAGE_THRESHOLD: '0.8'
      # -- Run cleanup if current inodes usage exceeds INODES_USAGE_THRESHOLD
      INODES_USAGE_THRESHOLD: '0.8'
      # -- Write available disk space to the termination log on shutdown
      WRITE_TERMINATION_MESSAGE: 'true'
    # -- Set pod annotations.
    podAnnotations: {}
    # -- Set pod labels.
    podLabels: {}
    # -- Set node selector.
    nodeSelector: {}
    # -- Set affinity
    affinity: {}
    # -- Set tolerations.
    tolerations:
      - key: 'codefresh/dind'
        operator: 'Exists'
        effect: 'NoSchedule'
    # -- Set security context for the pod.
    podSecurityContext: {}
    # -- Set container security context.
    containerSecurityContext: {}
    # -- Set scheduler name.
    schedulerName: ""
    # -- Set service account for pod.
    serviceAccount: codefresh-engine
    # -- Keep `true` as default!
    userAccess: true
    # -- Add extra volumes
    userVolumes: {}
    # E.g.:
    # userVolumes:
    #   regctl-docker-registry:
    #     name: regctl-docker-registry
    #     secret:
    #       items:
    #         - key: .dockerconfigjson
    #           path: config.json
    #       secretName: regctl-docker-registry
    #       optional: true
    # -- Add extra volume mounts
    userVolumeMounts: {}
    # E.g.:
    # userVolumeMounts:
    #   regctl-docker-registry:
    #     name: regctl-docker-registry
    #     mountPath: /home/appuser/.docker/
    #     readOnly: true
    volumePermissions:
      enabled: false
      image:
        registry: docker.io
        repository: alpine
        tag: 3.23
        digest: sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0
      resources: {}
      securityContext:
        runAsUser: 0 # auto
  # -- Parameters for Engine pod (aka "pipeline" orchestrator).
  engine:
    # -- Set image.
    image:
      registry: quay.io
      repository: codefresh/engine
      tag: 3.3.28
      pullPolicy: IfNotPresent
      digest: sha256:705ea8a9ef1a14de1e59ed4e0443795df45e5dbc8c2c897636e022770df4926d
    # -- Set container command.
    command:
      - 'node'
      - 'dist/server/index.js'
    # -- Set resources.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 2048Mi
    # -- Set termination grace period.
    terminationGracePeriodSeconds: 180
    # -- Override docker image registry for runtime images.
    runtimeImagesRegistry: ""
    # -- Set system(base) runtime images.
    # @default -- See below.
    runtimeImages:
      compose:
        registry: quay.io
        repository: codefresh/compose
        tag: 1.6.15
        digest: sha256:77ac39180aaf9d44338cd3c0576318b20a40d8c9c5ce76b48275920f50397207
      container-logger:
        registry: quay.io
        repository: codefresh/cf-container-logger
        tag: 2.0.50
        digest: sha256:d04068bc3b87a33b31547a64381f3f73b214b85e410f690aebb7a9ba628c2f26
      docker-builder:
        registry: quay.io
        repository: codefresh/cf-docker-builder
        tag: 1.7.6
        digest: sha256:41a7796084b866c17d5ff909b3d9d366cb13db1d2859d8ef6da2a974bb74f020
      docker-puller:
        registry: quay.io
        repository: codefresh/cf-docker-puller
        tag: 8.0.60
        digest: sha256:f8e9cd9e0f417cc19814d124bcbf559ccd4fb0eec7f62ec433b9ce60911ef4ae
      docker-pusher:
        registry: quay.io
        repository: codefresh/cf-docker-pusher
        tag: 6.0.52
        digest: sha256:c413a22d7f4220b21522f73b844f4ff95ab65ff4980c2c53c0e403545148974a
      fs-ops:
        registry: quay.io
        repository: codefresh/fs-ops
        tag: 1.2.14
        digest: sha256:967d9b0d5676818da2103c93f1aa26f46b2d77b8f0194de844de6fc5f0f2f7bd
      git-cloner:
        registry: quay.io
        repository: codefresh/cf-git-cloner
        tag: 10.3.15
        digest: sha256:c68ea9a7fa13d86ee6f349e54582583db06ea58a37708aa8eff5fe02377a9ed7
      kube-deploy:
        registry: quay.io
        repository: codefresh/cf-deploy-kubernetes
        tag: 19.0.0
        digest: sha256:a82041b64527bf76f2567c8ad539ac4dec16217530df44e75288c63896d5b49d
      pipeline-debugger:
        registry: quay.io
        repository: codefresh/cf-debugger
        tag: 1.3.16
        digest: sha256:9c142e93c427ca4d32fa28bef471676372543dbbf550da7e89cc942d55307c36
      template-engine:
        registry: quay.io
        repository: codefresh/pikolo
        tag: 0.15.22
        digest: sha256:f23172b39e4f588a644b9ae65363929ecd43c14bdf5d99b866bc1567ee5fc469
      cosign-image-signer:
        registry: quay.io
        repository: codefresh/cf-cosign-image-signer
        tag: 4.0.18
        digest: sha256:49a9c7aa412ec961015e697da38e2352eabaca553f0c12fe2ecdd4b5f132de1c
      gc-builder:
        registry: quay.io
        repository: codefresh/gcloud-builder
        tag: 0.5.26
        digest: sha256:d1eb0bfd05274c32c47fed312f1200eaaec5c2e2273eea0f53fbcd044bf9ff53
      default-qemu:
        registry: docker.io
        repository: tonistiigi/binfmt
        tag: qemu-v10.2.1
        digest: sha256:d3b963f787999e6c0219a48dba02978769286ff61a5f4d26245cb6a6e5567ea3
      alpine:
        registry: docker.io
        repository: alpine
        tag: latest
        digest: sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    # -- Set additional env vars.
    env:
      # -- Telemetry configuration
      # -- Level of logging for engine
      CF_TELEMETRY_LOGS_LEVEL: 'debug'
      # -- Enable OpenTelemetry signals (logs, metrics, traces)
      CF_TELEMETRY_OTEL_ENABLE: 'true'
      # -- Enable OTel HTTP instrumentation.
      # Make sure to sanitize `url.full` and `url.query` span attributes on collector before enabling this flag, as it may contain sensitive information.
      CF_TELEMETRY_OTEL_ALLOW_HTTP_INSTRUMENTATION: 'false'
      # -- Enable Prometheus server (used solely to emit process metrics, if CF_TELEMETRY_PROMETHEUS_ENABLE_PROCESS_METRICS=true)
      # If enabled, make sure to disable legacy metrics by specifying METRICS_PROMETHEUS_ENABLED=false.
      CF_TELEMETRY_PROMETHEUS_ENABLE: 'false'
      # -- Enable collecting process metrics
      CF_TELEMETRY_PROMETHEUS_ENABLE_PROCESS_METRICS: 'false'
      # -- Host for Prometheus metrics server
      CF_TELEMETRY_PROMETHEUS_HOST: '0.0.0.0'
      # -- Port for Prometheus metrics server
      CF_TELEMETRY_PROMETHEUS_PORT: '9100'
      # -- Enable Pyroscope profiling. If enabled, the Pyroscope server address must be set in PYROSCOPE_SERVER_ADDRESS.
      CF_TELEMETRY_PYROSCOPE_ENABLE: 'false'
      # -- Pyroscope server address
      PYROSCOPE_SERVER_ADDRESS: ''
      # -- Level of logging for engine
      LOGGER_LEVEL: debug
      # -- Enable debug-level logging of outgoing HTTP/HTTPS requests.
      # Use with caution, as it may log sensitive information.
      LOG_OUTGOING_HTTP_REQUESTS: false
      # -- On exit, wait <timeout>ms for the scrape before exiting. No waiting will be done if set to 0. If OTEL_METRICS_EXPORTER=prometheus, it's recommended to set this to 4×scrape_interval.
      METRICS_SCRAPE_TIMEOUT_MS: '0'
      # -- Base endpoint URL for all OpenTelemetry signals.
      # Ref: https://opentelemetry.io/docs/languages/sdk-configuration/otlp-exporter/
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://localhost:4317'
      # -- Specifies the OTLP transport protocol to be used for all telemetry data.
      # Ref: https://opentelemetry.io/docs/languages/sdk-configuration/otlp-exporter/
      OTEL_EXPORTER_OTLP_PROTOCOL: 'grpc'
      # -- Specifies the compression algorithm to be used for all telemetry data.
      # Ref: https://opentelemetry.io/docs/specs/otel/protocol/exporter/
      OTEL_EXPORTER_OTLP_COMPRESSION: 'gzip'
      # -- OTel Logs exporter to be used.
      # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/
      OTEL_LOGS_EXPORTER: 'none'
      # -- OTel traces exporter to be used.
      # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/
      OTEL_TRACES_EXPORTER: 'none'
      # -- OTel sampler to be used for traces.
      # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/
      OTEL_TRACES_SAMPLER: 'parentbased_always_on'
      # -- OTel metrics exporter to be used. Set to "prometheus" to export metrics in Prometheus format. If set to "prometheus", it's recommended to set METRICS_SCRAPE_TIMEOUT_MS=4×scrape_interval.
      # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/
      OTEL_METRICS_EXPORTER: 'otlp'
      # -- The time interval (in milliseconds) between the start of two export attempts for push metric exporters, such as "otlp".
      # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/
      OTEL_METRIC_EXPORT_INTERVAL: '10000'
      # -- Maximum allowed time (in milliseconds) to export data for push metric exporters, such as "otlp".
      # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/
      OTEL_METRIC_EXPORT_TIMEOUT: '5000'
      # -- Host used by the Prometheus OTel metrics exporter if OTEL_METRICS_EXPORTER=prometheus
      OTEL_EXPORTER_PROMETHEUS_HOST: '0.0.0.0'
      # -- Port used by the Prometheus OTel metrics exporter if OTEL_METRICS_EXPORTER=prometheus
      OTEL_EXPORTER_PROMETHEUS_PORT: '9464'
      # -- Emit the stable HTTP and networking OTel conventions if CF_TELEMETRY_OTEL_ALLOW_HTTP_INSTRUMENTATION=true.
      OTEL_SEMCONV_STABILITY_OPT_IN: 'http'
      #
      # -- Engine operation configuration
      # -- Interval to check the exec status in the container-logger
      CONTAINER_LOGGER_EXEC_CHECK_INTERVAL_MS: 1000
      # -- Timeout for the container-logger exec to finish; milliseconds
      CONTAINER_LOGGER_EXEC_TIMEOUT: '1800000'
      # -- If "true", container-logger prints progress of `docker pull`/`docker push` operations
      CONTAINER_LOGGER_SHOW_PROGRESS: 'true'
      # -- DEPRECATED: Disable export/restore of the workspace volume cache
      DISABLE_WORKSPACE_CACHE: 'true'
      # -- Timeout while doing requests to the Docker daemon
      DOCKER_REQUEST_TIMEOUT_MS: 30000
      # -- If "true", composition images will be pulled sequentially
      FORCE_COMPOSE_SERIAL_PULL: false
      # -- Report build metrics to Codefresh platform.
      METRICS_CODEFRESH_ENABLED: 'true'
      # -- Trusted QEMU images used for docker builds - when left blank defaults to .runtime.engine.runtimeImages.default-qemu value
      TRUSTED_QEMU_IMAGES: 'tonistiigi/binfmt'
      # -- DEPRECATED: New Relic instrumentation is no longer supported and will be removed in future version. Use OTel instead.
      NEW_RELIC_ENABLED: "false"
      # -- DEPRECATED: New Relic instrumentation is no longer supported and will be removed in future version. Use OTel instead.
      NO_EXT_MONITOR: 'true'
      # -- Engine configuration profile. Keep `kubernetes` as default!
      NODE_ENV: 'kubernetes'
    # -- Set workflow limits.
    workflowLimits:
      # -- Maximum time allowed to the engine to wait for the pre-steps (aka "Initializing Process") to succeed; seconds.
      MAXIMUM_ALLOWED_TIME_BEFORE_PRE_STEPS_SUCCESS: 600
      # -- Maximum time for workflow execution; seconds.
      MAXIMUM_ALLOWED_WORKFLOW_AGE_BEFORE_TERMINATION: 86400
      # -- Maximum time allowed to workflow to spend in "elected" state; seconds.
      MAXIMUM_ELECTED_STATE_AGE_ALLOWED: 900
      # -- Maximum time for internal build chores before termination; minutes.
      # For on-prem installations may be overridden by the platform admin.
      MAXIMUM_POST_STEPS_GRACE_PERIOD_MINUTES: 30
      # -- Maximum retry attempts allowed for workflow.
      MAXIMUM_RETRY_ATTEMPTS_ALLOWED: 20
      # -- Maximum time allowed to workflow to spend in "terminating" state until force terminated; seconds.
      MAXIMUM_TERMINATING_STATE_AGE_ALLOWED: 900
      # -- Maximum time allowed to workflow to spend in "terminating" state without logs activity until force terminated; seconds.
      MAXIMUM_TERMINATING_STATE_AGE_ALLOWED_WITHOUT_UPDATE: 300
      # -- Time since the last health check report after which workflow is terminated; seconds.
      TIME_ENGINE_INACTIVE_UNTIL_TERMINATION: 300
      # -- Time since the last health check report after which the engine is considered unhealthy; seconds.
      TIME_ENGINE_INACTIVE_UNTIL_UNHEALTHY: 60
      # -- Time since the last workflow logs activity after which workflow is terminated; seconds.
      TIME_INACTIVE_UNTIL_TERMINATION: 2700
    # -- Set pod annotations.
    podAnnotations: {}
    # -- Set pod labels.
    podLabels: {}
    # -- Set node selector.
    nodeSelector: {}
    # -- Set affinity
    affinity: {}
    # -- Set tolerations.
    tolerations: []
    # -- Set scheduler name.
    schedulerName: ""
    # -- Set service account for pod.
    serviceAccount: codefresh-engine
    # -- Set extra env vars
    userEnvVars: []
    # E.g.
    # userEnvVars:
    # - name: GITHUB_TOKEN
    #   valueFrom:
    #     secretKeyRef:
    #       name: github-token
    #       key: token
  # -- Parameters for `runtime-patch` post-upgrade/install hook
  # @default -- See below
  patch:
    enabled: true
    name: "" # e.g. "runtime-patch"
    hook:
      enabled: true
      image:
        registry: quay.io
        repository: codefresh/cli
        tag: 1.2.8-rootless
        digest: sha256:5cb18daf5941018bc64df5ab9be90bc4d31b84e716f1100f671fcaed6bc6a932
      rbac:
        enabled: true
      annotations: {}
      affinity: {}
      nodeSelector: {}
      podSecurityContext: {}
      resources: {}
      tolerations: []
      ttlSecondsAfterFinished: 180
      env:
        HOME: /tmp
    # -- CronJob to update the runtime on schedule
    cronjob:
      enabled: true
      schedule: "0/5 * * * *" # Every 5 minutes
      successfulJobsHistory: 1
      failedJobsHistory: 1
      image:
        registry: quay.io
        repository: codefresh/cli
        tag: 1.2.8-rootless
        digest: sha256:5cb18daf5941018bc64df5ab9be90bc4d31b84e716f1100f671fcaed6bc6a932
      affinity: {}
      nodeSelector: {}
      podSecurityContext: {}
      resources: {}
      tolerations: []
  # -- Parameters for `gencerts-dind` post-upgrade/install hook
  # @default -- See below
  gencerts:
    enabled: true
    name: "" # e.g. "dind-gencerts"
    image:
      registry: quay.io
      repository: codefresh/kubectl
      tag: 1.37.1
      digest: sha256:7e6dc72eb94d7ee38d07d6c6fe6541aaab5e77320bd8bd8e5eaf7a9dd0b660a9
    rbac:
      enabled: true
    annotations: {}
    affinity: {}
    nodeSelector: {}
    podSecurityContext: {}
    resources: {}
    tolerations: []
    ttlSecondsAfterFinished: 180
  # -- DinD pod daemon config
  # @default -- See below
  dindDaemon:
    hosts:
      - unix:///var/run/docker.sock
      - tcp://0.0.0.0:1300
    tlsverify: true
    tls: true
    tlscacert: /etc/ssl/cf-client/ca.pem
    tlscert: /etc/ssl/cf/server-cert.pem
    tlskey: /etc/ssl/cf/server-key.pem
    insecure-registries:
      - 192.168.99.100:5000
    metrics-addr: 0.0.0.0:9323
    experimental: true
# App-Proxy parameters
# Ref: https://codefresh.io/docs/docs/installation/codefresh-runner/#app-proxy-installation
# @default -- See below
appProxy:
  # -- Enable app-proxy
  enabled: false
  # -- Set number of pods
  replicasCount: 1
  # -- Upgrade strategy
  updateStrategy:
    type: RollingUpdate
  # -- Set pod annotations
  podAnnotations: {}
  # -- Set image
  image:
    registry: quay.io
    repository: codefresh/cf-app-proxy
    tag: 0.1.7
    digest: sha256:848bbfa8ee22eef544fa16a56e9db6d25e2618b06f8a324af0b70ce3437177f6
  # -- Add additional env vars
  env:
    # -- Telemetry configuration
    # -- Level of logging for app-proxy
    CF_TELEMETRY_LOGS_LEVEL: 'debug'
    # -- Enable OpenTelemetry signals (logs, metrics, traces)
    CF_TELEMETRY_OTEL_ENABLE: 'false'
    # -- Enable OTel HTTP instrumentation.
    # Make sure to sanitize `url.full` and `url.query` span attributes on collector before enabling this flag, as it may contain sensitive information.
    CF_TELEMETRY_OTEL_ALLOW_HTTP_INSTRUMENTATION: 'false'
    # -- Enable Prometheus server (used solely to emit process metrics, if CF_TELEMETRY_PROMETHEUS_ENABLE_PROCESS_METRICS=true)
    # If enabled, make sure to disable legacy metrics by specifying METRICS_PROMETHEUS_ENABLED=false.
    CF_TELEMETRY_PROMETHEUS_ENABLE: 'false'
    # -- Enable collecting process metrics
    CF_TELEMETRY_PROMETHEUS_ENABLE_PROCESS_METRICS: 'false'
    # -- Host for Prometheus metrics server
    CF_TELEMETRY_PROMETHEUS_HOST: '0.0.0.0'
    # -- Port for Prometheus metrics server
    CF_TELEMETRY_PROMETHEUS_PORT: '9100'
    # -- Enable Pyroscope profiling. If enabled, the Pyroscope server address must be set in PYROSCOPE_SERVER_ADDRESS.
    CF_TELEMETRY_PYROSCOPE_ENABLE: 'false'
    # -- Pyroscope server address
    PYROSCOPE_SERVER_ADDRESS: ''
    # -- Base endpoint URL for all OpenTelemetry signals.
    # Ref: https://opentelemetry.io/docs/languages/sdk-configuration/otlp-exporter/
    OTEL_EXPORTER_OTLP_ENDPOINT: 'http://localhost:4317'
    # -- Specifies the OTLP transport protocol to be used for all telemetry data.
    # Ref: https://opentelemetry.io/docs/languages/sdk-configuration/otlp-exporter/
    OTEL_EXPORTER_OTLP_PROTOCOL: 'grpc'
    # -- Specifies the compression algorithm to be used for all telemetry data.
    # Ref: https://opentelemetry.io/docs/specs/otel/protocol/exporter/
    OTEL_EXPORTER_OTLP_COMPRESSION: 'gzip'
    # -- OTel Logs exporter to be used.
    # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/
    OTEL_LOGS_EXPORTER: 'none'
    # -- OTel traces exporter to be used.
    # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/
    OTEL_TRACES_EXPORTER: 'none'
    # -- OTel sampler to be used for traces.
    # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/
    OTEL_TRACES_SAMPLER: 'parentbased_always_on'
    # -- OTel metrics exporter to be used. Set to "prometheus" to export metrics in Prometheus format. If set to "prometheus", it's recommended to set METRICS_SCRAPE_TIMEOUT_MS=4×scrape_interval.
    # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/
    OTEL_METRICS_EXPORTER: 'otlp'
    # -- The time interval (in milliseconds) between the start of two export attempts for push metric exporters, such as "otlp".
    # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/
    OTEL_METRIC_EXPORT_INTERVAL: '10000'
    # -- Maximum allowed time (in milliseconds) to export data for push metric exporters, such as "otlp".
    # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/
    OTEL_METRIC_EXPORT_TIMEOUT: '5000'
    # -- Host used by the Prometheus OTel metrics exporter if OTEL_METRICS_EXPORTER=prometheus
    OTEL_EXPORTER_PROMETHEUS_HOST: '0.0.0.0'
    # -- Port used by the Prometheus OTel metrics exporter if OTEL_METRICS_EXPORTER=prometheus
    OTEL_EXPORTER_PROMETHEUS_PORT: '9464'
    # -- Emit the stable HTTP and networking OTel conventions if CF_TELEMETRY_OTEL_ALLOW_HTTP_INSTRUMENTATION=true.
    OTEL_SEMCONV_STABILITY_OPT_IN: 'http'
    #
  # Set app-proxy ingress parameters
  # @default -- See below
  ingress:
    # -- Enable Ingress
    enabled: true
    # -- Set path prefix for ingress (keep empty for default `/` path)
    pathPrefix: ""
    # -- Set ingress class
    class: ""
    # -- Set DNS hostname the ingress will use
    host: ""
    # -- Set k8s tls secret for the ingress object
    tlsSecret: ""
    # -- Set extra annotations for ingress object
    annotations: {}
    # E.g.
    # ingress:
    #   pathPrefix: "/cf-app-proxy"
    #   class: "nginx"
    #   host: "mydomain.com"
    #   tlsSecret: "tls-cert-app-proxy"
    #   annotations:
    #     nginx.ingress.kubernetes.io/whitelist-source-range: 123.123.123.123/130
  # Set app-proxy HTTPRoute parameters
  # @default -- See below
  httpRoute:
    # -- Enable HTTPRoute
    enabled: false
    # -- Set path prefix for httpRoute (keep empty for default `/` path)
    pathPrefix: ""
    # -- Required! List of parent Gateway references this HTTPRoute should attach to
    # ref: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#parentreference
    # E.g.
    # parentRefs:
    #   - name: traefik-gateway
    #     namespace: traefik
    parentRefs: []
    # -- List of hostnames to be covered by this HTTPRoute
    # ref: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#hostname
    # E.g.
    # hostnames:
    #   - runtime.example.com
    hostnames: []
    # -- Set annotations on the HTTPRoute resource
    annotations: {}
    # -- Set labels on the HTTPRoute resource
    labels: {}
  # -- Service Account parameters
  serviceAccount:
    # -- Create service account
    create: true
    # -- Override service account name
    name: ""
    # -- Use Role(true)/ClusterRole(true)
    namespaced: true
    # -- Additional service account annotations
    annotations: {}
  # -- RBAC parameters
  rbac:
    # -- Create RBAC resources
    create: true
    # -- Use Role(true)/ClusterRole(true)
    namespaced: true
    # -- Add custom rule to the role
    rules: []
  # -- Set security context for the pod
  podSecurityContext: {}
  # -- Readiness probe configuration
  # @default -- See below
  readinessProbe:
    failureThreshold: 5
    initialDelaySeconds: 5
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 5
  # -- Set requests and limits
  resources: {}
  # -- Set node selector
  nodeSelector: {}
  # -- Set tolerations
  tolerations: []
  # -- Set affinity
  affinity: {}
