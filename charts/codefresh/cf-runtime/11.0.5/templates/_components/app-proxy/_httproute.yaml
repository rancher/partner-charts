{{- define "app-proxy.resources.httpRoute" -}}
{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "app-proxy.fullname" . }}
  labels:
    {{- include "app-proxy.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
  {{- if .Values.httpRoute.parentRefs }}
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- else }}
    {{- fail "ERROR: appProxy.httpRoute.parentRefs is required when httpRoute is enabled" }}
  {{- end }}
  hostnames:
  {{- if .Values.httpRoute.hostnames }}
     {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  {{- else }}
     {{- fail "ERROR: appProxy.httpRoute.hostnames is required when httpRoute is enabled" }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.pathPrefix | default "/" }}
      backendRefs:
        - name: {{ include "app-proxy.fullname" . }}
          port: 80
{{- end }}
{{- end -}}
