{{- if ((.Values.namespaced | default dict).enabled | default false) }}
{{- if .Values.namespaced.inspector.enabled }}
{{/*
INTENTIONAL DEVIATION (S-12915): at runtime the inspector reuses the operator's
ServiceAccount, because the operator already holds the cluster-scoped rights the
inspector needs. A namespaced install has no operator account to borrow, so the
inspector gets its own ServiceAccount and its own read-only Role. There is no
builder equivalent for this resource; it is a reviewed parity exemption.
*/}}
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: true
{{- with .Values.namespaced.image.pullSecrets }}
imagePullSecrets: {{ toYaml . | nindent 2 }}
{{- end }}
metadata:
  name: '{{ include "speedscale.namespaced.inspectorServiceAccountName" . }}'
  namespace: '{{ .Release.Namespace }}'
  labels:
    {{- with .Values.namespaced.globalLabels }}
{{ toYaml . | indent 4 }}
    {{- end }}
    app: speedscale-inspector
    controlplane.speedscale.com/component: inspector
  {{- with .Values.namespaced.globalAnnotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

{{- end }}
