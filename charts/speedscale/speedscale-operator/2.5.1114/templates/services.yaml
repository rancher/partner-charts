---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    app: speedscale-operator
    controlplane.speedscale.com/component: operator
  name: speedscale-operator
  namespace: {{ .Release.Namespace }}
  {{- if .Values.globalAnnotations }}
  annotations: {{ toYaml .Values.globalAnnotations | nindent 4 }}
  {{- end }}
spec:
  ports:
  # the admission webhook configs address this Service on 443 (the API server's default), but the
  # operator listens unprivileged -- see webhook_port in operator/settings/settings.go
  - port: 443
    protocol: TCP
    targetPort: webhook-server
  selector:
    app: speedscale-operator
    controlplane.speedscale.com/component: operator
status:
  loadBalancer: {}
