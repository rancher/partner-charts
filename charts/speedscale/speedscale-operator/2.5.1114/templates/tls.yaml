{{- $crt := "" -}}
{{- $key := "" -}}
{{- if .Values.createTLSCerts -}}
{{- $s := (lookup "v1" "Secret" .Release.Namespace "speedscale-certs") -}}
{{- if $s -}}
{{- $crt = index $s.data "tls.crt" | b64dec -}}
{{- $key = index $s.data "tls.key" | b64dec -}}
{{ else }}
{{- $cert := genCA "Speedscale" 3650 -}}
{{- $crt = $cert.Cert -}}
{{- $key = $cert.Key -}}
{{- end -}}
{{- end -}}
---
{{- if .Values.createJKS }}
{{- $jks := .Values.jks | default dict }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: speedscale-jks-program
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "4"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- if .Values.globalAnnotations }}
{{ toYaml .Values.globalAnnotations | indent 4}}
    {{- end }}
binaryData:
  TruststoreProvisioner.class: 
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "5"
    {{- if .Values.globalAnnotations }}
{{ toYaml .Values.globalAnnotations | indent 4}}
    {{- end }}
  creationTimestamp: null
  name: speedscale-operator-create-jks
  namespace: {{ .Release.Namespace }}
  labels:
  {{- if .Values.globalLabels }}
{{ toYaml .Values.globalLabels | indent 4}}
    {{- end }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 30
  template:
    metadata:
      annotations:
        {{- if .Values.globalAnnotations }}
{{ toYaml .Values.globalAnnotations | indent 8}}
        {{- end }}
      creationTimestamp: null
      labels:
        {{- if .Values.globalLabels }}
{{ toYaml .Values.globalLabels | indent 8}}
        {{- end }}
    spec:
      {{- include "speedscale-operator.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: create-jks
        image: {{ $jks.image | default (printf "%s/amazoncorretto:23" .Values.image.registry) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: [java]
        args: ["-cp", "/opt/speedscale-jks", "TruststoreProvisioner"]
        env:
        - name: TRUSTSTORE_PATH
          value: {{ $jks.truststorePath | default "" | quote }}
        volumeMounts:
        - name: speedscale-tls-out
          mountPath: /etc/ssl/speedscale
          readOnly: true
        - name: program
          mountPath: /opt/speedscale-jks
          readOnly: true
        - name: tmp
          mountPath: /tmp
        securityContext: {{ toYaml .Values.globalPodSecurityContext | nindent 10 }}
        resources: {{ toYaml .Values.preInstall.resources | nindent 10 }}
      restartPolicy: Never
      serviceAccountName: speedscale-operator-provisioning
      securityContext: {{ toYaml .Values.globalSecurityContext | nindent 8 }}
      volumes:
      - name: speedscale-tls-out
        secret:
          secretName: speedscale-certs
      - name: program
        configMap:
          name: speedscale-jks-program
      - name: tmp
        emptyDir: {}
      {{- if .Values.affinity }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
{{- end }}
---
apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "1"
    {{- if .Values.globalAnnotations }}
{{ toYaml .Values.globalAnnotations | indent 4}}
    {{- end }}
  creationTimestamp: null
  labels:
    app: speedscale-operator
    controlplane.speedscale.com/component: operator
  name: speedscale-operator-provisioning
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "2"
  creationTimestamp: null
  name: speedscale-operator-provisioning
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingwebhookconfigurations
  - validatingwebhookconfigurations
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "3"
    {{- if .Values.globalAnnotations }}
{{ toYaml .Values.globalAnnotations | indent 4}}
    {{- end }}
  creationTimestamp: null
  name: speedscale-operator-provisioning
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: speedscale-operator-provisioning
subjects:
- kind: ServiceAccount
  name: speedscale-operator-provisioning
  namespace: {{ .Release.Namespace }}
---
{{- if .Values.createTLSCerts }}
apiVersion: v1
kind: Secret
metadata:
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: before-hook-creation
    {{- if .Values.globalAnnotations }}
{{ toYaml .Values.globalAnnotations | indent 4}}
    {{- end }}
  creationTimestamp: null
  name: speedscale-certs
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt | b64enc }}
  tls.key: {{ $key | b64enc }}
{{- end }}
