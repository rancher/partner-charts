{{- if .Values.kyvernoPolicy.enabled }}
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: verify-image-signatures
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-5"
    policies.kyverno.io/title: Verify Image Signatures
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Verifies that all container images in this namespace are signed with the
      expected cosign keys before they are admitted.
spec:
  validationFailureAction: {{ .Values.kyvernoPolicy.validationFailureAction }}
  background: false
  rules:
    - name: verify-devguard-images
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/l3montree-dev/devguard:*"
            - "ghcr.io/l3montree-dev/devguard@*"
            - "ghcr.io/l3montree-dev/devguard-web:*"
            - "ghcr.io/l3montree-dev/devguard-web@*"
            - "ghcr.io/l3montree-dev/devguard/postgresql:*"
            - "ghcr.io/l3montree-dev/devguard/postgresql@*"
            - "ghcr.io/l3montree-dev/devguard/kratos:*"
            - "ghcr.io/l3montree-dev/devguard/kratos@*"
          mutateDigest: false
          verifyDigest: false
          attestors:
            - entries:
                - keys:
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEicBpp8o3W6m993d4Z49WKtwsAOrp
                      DBobQ3+l2FTWqPqYpnjVtV3w9si91eR3ygYGP7mDoM01sdAmc2TvbOVygA==
                      -----END PUBLIC KEY-----
                    rekor:
                      ignoreTlog: true
          attestations:
            # SLSA build provenance signed by the devguard instance the images are built with (api.main.devguard.org,
            # GET /api/v1/slsa/public-key/) - it signs only after verifying the OIDC identity of the CI job
            - predicateType: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keys:
                        publicKeys: |-
                          -----BEGIN PUBLIC KEY-----
                          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAECmDcJed2NqihRrcSmaL6vvWyDgDn
                          ijwu724jYHwL+YZRyjt6hlmZDuOsNruao2csBEHs1X1z56G5iXuzgmKO8w==
                          -----END PUBLIC KEY-----
                        rekor:
                          ignoreTlog: true
              conditions:
                - all:
                    # built by the trusted reusable workflow - the build jobs never get the token which signs
                    - key: "{{ `{{ runDetails.builder.id }}` }}"
                      operator: AnyIn
                      value:
                        - "https://github.com/l3montree-dev/devguard-ci-components/.github/workflows/full-nix.yml@refs/heads/main"
                        - "https://github.com/l3montree-dev/devguard-ci-components/.github/workflows/full-nix.yml@refs/tags/*"
                    - key: "{{ `{{ buildDefinition.externalParameters.workflow.repository }}` }}"
                      operator: AnyIn
                      value:
                        - "https://github.com/l3montree-dev/devguard"
                        - "https://github.com/l3montree-dev/devguard-web"
                    # only the protected main branch and release tags are deployed
                    - key: "{{ `{{ buildDefinition.externalParameters.workflow.ref }}` }}"
                      operator: AnyIn
                      value:
                        - "refs/heads/main"
                        - "refs/tags/v*"
    - name: verify-kratos-image
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "index.docker.io/oryd/kratos*"
            - "oryd/kratos*"
          mutateDigest: false
          verifyDigest: false
          attestors:
            - entries:
                - keys:
                    # Source: https://raw.githubusercontent.com/ory/xgoreleaser/master/cosign.pub
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEqE7EXHa8LTyCCEl6uI3hnKxetuTg
                      XkoOJ4EUUeQfdJp+7n5uojArbs8KwnZNZp4T4jXdcH6R5mQfPMXemfLrEg==
                      -----END PUBLIC KEY-----
                    rekor:
                      ignoreTlog: true
    - name: verify-otel-collector-image
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "index.docker.io/otel/opentelemetry-collector-contrib*"
            - "otel/opentelemetry-collector-contrib*"
          mutateDigest: false
          verifyDigest: false
          attestors:
            - entries:
                - keyless:
                    # Signed via GitHub Actions OIDC (Sigstore keyless)
                    issuer: "https://token.actions.githubusercontent.com"
                    subject: "https://github.com/open-telemetry/opentelemetry-collector-releases/.github/workflows/base-release.yaml@refs/tags/*"
                    rekor:
                      url: https://rekor.sigstore.dev
{{- end }}
