{{- if .Values.api.riverUI.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: devguard-riverui-service
  labels:
    {{- include "devguard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: devguard-riverui
{{- end }}
