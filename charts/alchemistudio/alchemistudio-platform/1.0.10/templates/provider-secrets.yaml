# =============================================================================
# Provider secrets — LLM API keys consumed by ai + worker.
#
# When openbao.enabled=true AND eso.enabled=true:
#   ExternalSecret pulls from OpenBao KV at alchemi/data/llm → alchemi-provider-secrets
#   (the init job wrote the keys there at post-install time)
#
# When openbao.enabled=false:
#   alchemi-provider-secrets is created directly from Helm values in secrets.yaml.
#   (The openbao=true path is preferred for production — keys don't live in helm history.)
#
# ESO polls every 5 min; on first install the Secret appears once the init job
# completes and ESO syncs. Apps start normally before the sync — LLM calls fail
# gracefully until the Secret exists.
# =============================================================================
{{- if and .Values.openbao.enabled .Values.eso.enabled }}
{{- $appns := .Values.global.namespaces.app }}
---
# LLM provider keys: ANTHROPIC_API_KEY, OPENAI_API_KEY, AZURE_OPENAI_*, etc.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alchemi-provider-secrets
  namespace: {{ $appns }}
  labels:
    app.kubernetes.io/part-of: alchemistudio-platform
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-alchemi
    kind: ClusterSecretStore
  target:
    name: alchemi-provider-secrets
    creationPolicy: Owner
    deletionPolicy: Retain     # keep the Secret if the ExternalSecret is deleted
  dataFrom:
    - extract:
        key: llm               # pulls ALL keys from alchemi/data/llm as individual Secret entries
{{- if and (eq .Values.smtp.mode "smtp") .Values.smtp.host }}
---
# SMTP credentials: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alchemi-smtp-secrets
  namespace: {{ $appns }}
  labels:
    app.kubernetes.io/part-of: alchemistudio-platform
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-alchemi
    kind: ClusterSecretStore
  target:
    name: alchemi-smtp-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: smtp
{{- end }}
{{- end }}
