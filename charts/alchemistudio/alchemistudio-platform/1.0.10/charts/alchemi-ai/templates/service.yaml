{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "alchemi-ai.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "alchemi-ai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "alchemi-ai.selectorLabels" . | nindent 4 }}
{{- end }}
