{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alchemi-zenith.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "alchemi-zenith.labels" . | nindent 4 }}
    app.kubernetes.io/component: zenith-frontend
type: Opaque
stringData:
  # ---------------------------------------------------------------------------
  # NextAuth
  # ---------------------------------------------------------------------------
  NEXTAUTH_SECRET: {{ .Values.secret.data.NEXTAUTH_SECRET | quote }}

  # ---------------------------------------------------------------------------
  # Superadmin credentials
  # ---------------------------------------------------------------------------
  SUPERADMIN_USERNAME: {{ .Values.secret.data.SUPERADMIN_USERNAME | quote }}
  SUPERADMIN_PASSWORD_HASH: {{ .Values.secret.data.SUPERADMIN_PASSWORD_HASH | quote }}

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  DB_PASSWORD: {{ .Values.secret.data.DB_PASSWORD | quote }}
  ALCHEMI_APP_DATABASE_URL: {{ .Values.secret.data.ALCHEMI_APP_DATABASE_URL | quote }}

  # ---------------------------------------------------------------------------
  # Encryption
  # ---------------------------------------------------------------------------
  ALCHEMI_ENCRYPTION_KEY: {{ .Values.secret.data.ALCHEMI_ENCRYPTION_KEY | quote }}

  # ---------------------------------------------------------------------------
  # Keycloak — admin service-account client secret (alchemi-admin-svc).
  # Active when AUTH_PROVIDER=KEYCLOAK. Used by zenith's IamClient for
  # org provisioning + invite flow via the Admin REST API.
  # ---------------------------------------------------------------------------
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{ .Values.secret.data.KEYCLOAK_ADMIN_CLIENT_SECRET | quote }}

  # ---------------------------------------------------------------------------
  # Zitadel PAT — legacy org provisioning + invite flow (rollback path).
  # Generate in Zitadel: Settings → Service Users → Create → Generate PAT.
  # ---------------------------------------------------------------------------
  ZITADEL_PAT: {{ .Values.secret.data.ZITADEL_PAT | quote }}

  # ---------------------------------------------------------------------------
  # Redis — BullMQ email queue
  # ---------------------------------------------------------------------------
  REDIS_PASSWORD: {{ .Values.secret.data.REDIS_PASSWORD | quote }}

  # ---------------------------------------------------------------------------
  # Internal service auth
  # Must match ALCHEMI_AI_INTERNAL_TOKEN in alchemi-ai-secrets.
  # ---------------------------------------------------------------------------
  ALCHEMI_AI_INTERNAL_TOKEN: {{ .Values.secret.data.ALCHEMI_AI_INTERNAL_TOKEN | quote }}

  # ---------------------------------------------------------------------------
  # Internal service auth — zenith → alchemi-migrator-api (Database page).
  # Must match ALCHEMI_DB_TOOLS_INTERNAL_TOKEN in alchemi-migrator-api-secrets.
  # ---------------------------------------------------------------------------
  ALCHEMI_DB_TOOLS_INTERNAL_TOKEN: {{ .Values.secret.data.ALCHEMI_DB_TOOLS_INTERNAL_TOKEN | quote }}
{{- end }}
