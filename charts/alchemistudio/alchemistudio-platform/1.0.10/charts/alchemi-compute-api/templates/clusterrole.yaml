{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "alchemi-compute-api.fullname" . }}-cluster-role
  labels:
    {{- include "alchemi-compute-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
rules:
  # Node listing for infrastructure monitoring (nodes are cluster-scoped)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # Metrics API for resource utilization
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
{{- end }}
