{{- $root := . }}
{{- $services := list "contentFilter" "secretDetection" "jailbreak" "pii" "topical" "toxic" }}
{{- $nameMap := dict "contentFilter" "guardrails-content-filter" "secretDetection" "guardrails-secret-detection" "jailbreak" "guardrails-jailbreak" "pii" "guardrails-pii" "topical" "guardrails-topical" "toxic" "guardrails-toxic" }}
{{/*
  Creates one Opaque Secret per enabled service using stringData so plain-text
  values from values.yaml (or --set overrides) pass through without base64 encoding.

  secret.create = false when ExternalSecrets manages guardrails-*-secrets objects
  (cloud environments backed by Azure Key Vault). On-prem sets secret.create = true
  and supplies GUARDRAILS_INTERNAL_TOKEN at deploy time.

  Keys present in on-prem v5.1.0 secrets but excluded here with rationale:
    GUARDRAILS_API_KEY    — Guardrails Hub package-manager token; no Python code
                            in apps/guardrails reads it at runtime (aspirational)
    AZURE_OPENAI_API_KEY  — no guardrails Python code calls Azure OpenAI; the
                            legitimate consumer is alchemi-ai-secrets
*/}}
{{- if $root.Values.secret.create }}
{{- range $services }}
{{- $svcKey := . }}
{{- $svcCfg := index $root.Values $svcKey }}
{{- $svcName := index $nameMap $svcKey }}
{{- if $svcCfg.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $svcName }}-secrets
  namespace: {{ $root.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $svcName }}
    app.kubernetes.io/component: content-safety
    helm.sh/chart: {{ include "alchemi-guardrails.chart" $root }}
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
type: Opaque
stringData:
  {{- toYaml $root.Values.secret.data | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
