{{- $root := . }}
{{- $services := list "contentFilter" "secretDetection" "jailbreak" "pii" "topical" "toxic" }}
{{- $nameMap := dict "contentFilter" "guardrails-content-filter" "secretDetection" "guardrails-secret-detection" "jailbreak" "guardrails-jailbreak" "pii" "guardrails-pii" "topical" "guardrails-topical" "toxic" "guardrails-toxic" }}
{{- range $services }}
{{- $svcKey := . }}
{{- $svcCfg := index $root.Values $svcKey }}
{{- $svcName := index $nameMap $svcKey }}
{{- if and $svcCfg.enabled $svcCfg.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $svcName }}
  namespace: {{ $root.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $svcName }}
    app.kubernetes.io/component: api
    helm.sh/chart: {{ include "alchemi-guardrails.chart" $root }}
    app.kubernetes.io/managed-by: {{ $root.Release.Service }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $svcName }}
  minReplicas: {{ $svcCfg.autoscaling.minReplicas }}
  maxReplicas: {{ $svcCfg.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svcCfg.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
{{- end }}
{{- end }}
