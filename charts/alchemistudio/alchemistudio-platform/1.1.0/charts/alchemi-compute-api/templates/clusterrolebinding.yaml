{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.namespace | default .Release.Namespace }}-{{ include "alchemi-compute-api.fullname" . }}-cluster-rolebinding
  labels:
    {{- include "alchemi-compute-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
subjects:
  - kind: ServiceAccount
    name: {{ include "alchemi-compute-api.serviceAccountName" . }}
    namespace: {{ .Values.namespace | default .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.namespace | default .Release.Namespace }}-{{ include "alchemi-compute-api.fullname" . }}-cluster-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
