{{- /* The "kata" RuntimeClass is cluster-wide and identical for every instance. Create it
       only if it doesn't exist yet, or if THIS release already owns it — a second instance
       on the same cluster reuses the existing one instead of failing on ownership. */ -}}
{{- $existing := lookup "node.k8s.io/v1" "RuntimeClass" "" "kata" }}
{{- $ours := and $existing (eq (dig "metadata" "annotations" "meta.helm.sh/release-namespace" "" $existing) .Release.Namespace) }}
{{- if and .Values.kata.enabled (or (not $existing) $ours) }}
---
# RuntimeClass for Kata Containers — dedicated kata pool with taint isolation
# Requires: add-kata-node.sh executed (provisions + configures the kata VM)
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
scheduling:
  nodeSelector:
    kata: "true"
  tolerations:
  - key: {{ .Values.kata.taintKey | default "pool" }}
    operator: Equal
    value: {{ .Values.kata.taintValue | default "kata" }}
    effect: NoSchedule
overhead:
  podFixed:
    memory: "128Mi"
    cpu: "20m"
{{- end }}
