{{- if and .Values.openbao.enabled .Values.eso.enabled }}
# =============================================================================
# ESO (External Secrets Operator) wiring for OpenBao.
# The ESO controller is installed via the external-secrets subchart (Chart.yaml).
# This file adds the k8s-side resources the controller needs to talk to OpenBao:
#
#   eso-openbao-sa  (ServiceAccount in the app/release namespace, where ESO runs)
#     → OpenBao k8s auth: role "eso" is bound to this SA
#     → ESO controller exchanges the SA token for a Vault token
#
#   SecretStore "openbao-alchemi" (namespaced — the ESO controller is scoped to the
#   release namespace, so several instances can share a cluster without colliding)
#     → Vault provider, path "alchemi", v2, kubernetes auth, role=eso
#     → referenced by ExternalSecrets in provider-secrets.yaml
# =============================================================================
# SA that ESO uses when calling the OpenBao kubernetes auth endpoint.
# Its name + namespace MUST match the role binding in the init job (step 8).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-openbao-sa
  namespace: {{ include "alchemi.ns.app" $ }}
  labels:
    app.kubernetes.io/part-of: alchemistudio-platform
---
# SecretStore: tells ESO how to reach OpenBao and authenticate.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-alchemi
  namespace: {{ include "alchemi.ns.app" $ }}
  labels:
    app.kubernetes.io/part-of: alchemistudio-platform
spec:
  # Re-validate every 60s. On a fresh install ESO first checks this store while OpenBao is
  # still sealed (the openbao-init hook unseals it a few minutes later) and would otherwise
  # back off for a long time, leaving the provider secrets unsynced until the next retry.
  refreshInterval: 60
  provider:
    vault:
      server: {{ include "alchemi.baoAddr" . | quote }}
      path: "alchemi"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso"
          serviceAccountRef:
            name: "eso-openbao-sa"
            namespace: {{ include "alchemi.ns.app" $ }}
{{- end }}
