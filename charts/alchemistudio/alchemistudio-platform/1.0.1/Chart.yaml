annotations:
  catalog.cattle.io/certified: partner
  catalog.cattle.io/display-name: AlchemiStudio Platform
  catalog.cattle.io/kube-version: '>=1.27.0-0'
  catalog.cattle.io/release-name: alchemistudio-platform
apiVersion: v2
appVersion: 1.1.0
dependencies:
- condition: keycloak.enabled
  name: alchemi-keycloak
  repository: oci://alchemiacr.azurecr.io/helm
  version: 1.0.5
- condition: web.enabled
  name: alchemi-web
  repository: oci://alchemiacr.azurecr.io/helm
  version: 1.0.5
- condition: ai.enabled
  name: alchemi-ai
  repository: oci://alchemiacr.azurecr.io/helm
  version: 1.0.5
- condition: computeApi.enabled
  name: alchemi-compute-api
  repository: oci://alchemiacr.azurecr.io/helm
  version: 1.0.5
- condition: worker.enabled
  name: alchemi-worker
  repository: oci://alchemiacr.azurecr.io/helm
  version: 1.0.5
- condition: zenith.enabled
  name: alchemi-zenith
  repository: oci://alchemiacr.azurecr.io/helm
  version: 1.0.5
- condition: guardrails.enabled
  name: alchemi-guardrails
  repository: oci://alchemiacr.azurecr.io/helm
  version: 1.0.5
- condition: eso.enabled
  name: external-secrets
  repository: https://charts.external-secrets.io
  version: 0.10.3
description: Alchemi AI platform (web, ai, compute, workers, guardrails, auth) for
  SUSE Rancher / AI Factory. Install as a Rancher App (guided form via questions.yaml)
  or reference as a single-component AI Factory Blueprint. One domain input fans out
  to the APISIX routes, Keycloak hostnames, and redirect URIs.
home: https://alchemistudio.ai
icon: file://assets/icons/alchemistudio-platform.ico
kubeVersion: '>=1.27.0-0'
maintainers:
- email: support@alchemistudio.ai
  name: AlchemiStudio
  url: https://alchemistudio.ai
name: alchemistudio-platform
sources:
- https://alchemistudio.ai
type: application
version: 1.0.1
