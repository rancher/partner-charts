    -- Roles (4 system roles) — account_id / admin user resolved from DB at seed time
    DO $$
    DECLARE
        v_admin_id   uuid;
        v_account_id uuid;
        v_admin_email text := '${ADMIN_EMAIL}';
    BEGIN
        SELECT id INTO v_admin_id FROM users WHERE email = v_admin_email;
        IF v_admin_id IS NULL THEN
            RAISE EXCEPTION 'Admin user with email % not found. Run 01-users.sql first.', v_admin_email;
        END IF;

        SELECT a.id INTO v_account_id
        FROM accounts a
        JOIN account_memberships am ON am.account_id = a.id AND am.user_id = v_admin_id
        LIMIT 1;
        IF v_account_id IS NULL THEN
            RAISE EXCEPTION 'No account found for admin user. Run 02-account.sql first.';
        END IF;

        INSERT INTO roles (id, account_id, name, description, type, is_default, is_deleted, created_by, updated_by, created_at, updated_at, provider)
        VALUES
            ('24fd0b49-cdef-4553-aab5-82c357e7cd06', v_account_id, 'OWNER',        NULL, 'WORKSPACE', false, false, v_admin_id, v_admin_id, '2024-09-04 12:47:29.877+00', '2024-09-04 12:47:29.877+00', 'PLATFORM'),
