            ('3f5386d9-80e8-4895-8057-aa829019900c', v_account_id, 'USER',         NULL, 'SYSTEM',    false, false, v_admin_id, v_admin_id, '2024-09-04 12:47:29.879+00', '2024-09-04 12:47:29.879+00', 'PLATFORM'),
            ('8a59f4f0-8171-464d-8b89-a5693b7f3bfa', v_account_id, 'ADMIN',        '',   'SYSTEM',    false, false, v_admin_id, v_admin_id, '2024-09-04 12:47:29.879+00', '2026-01-30 06:58:10.547+00', 'PLATFORM')
        ON CONFLICT (id) DO UPDATE SET
            account_id = EXCLUDED.account_id,
            updated_by = EXCLUDED.updated_by,
            updated_at = now();

        RAISE NOTICE 'Roles seeded for account %', v_account_id;
    END $$;

