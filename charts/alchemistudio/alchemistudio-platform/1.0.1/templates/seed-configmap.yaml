    INSERT INTO role_permissions (role_id, permission_id) VALUES ('3f5386d9-80e8-4895-8057-aa829019900c', 'd3b11031-dada-49c4-8b97-5229720620aa') ON CONFLICT (role_id, permission_id) DO NOTHING;
