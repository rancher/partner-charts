# =============================================================================
# Alchemi seed SQL — FULL parity with on-prem releases/v5.1.0/04-scripts/seed and
# azure-marketplace/manifests/db/seed. The seed Job (seed-job.yaml) sed-substitutes
# ${ADMIN_EMAIL}/${ADMIN_NAME}/${ACCOUNT_NAME}/${CUSTOMER_DOMAIN}/${CONTAINER_REGISTRY}
# into these before psql applies them (glob-sorted). migrate != seed: the migrator
# builds the schema; THESE create the first admin/org + the standard-trial defaults
# (roles, meters, compute image, entitlements/seats, limits, default agent, credits,
# group allocation). Idempotent. Generated from the on-prem seeds — keep in sync.
# =============================================================================
{{- if .Values.seed.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: alchemi-seed-sql
  namespace: {{ .Values.global.namespaces.app }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
data:
  01-users.sql: |
    -- =============================================================================
    -- Seed: Initial Admin User (On-Prem)
    -- Creates the first user for the platform — one admin to bootstrap everything.
    --
    -- USAGE: Replace the placeholders before running:
    --   __ADMIN_EMAIL__   →  e.g. admin@company.com
    --   __ADMIN_NAME__    →  e.g. John Doe
    --
    -- This user gets ADMIN role in admin_users (account admin, not platform super admin).
    -- Same UUID is used in both tables so FKs stay consistent.
    -- All other users are created through the app after initial setup.
    -- =============================================================================

    BEGIN;

    -- Generate a consistent UUID for the admin user
    -- (or replace with a fixed UUID if you prefer)
    DO $$
    DECLARE
        v_admin_id uuid := gen_random_uuid();
        v_email    text := '${ADMIN_EMAIL}';
        v_name     text := '${ADMIN_NAME}';
    BEGIN
        -- 1. Insert into users table.
        -- Conflict on email (unique constraint) — re-runs update in-place and
        -- capture the existing row's id so subsequent NOTICE shows the real UUID.
        INSERT INTO users (id, email, name, is_active, email_verified, global_preferences)
        VALUES (v_admin_id, v_email, v_name, true, true, '{}'::jsonb)
        ON CONFLICT (email) DO UPDATE SET
            name = EXCLUDED.name,
            is_active = EXCLUDED.is_active,
            email_verified = EXCLUDED.email_verified,
            updated_at = now()
        RETURNING id INTO v_admin_id;

        -- 2. Insert into admin_users table (ADMIN role for account administration).
        INSERT INTO admin_users (id, email, name, app_role, is_active, email_verified, global_preferences)
        VALUES (v_admin_id, v_email, v_name, 'ADMIN', true, true, '{}'::jsonb)
        ON CONFLICT (email) DO UPDATE SET
            name = EXCLUDED.name,
            app_role = 'ADMIN',
            is_active = EXCLUDED.is_active,
            email_verified = EXCLUDED.email_verified,
            updated_at = now();

        RAISE NOTICE 'Admin user created: % (%) with id %', v_name, v_email, v_admin_id;
    END $$;

    COMMIT;

  02-account.sql: |
    -- =============================================================================
    -- Seed: Initial Account, Default Group & Membership (On-Prem)
    -- Creates one account with a default group and assigns the admin user.
    --
    -- USAGE: Replace placeholders before running:
    --   __ACCOUNT_NAME__   →  e.g. Acme Corp
    --   __ACCOUNT_DOMAIN__ →  e.g. acme.com
    --   __ADMIN_EMAIL__    →  same email used in 01-users.sql
    --
    -- This script references the admin user created in 01-users.sql.
    -- All other users/groups are created through the app after setup.
    -- =============================================================================

    BEGIN;

    DO $$
    DECLARE
        v_admin_id     uuid;
        v_account_id   uuid;
        v_group_id     uuid;
        v_account_name text := '${ACCOUNT_NAME}';
        v_domain       text := '${CUSTOMER_DOMAIN}';
        v_admin_email  text := '${ADMIN_EMAIL}';
    BEGIN
        -- Look up admin user created in 01-users.sql
        SELECT id INTO v_admin_id FROM users WHERE email = v_admin_email;
        IF v_admin_id IS NULL THEN
            RAISE EXCEPTION 'Admin user with email % not found. Run 01-users.sql first.', v_admin_email;
        END IF;

        -- Guard: refuse to proceed if this domain already has MORE THAN ONE account.
        -- accounts.domain is NOT unique at the DB level, and an older non-idempotent
        -- version of this script (pre-`fix(seed): make 02-account.sql idempotent`)
        -- created a fresh random-UUID account on every run — so a re-run/retry after
        -- an error left two "<domain>" accounts. The `LIMIT 1` lookup below (and in
        -- 05/06 seeds) would then silently pick one and split the seed across both.
        -- Fail loud here so the operator resolves to a single account first.
        IF (SELECT count(*) FROM accounts WHERE domain = v_domain) > 1 THEN
            RAISE EXCEPTION 'Found % accounts for domain % — duplicates exist. Resolve to a single account before re-seeding (see POST-INSTALL-CHECKLIST / duplicate-account note).',
                (SELECT count(*) FROM accounts WHERE domain = v_domain), v_domain;
        END IF;

        -- 1. Upsert account — idempotent on domain (natural key for on-prem installs).
        -- Reuse the existing account id if this domain was already seeded, so re-runs
        -- do not create a second account row with a different UUID.
        SELECT id INTO v_account_id FROM accounts WHERE domain = v_domain LIMIT 1;
        IF v_account_id IS NULL THEN
            v_account_id := gen_random_uuid();
        END IF;

        INSERT INTO accounts (id, name, type, status, domain, subscription_plan, settings, billing_info, billing_email, created_by, updated_by)
        VALUES (
            v_account_id,
            v_account_name,
            'BUSINESS',
            'ACTIVE',
            v_domain,
            'ENTERPRISE',
            jsonb_build_object(
                'features', jsonb_build_object('chat', true, 'marketplace', true, 'quick_app', true),
                'onprem', true
            ),
            '{}'::jsonb,
            v_admin_email,
            v_admin_id,
            v_admin_id
        )
        ON CONFLICT (id) DO UPDATE SET
            name = EXCLUDED.name,
            domain = EXCLUDED.domain,
            updated_at = now();

        -- 2. Upsert default group — idempotent on (account_id, is_default).
        SELECT id INTO v_group_id FROM groups
        WHERE account_id = v_account_id AND is_default = true LIMIT 1;
        IF v_group_id IS NULL THEN
            v_group_id := gen_random_uuid();
        END IF;

        INSERT INTO groups (id, account_id, name, description, is_default, owner_id, created_by, updated_by)
        VALUES (
            v_group_id,
            v_account_id,
            'Default',
            'Default group for all users',
            true,
            v_admin_id,
            v_admin_id,
            v_admin_id
        )
        ON CONFLICT (id) DO UPDATE SET
            name = EXCLUDED.name,
            updated_at = now();

        -- 3. Add admin as account member (ADMIN role, assigned to default group)
        INSERT INTO account_memberships (account_id, user_id, app_role, is_active, group_id, invited_by)
        VALUES (
            v_account_id,
            v_admin_id,
            'ADMIN',
            true,
            v_group_id,
            v_admin_id
        )
        ON CONFLICT (account_id, user_id) DO UPDATE SET
            app_role = 'ADMIN',
            group_id = EXCLUDED.group_id,
            is_active = true,
            updated_at = now();

        RAISE NOTICE 'Account upserted: % (%) id=%', v_account_name, v_domain, v_account_id;
        RAISE NOTICE 'Default group: id=%', v_group_id;
        RAISE NOTICE 'Admin % assigned to account with ADMIN role in default group', v_admin_email;
    END $$;

    COMMIT;

