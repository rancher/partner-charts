{{- /*
  Attach the image-pull secret to the `default` ServiceAccount in EVERY platform
  namespace, so any pod that does NOT set imagePullSecrets explicitly still
  authenticates to the private registry. App deployments set imagePullSecrets on
  their own pods, but pods created DYNAMICALLY at runtime — code sandboxes /
  AIOS pods (compute-api pool_service in the `albox` namespace), ad-hoc Jobs —
  inherit only the namespace default SA. Without this they pull anonymously and
  fail with a 401 (ImagePullBackOff). This is the belt-and-suspenders fix so a
  customer trial never hits a pull failure on a dynamic pod.

  Implemented as a post-install/post-upgrade hook that PATCHes each default SA via
  the Kubernetes API using the baked platform/curl image (no kubectl dependency).
  Gated on imageCredentials.username — the same condition under which
  image-pull-secret.yaml actually creates the secret.
*/ -}}
{{- if .Values.global.imageCredentials.username }}
{{- $ps := .Values.global.image.pullSecret -}}
{{- $nss := (list .Release.Namespace .Values.global.namespaces.app .Values.global.namespaces.data .Values.global.namespaces.observability .Values.global.namespaces.sandbox) | uniq -}}
{{- if .Values.keycloak.enabled -}}{{- $nss = (append $nss .Values.global.namespaces.auth) | uniq -}}{{- end -}}
{{- if .Values.openbao.enabled -}}{{- $nss = (append $nss (.Values.openbao.namespace | default "openbao")) | uniq -}}{{- end -}}
{{- if .Values.eso.enabled -}}{{- $nss = (append $nss "external-secrets") | uniq -}}{{- end -}}
{{- if eq .Values.gateway.mode "bundled" -}}{{- $nss = (append $nss "apisix") | uniq -}}{{- end -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alchemi-sa-pullsecret-patcher
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-alchemi-sa-pullsecret-patcher
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-alchemi-sa-pullsecret-patcher
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-alchemi-sa-pullsecret-patcher
subjects:
  - kind: ServiceAccount
    name: alchemi-sa-pullsecret-patcher
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: alchemi-default-sa-pullsecret
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: { app.kubernetes.io/part-of: alchemistudio-platform }
    spec:
      serviceAccountName: alchemi-sa-pullsecret-patcher
      restartPolicy: Never
      # This Job pulls its OWN image (platform/curl) from the private registry, so it
      # needs the pull secret too — chicken-and-egg: it can't rely on the default SA it
      # is about to patch. Reference the registry secret ($ps) that the app deployments use.
      imagePullSecrets:
        - name: {{ $ps }}
      containers:
        - name: patch
          image: {{ .Values.global.image.registry }}/platform/curl:8.5.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PULL_SECRET
              value: {{ $ps | quote }}
            - name: NAMESPACES
              value: {{ join " " $nss | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              API="https://kubernetes.default.svc"
              SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
              TOKEN="$(cat $SA_DIR/token)"
              CACERT="$SA_DIR/ca.crt"
              PATCH="{\"imagePullSecrets\":[{\"name\":\"${PULL_SECRET}\"}]}"
              rc=0
              for ns in $NAMESPACES; do
                echo "patching ${ns}/serviceaccounts/default -> ${PULL_SECRET}"
                code=$(curl -sS -o /tmp/out -w '%{http_code}' \
                  --cacert "$CACERT" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/strategic-merge-patch+json" \
                  -X PATCH "$API/api/v1/namespaces/${ns}/serviceaccounts/default" \
                  --data "$PATCH" || echo "000")
                if [ "$code" = "200" ]; then
                  echo "  ok ($code)"
                else
                  echo "  WARN ns=$ns http=$code $(cat /tmp/out 2>/dev/null | head -c 200)"
                  # A missing namespace/default-SA is non-fatal (best-effort convenience patch).
                fi
              done
              exit $rc
{{- end }}
