# =============================================================================
# BYO TLS secret — the wildcard cert the routes Job binds as the APISIX SSL object.
# Created only when tls.mode=byo and both PEMs are supplied (e.g. via
#   --set-file tls.certPem=tls.crt --set-file tls.keyPem=tls.key ).
# Lives in the apisix namespace (where the routes Job mounts it). If you manage the
# secret out-of-band, leave certPem/keyPem blank and pre-create tls.secretName.
# =============================================================================
{{- if and .Values.tls.enabled (eq .Values.tls.mode "byo") .Values.tls.certPem .Values.tls.keyPem }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tls.secretName }}
  namespace: apisix
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.certPem | b64enc }}
  tls.key: {{ .Values.tls.keyPem | b64enc }}
{{- end }}
{{- /* selfsigned: generate a self-signed wildcard cert for the domain (trials/eval —
     no real CA). Without this, tls.mode=selfsigned created NO secret and the routes
     Job aborted with "TLS on but cert/key missing". Regenerates on upgrade (fine for
     selfsigned). Lives in the apisix ns where the routes Job mounts it. */}}
{{- if and .Values.tls.enabled (eq .Values.tls.mode "selfsigned") }}
{{- $d := required "global.domain is required" .Values.global.domain }}
{{- $cert := genSelfSignedCert $d nil (list $d (printf "*.%s" $d)) 3650 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tls.secretName }}
  namespace: apisix
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
