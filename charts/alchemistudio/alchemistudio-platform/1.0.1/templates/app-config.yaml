metadata:
  name: alchemi-workflow-config
  namespace: {{ $appns }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  WORKFLOW_RUNTIME_PORT: "8080"
  WORKFLOW_RUNTIME_SIGNATURE_MAX_SKEW_MS: "30000"
  WORKFLOW_RUNTIME_MAX_BODY_BYTES: "1048576"
  WORKFLOW_RUNTIME_ACCEPT_STARTS: "true"
  WORKFLOW_RUNTIME_DEFAULT_KIND: "legacy_external"
  WORKFLOW_RUNTIME_NONCE_BACKEND: "redis"
  WORKFLOW_RUNTIME_SCHEDULE_POLL_MS: "5000"
  WORKFLOW_RUNTIME_DISPATCH_POLL_MS: "1000"
  WORKFLOW_RUNTIME_DISPATCH_BATCH_SIZE: "25"
  WORKFLOW_RUNTIME_DISPATCH_STALE_MS: "60000"
  WORKFLOW_RUN_CREDITS: "1"
  WORKFLOW_STEP_CREDITS: "1"
  COMPUTE_API_URL: {{ printf "http://alchemi-compute-api.%s.svc.cluster.local:8000" $appns | quote }}
  WORKFLOW_CODE_PROVISION_TIMEOUT_MS: "120000"
  WORKFLOW_CODE_POLL_INTERVAL_MS: "1000"
  WORKFLOW_CODE_COMPUTE_REQUEST_TIMEOUT_MS: "30000"
  WORKFLOW_CODE_TIMEOUT_MS: "10000"
  WORKFLOW_CODE_MEMORY_MIB: "64"
  WORKFLOW_CODE_OUTPUT_BYTES: "1048576"
  AI_API_URL: {{ printf "http://alchemi-ai.%s.svc.cluster.local:8000" $appns | quote }}
  WORKFLOW_AI_STEP_TIMEOUT_MS: "120000"
  WORKFLOW_AI_AGENT_TIMEOUT_MS: "300000"
  WORKFLOW_WEB_URL: {{ printf "http://alchemi-web.%s.svc.cluster.local:3000" $appns | quote }}
  WORKFLOW_WAIT_RESUME_POLL_MS: "60000"
  WORKFLOW_WAIT_RESUME_TIMEOUT_MS: "15000"
  POSTGRES_HOST: {{ $pgHost | quote }}
  POSTGRES_PORT: {{ $pgPort | quote }}
  POSTGRES_USER: {{ include "alchemi.pgUser" . | quote }}
  POSTGRES_DATABASE: {{ include "alchemi.pgDatabase" . | quote }}
  PGSSLMODE: {{ include "alchemi.pgSslMode" . | quote }}
  REDIS_HOST: {{ $redisHost | quote }}
  REDIS_PORT: {{ $redisPort | quote }}
  REDIS_TLS: {{ $redisTls | quote }}
  REDIS_CLUSTER: "false"
  REDIS_USERNAME: "default"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ $otel | quote }}
  OTEL_SERVICE_NAME: "alchemi-workflow"
  OPENOBSERVE_ENV: "suse"
---
{{- end }}
{{- if .Values.zenith.enabled }}
