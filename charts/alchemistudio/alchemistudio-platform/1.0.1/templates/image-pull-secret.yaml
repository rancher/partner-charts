{{- /*
  Image pull secret — CREATES the docker-registry secret named global.image.pullSecret
  (default "alchemi-registry") from global.imageCredentials, in every namespace where
  pods pull images (secrets are namespace-local). Every app subchart + platform pod
  already references this secret by name, so entering creds in the Rancher/SUSE form is
  all that's needed. Skipped when username is blank (use a pre-created secret / public
  images). Server host = global.image.registry (where the images are pulled from).
*/ -}}
{{- if .Values.global.imageCredentials.username }}
{{- $reg := .Values.global.image.registry }}
{{- $u := .Values.global.imageCredentials.username }}
{{- $p := .Values.global.imageCredentials.password | default "" }}
{{- $auth := printf "%s:%s" $u $p | b64enc }}
{{- $cfg := dict "auths" (dict $reg (dict "username" $u "password" $p "auth" $auth)) | toJson | b64enc }}
{{- /* .Release.Namespace included because the external-secrets SUBCHART deploys into the
     release namespace (whatever Rancher/the operator picks, e.g. alchemi3), not a fixed ns. */}}
{{- $nss := (list .Release.Namespace .Values.global.namespaces.app .Values.global.namespaces.data .Values.global.namespaces.observability .Values.global.namespaces.sandbox) | uniq -}}
{{- if .Values.keycloak.enabled -}}{{- $nss = (append $nss .Values.global.namespaces.auth) | uniq -}}{{- end -}}
{{- if .Values.openbao.enabled -}}{{- $nss = (append $nss (.Values.openbao.namespace | default "openbao")) | uniq -}}{{- end -}}
{{- if .Values.eso.enabled -}}{{- $nss = (append $nss "external-secrets") | uniq -}}{{- end -}}
{{- if eq .Values.gateway.mode "bundled" -}}{{- $nss = (append $nss "apisix") | uniq -}}{{- end -}}
{{- range $ns := $nss }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.global.image.pullSecret }}
  namespace: {{ $ns }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $cfg }}
{{- end }}
{{- end }}
