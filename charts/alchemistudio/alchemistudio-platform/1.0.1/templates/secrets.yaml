# =============================================================================
# alchemi-secrets — app secrets GENERATED at install (never asked in the form),
# matching the Azure bootstrap's `openssl rand` set. Generated ONCE here, then
# replicated to the data + observability namespaces because the bundled
# pgvector/redis/openobserve pods live there and secrets are namespace-local.
# Persisted across upgrades via `lookup` (reuse the existing values -> keys don't
# rotate, which would break sessions / encrypted data).
# =============================================================================
{{- $appns := .Values.global.namespaces.app -}}
{{- $existing := (lookup "v1" "Secret" $appns "alchemi-secrets") -}}
{{/* Generated defaults for EVERY key. On upgrade we `merge` these UNDER the existing
     values, so existing secrets are preserved (no rotation) and only NEW keys added. */}}
{{- $gen := dict
      "ALCHEMI_ENCRYPTION_KEY" (randAlphaNum 32 | b64enc)
      "JWT_SECRET" (randAlphaNum 43 | b64enc)
      "NEXTAUTH_SECRET" (randAlphaNum 43 | b64enc)
      "ZENITH_NEXTAUTH_SECRET" (randAlphaNum 43 | b64enc)
      "COMPUTE_API_SECRET_KEY" (randAlphaNum 43 | b64enc)
      "KEYCLOAK_ADMIN_CLIENT_SECRET" (uuidv4 | b64enc)
      "KEYCLOAK_WEB_CLIENT_SECRET" (uuidv4 | b64enc)
      "KEYCLOAK_CLIENT_SECRET" (uuidv4 | b64enc)
      "GUARDRAILS_API_KEY" (randAlphaNum 40 | b64enc)
      "PG_SUPER_PASSWORD" (randAlphaNum 24 | b64enc)
      "PG_APP_PASSWORD" (randAlphaNum 24 | b64enc)
      "REDIS_PASSWORD" (randAlphaNum 24 | b64enc)
      "KC_ADMIN_PASSWORD" (randAlphaNum 24 | b64enc)
      "OPENOBSERVE_PASSWORD" (printf "%sAa1#" (randAlphaNum 20) | b64enc)
      "INTERNAL_TOKEN" (randAlphaNum 32 | b64enc)
      "SESSION_SECRET" (randAlphaNum 43 | b64enc)
      "ACCESS_TOKEN_PEPPER" (randAlphaNum 32 | b64enc)
      "HEALTH_CHECK_TOKEN" (randAlphaNum 32 | b64enc)
      "FIRST_USER_PASSWORD" (printf "%sAa1#" (randAlphaNum 16) | b64enc)
      "SEAWEEDFS_ACCESS_KEY" (randAlphaNum 20 | b64enc)
      "SEAWEEDFS_SECRET_KEY" (randAlphaNum 40 | b64enc)
      "WORKFLOW_RUNTIME_INTERNAL_SECRET" (randAlphaNum 43 | b64enc) -}}
{{- $d := $gen -}}
{{- if and $existing $existing.data -}}
{{-   $d = merge (deepCopy $existing.data) $gen -}}
{{- end -}}
{{- /* First-user password: honor an operator-supplied admin.initialPassword (optional,
       from the form); blank -> keep the generated value. Either way the realm job applies
       it as a TEMPORARY password (reset on first login), so it is single-use regardless
       of source. Override AFTER the merge so a supplied value wins on a fresh install;
       on upgrade the user already exists and the realm job leaves the password as-is. */ -}}
{{- if .Values.admin.initialPassword -}}
{{-   $_ := set $d "FIRST_USER_PASSWORD" (.Values.admin.initialPassword | b64enc) -}}
{{- end -}}
{{- $authns := .Values.global.namespaces.auth -}}
{{- $nslist := (list $appns .Values.global.namespaces.data .Values.global.namespaces.observability) | uniq -}}
{{- if .Values.keycloak.enabled -}}
{{-   $nslist = (append $nslist $authns) | uniq -}}
{{- end -}}
{{- range $n := $nslist }}
apiVersion: v1
kind: Secret
metadata:
  name: alchemi-secrets
  namespace: {{ $n }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
  annotations:
    "helm.sh/resource-policy": keep          # hold encryption keys — never GC
type: Opaque
data:
{{- range $k, $v := $d }}
  {{ $k }}: {{ $v }}
{{- end }}
---
{{- end }}
# The license (optional). No JWT -> the platform runs in FIXED-SEATS mode (the
# license-server / app enforces the seat cap); a JWT unlocks the licensed plan.
apiVersion: v1
kind: Secret
metadata:
  name: alchemi-license
  namespace: {{ $appns }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
type: Opaque
stringData:
  LICENSE_JWT: {{ .Values.license.jwt | default "" | quote }}
  LICENSE_MODE: {{ if .Values.license.jwt }}"licensed"{{ else }}"fixed-seats"{{ end }}
{{- /* ---- Per-app Secrets: DB/Redis URLs built from the generated passwords in
       $d (b64dec'd), so they stay consistent on install AND upgrade. Names match
       each subchart's `<fullname>-secrets`; subcharts set secret.create:false. ---- */}}
{{- $pgUser := include "alchemi.pgUser" . -}}
{{- $pgHost := include "alchemi.pgHost" . -}}
{{- $pgPort := include "alchemi.pgPort" . -}}
{{- $ssl := include "alchemi.pgSslMode" . -}}
{{- $appDb := include "alchemi.pgDatabase" . -}}
{{- $aiDb := include "alchemi.pgAiDatabase" . -}}
{{- $computeDb := include "alchemi.pgComputeDatabase" . -}}
{{- $rHost := include "alchemi.redisHost" . -}}
{{- $rPort := include "alchemi.redisPort" . -}}
{{- /* external PG uses the CUSTOMER's password; bundled uses the generated one.
     The app DSNs below embed the password inline, so external mode needs the plaintext
     external.password (external.passwordSecret is supported for the JOB PGPASSWORD path
     via alchemi.pgPasswordEnv, but not for these embedded app DSNs). */}}
{{- $pgPass := "" -}}
{{- if eq .Values.postgres.mode "external" -}}
{{-   $pgPass = required "postgres.external.password is required when postgres.mode=external (app DSNs embed it)" .Values.postgres.external.password -}}
{{- else -}}
{{-   $pgPass = index $d "PG_SUPER_PASSWORD" | b64dec -}}
{{- end -}}
{{- $rPass := index $d "REDIS_PASSWORD" | b64dec -}}
{{- $appDbUrl := printf "postgresql://%s:%s@%s:%s/%s?sslmode=%s" $pgUser $pgPass $pgHost $pgPort $appDb $ssl -}}
{{- $aiDbUrl := printf "postgresql://%s:%s@%s:%s/%s?sslmode=%s" $pgUser $pgPass $pgHost $pgPort $aiDb $ssl -}}
{{- $computeDbUrl := printf "postgresql://%s:%s@%s:%s/%s?sslmode=%s" $pgUser $pgPass $pgHost $pgPort $computeDb $ssl -}}
{{/* asyncpg (used by compute-api) rejects sslmode — strip it; ssl defaults off for in-cluster. */}}
{{- $asyncpgComputeDbUrl := printf "postgresql://%s:%s@%s:%s/%s" $pgUser $pgPass $pgHost $pgPort $computeDb -}}
{{- $asyncpgAppDbUrl := printf "postgresql://%s:%s@%s:%s/%s" $pgUser $pgPass $pgHost $pgPort $appDb -}}
{{- $redisUrl := printf "redis://default:%s@%s:%s" $rPass $rHost $rPort -}}
{{/*
  Object store connection details.
  bundled = SeaweedFS S3 API (port 8333). App must use S3 env vars.
  external = Azure Blob via azure-storage-blob SDK (AZURE_STORAGE_CONNECTION_STRING).
  Both sets of env vars are written; the app selects the backend via OBJECT_STORE_BACKEND
  (set in app-config.yaml: "s3" for bundled, "azure" for external).
*/}}
{{- $s3Access := index $d "SEAWEEDFS_ACCESS_KEY" | b64dec -}}
{{- $s3Secret := index $d "SEAWEEDFS_SECRET_KEY" | b64dec -}}
{{- $s3Endpoint := printf "http://seaweedfs.%s.svc:8333" .Values.global.namespaces.data -}}
{{- $blobConnStr := "" -}}
{{- $blobAccountName := "" -}}
{{- $blobAccountKey := "" -}}
{{- $blobEndpoint := "" -}}
{{- if ne .Values.objectStore.mode "bundled" -}}
{{-   if .Values.objectStore.external.connectionString -}}
{{-     $blobConnStr = .Values.objectStore.external.connectionString -}}
{{-     $blobAccountName = .Values.objectStore.external.accountName | default "" -}}
{{-     $blobAccountKey = .Values.objectStore.external.accountKey | default "" -}}
{{-     $blobEndpoint = .Values.objectStore.external.blobEndpoint | default "" -}}
{{-   else -}}
{{-     $blobAccountName = .Values.objectStore.external.accountName | default "" -}}
{{-     $blobAccountKey = .Values.objectStore.external.accountKey | default "" -}}
{{-     $blobEndpoint = .Values.objectStore.external.blobEndpoint | default "" -}}
{{-     if and $blobAccountName $blobAccountKey $blobEndpoint -}}
{{-       $blobConnStr = printf "DefaultEndpointsProtocol=https;AccountName=%s;AccountKey=%s;BlobEndpoint=%s;" $blobAccountName $blobAccountKey $blobEndpoint -}}
{{-     end -}}
{{-   end -}}
{{- end -}}
{{/*
  seaweedfs-s3-config Secret — identity.json mounted into the SeaweedFS pod.
  SeaweedFS reads this on startup to grant S3 access to the generated credentials.
  Only rendered when objectStore.mode=bundled.
*/}}
{{- if eq .Values.objectStore.mode "bundled" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-config
  namespace: {{ .Values.global.namespaces.data }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  identity.json: |
    {
      "identities": [
        {
          "name": "alchemi",
          "credentials": [
            { "accessKey": {{ $s3Access | quote }}, "secretKey": {{ $s3Secret | quote }} }
          ],
          "actions": ["Admin", "Read", "Write", "Tagging", "List"]
        },
        {
          "_comment": "Anonymous GET-by-key on the objects bucket ONLY (no List = no enumeration). Browser file downloads carry no S3 credentials and the app emits UNSIGNED object URLs; this lets the APISIX /filestore route serve them. Unguessable UUID keys = public-container model (parity with Azure Blob). See docs/16-aios-storage-and-download-routing.md.",
          "name": "anonymous",
          "actions": ["Read:{{ .Values.objectStore.bucket | default "alchemi-objects" }}"]
        }
      ]
    }
{{- end }}
{{- if .Values.ai.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: alchemi-ai-secrets
  namespace: {{ $appns }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
type: Opaque
stringData:
  DB_USER: {{ $pgUser | quote }}
  DB_PASSWORD: {{ $pgPass | quote }}
  DATABASE_URL: {{ $aiDbUrl | quote }}
  POSTGRES_URL: {{ $aiDbUrl | quote }}
  POSTGRES_URI: {{ $aiDbUrl | quote }}
  APP_POSTGRES_URI: {{ $appDbUrl | quote }}
  REDIS_PASSWORD: {{ $rPass | quote }}
  REDIS_URL: {{ $redisUrl | quote }}
  REDIS_URI: {{ $redisUrl | quote }}
  ALCHEMI_AI_INTERNAL_TOKEN: {{ index $d "INTERNAL_TOKEN" | b64dec | quote }}
  # Presented BY ai when calling compute-api for code sandboxes; must equal
  # compute-api's ALCHEMI_INTERNAL_TOKEN. Both map to the shared INTERNAL_TOKEN.
  COMPUTE_INTERNAL_TOKEN: {{ index $d "INTERNAL_TOKEN" | b64dec | quote }}
  # Presented BY ai when calling the guardrails services; must equal
  # GUARDRAILS_INTERNAL_TOKEN in guardrails-<svc>-secrets. Shared INTERNAL_TOKEN.
  GUARDRAILS_INTERNAL_TOKEN: {{ index $d "INTERNAL_TOKEN" | b64dec | quote }}
  # shared platform key — MUST match web/console so ai can decrypt stored provider API keys
  ALCHEMI_ENCRYPTION_KEY: {{ index $d "ALCHEMI_ENCRYPTION_KEY" | b64dec | quote }}
  # OpenObserve auth — ai WRITES audit/app logs to OO (gated by OPENOBSERVE_ENABLED in config)
  OPENOBSERVE_PASSWORD: {{ index $d "OPENOBSERVE_PASSWORD" | b64dec | quote }}
  # Object store creds — bundled SeaweedFS (S3). Provider/endpoint/bucket are
  # non-secret and set in alchemi-ai-config. OpenDAL's s3 provider reads S3_*
  # (AWS_* kept as the documented fallback the code also accepts).
  S3_ACCESS_KEY_ID: {{ $s3Access | quote }}
  S3_SECRET_ACCESS_KEY: {{ $s3Secret | quote }}
  AWS_ACCESS_KEY_ID: {{ $s3Access | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $s3Secret | quote }}
  AZURE_STORAGE_CONNECTION_STRING: {{ $blobConnStr | quote }}
  AZURE_STORAGE_ACCOUNT_NAME: {{ $blobAccountName | quote }}
  AZURE_STORAGE_ACCOUNT_KEY: {{ $blobAccountKey | quote }}
  AZURE_BLOB_ENDPOINT: {{ $blobEndpoint | quote }}
{{- end }}
{{- if .Values.computeApi.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: alchemi-compute-api-secrets
  namespace: {{ $appns }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
type: Opaque
stringData:
  DATABASE_URL: {{ $asyncpgComputeDbUrl | quote }}
  APP_POSTGRES_URI: {{ $asyncpgAppDbUrl | quote }}
  SECRET_KEY: {{ index $d "COMPUTE_API_SECRET_KEY" | b64dec | quote }}
  ALCHEMI_INTERNAL_TOKEN: {{ index $d "INTERNAL_TOKEN" | b64dec | quote }}
  ALCHEMI_ENCRYPTION_KEY: {{ index $d "ALCHEMI_ENCRYPTION_KEY" | b64dec | quote }}
  ACR_USERNAME: ""
  ACR_PASSWORD: ""
{{- end }}
{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: alchemi-worker-secrets
  namespace: {{ $appns }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
type: Opaque
stringData:
  REDIS_PASSWORD: {{ $rPass | quote }}
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  OPENOBSERVE_PASSWORD: {{ index $d "OPENOBSERVE_PASSWORD" | b64dec | quote }}
  ALCHEMI_ENCRYPTION_KEY: {{ index $d "ALCHEMI_ENCRYPTION_KEY" | b64dec | quote }}
  AZURE_COMMUNICATION_SERVICES_CONNECTION_STRING: {{ .Values.smtp.acsConnectionString | default "" | quote }}
  AZURE_COMMUNICATION_SERVICES_SENDER_ADDRESS: {{ .Values.smtp.from | default (printf "noreply@%s" .Values.global.domain) | quote }}
{{- end }}
{{- if .Values.workflow.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: alchemi-workflow-secrets
  namespace: {{ $appns }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  REDIS_PASSWORD: {{ $rPass | quote }}
  COMPUTE_INTERNAL_TOKEN: {{ index $d "INTERNAL_TOKEN" | b64dec | quote }}
  ALCHEMI_AI_INTERNAL_TOKEN: {{ index $d "INTERNAL_TOKEN" | b64dec | quote }}
  WORKFLOW_RUNTIME_INTERNAL_SECRET: {{ index $d "WORKFLOW_RUNTIME_INTERNAL_SECRET" | b64dec | quote }}
{{- end }}
{{- if .Values.zenith.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: alchemi-zenith-secrets
  namespace: {{ $appns }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
type: Opaque
stringData:
  NEXTAUTH_SECRET: {{ index $d "ZENITH_NEXTAUTH_SECRET" | b64dec | quote }}
  SUPERADMIN_USERNAME: "superadmin"
  SUPERADMIN_PASSWORD_HASH: ""
  DB_PASSWORD: {{ $pgPass | quote }}
  ALCHEMI_APP_DATABASE_URL: {{ $appDbUrl | quote }}
  ALCHEMI_AI_STORE_DATABASE_URL: {{ $aiDbUrl | quote }}
  ALCHEMI_COMPUTE_DATABASE_URL: {{ $computeDbUrl | quote }}
  ALCHEMI_ENCRYPTION_KEY: {{ index $d "ALCHEMI_ENCRYPTION_KEY" | b64dec | quote }}
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{ index $d "KEYCLOAK_ADMIN_CLIENT_SECRET" | b64dec | quote }}
  REDIS_PASSWORD: {{ $rPass | quote }}
  ALCHEMI_AI_INTERNAL_TOKEN: {{ index $d "INTERNAL_TOKEN" | b64dec | quote }}
  ALCHEMI_DB_TOOLS_INTERNAL_TOKEN: {{ index $d "INTERNAL_TOKEN" | b64dec | quote }}
{{- end }}
{{- if .Values.keycloak.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: {{ .Values.global.namespaces.auth }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
type: Opaque
stringData:
  KC_DB_PASSWORD: {{ $pgPass | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ index $d "KC_ADMIN_PASSWORD" | b64dec | quote }}
{{- end }}
{{- if .Values.web.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: alchemi-web-secrets
  namespace: {{ $appns }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
type: Opaque
stringData:
  DB_USER: {{ $pgUser | quote }}
  DB_PASSWORD: {{ $pgPass | quote }}
  DATABASE_URL: {{ $appDbUrl | quote }}
  POSTGRES_URL: {{ $appDbUrl | quote }}
  POSTGRES_URI: {{ $appDbUrl | quote }}
  APP_POSTGRES_URI: {{ $appDbUrl | quote }}
  REDIS_PASSWORD: {{ $rPass | quote }}
  REDIS_URL: {{ $redisUrl | quote }}
  ALCHEMI_ENCRYPTION_KEY: {{ index $d "ALCHEMI_ENCRYPTION_KEY" | b64dec | quote }}
  # OpenObserve auth — web READS audit logs from OO for the cockpit Audit Logs page
  OPENOBSERVE_PASSWORD: {{ index $d "OPENOBSERVE_PASSWORD" | b64dec | quote }}
  # Object store S3 creds — web uses SeaweedFS (s3) for media/uploads when bundled
  S3_ACCESS_KEY_ID: {{ $s3Access | quote }}
  S3_SECRET_ACCESS_KEY: {{ $s3Secret | quote }}
  AWS_ACCESS_KEY_ID: {{ $s3Access | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $s3Secret | quote }}
  JWT_SECRET: {{ index $d "JWT_SECRET" | b64dec | quote }}
  NEXTAUTH_SECRET: {{ index $d "NEXTAUTH_SECRET" | b64dec | quote }}
  SESSION_SECRET: {{ index $d "SESSION_SECRET" | b64dec | quote }}
  ACCESS_TOKEN_PEPPER: {{ index $d "ACCESS_TOKEN_PEPPER" | b64dec | quote }}
  HEALTH_CHECK_TOKEN: {{ index $d "HEALTH_CHECK_TOKEN" | b64dec | quote }}
  # MUST equal the secret the realm-bootstrap Job sets on the alchemi-web client.
  KEYCLOAK_CLIENT_SECRET: {{ index $d "KEYCLOAK_WEB_CLIENT_SECRET" | b64dec | quote }}
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{ index $d "KEYCLOAK_ADMIN_CLIENT_SECRET" | b64dec | quote }}
  ALCHEMI_AI_INTERNAL_TOKEN: {{ index $d "INTERNAL_TOKEN" | b64dec | quote }}
  ALCHEMI_COMPUTE_INTERNAL_TOKEN: {{ index $d "INTERNAL_TOKEN" | b64dec | quote }}
  COMPUTE_INTERNAL_TOKEN: {{ index $d "INTERNAL_TOKEN" | b64dec | quote }}
  WORKFLOW_RUNTIME_INTERNAL_SECRET: {{ index $d "WORKFLOW_RUNTIME_INTERNAL_SECRET" | b64dec | quote }}
{{- end }}
{{/*
  alchemi-provider-secrets — LLM API keys consumed by ai + worker via envFrom.
  When openbao.enabled=true this Secret is owned by the ESO ExternalSecret (provider-secrets.yaml).
  When openbao.enabled=false we create it directly from Helm values here (less secure; keys
  will appear in helm history — use openbao.enabled=true for production).
*/}}
{{- if not .Values.openbao.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: alchemi-provider-secrets
  namespace: {{ $appns }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.llm.anthropicApiKey | default "" | quote }}
  OPENAI_API_KEY: {{ .Values.llm.openaiApiKey | default "" | quote }}
  AZURE_OPENAI_API_KEY: {{ .Values.llm.azureOpenaiApiKey | default "" | quote }}
  AZURE_OPENAI_ENDPOINT: {{ .Values.llm.azureOpenaiEndpoint | default "" | quote }}
  AZURE_OPENAI_API_VERSION: {{ .Values.llm.azureOpenaiApiVersion | default "2024-02-01" | quote }}
  PERPLEXITY_API_KEY: {{ .Values.llm.perplexityApiKey | default "" | quote }}
  XAI_API_KEY: {{ .Values.llm.xaiApiKey | default "" | quote }}
{{- end }}
{{- /* ---- Guardrails per-service Secrets (umbrella-owned; alchemi-guardrails sets
       secret.create=false). Each carries GUARDRAILS_INTERNAL_TOKEN = the single shared
       INTERNAL_TOKEN, matching alchemi-ai-secrets.GUARDRAILS_INTERNAL_TOKEN so ai can
       sign calls to every guardrail. Deployed into the app namespace alongside the
       subchart (alchemi-guardrails.namespace=alchemi). ---- */}}
{{- if .Values.guardrails.enabled }}
{{- range $svc := (list "guardrails-content-filter" "guardrails-secret-detection" "guardrails-jailbreak" "guardrails-pii" "guardrails-topical" "guardrails-toxic") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $svc }}-secrets
  namespace: {{ $appns }}
  labels: { app.kubernetes.io/part-of: alchemistudio-platform }
type: Opaque
stringData:
  GUARDRAILS_INTERNAL_TOKEN: {{ index $d "INTERNAL_TOKEN" | b64dec | quote }}
{{- end }}
{{- end }}
