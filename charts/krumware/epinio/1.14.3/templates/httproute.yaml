{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
{{ include "epinio.labels" . | indent 4 }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
      namespace: {{ .Release.Namespace }}
    {{- if .Values.gateway.tls.enabled }}
      # TLS terminates at k8s: attach to HTTPS listeners (redirect route handles HTTP)
      sectionName: {{ .Release.Name }}-https
    {{- else }}
      # TLS is external: attach to HTTP listeners (no redirect route)
      sectionName: {{ .Release.Name }}-http
    {{- end }}
  hostnames:
    - {{ include "epinio-gateway-hostname" . }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /wapi
        - path:
            type: Exact
            value: /ready
      backendRefs:
        - name: epinio-server
          port: {{ .Values.service.port | default 80 }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: epinio-ui
          port: {{ .Values.epinioUI.service.port | default 80 }}
{{- if .Values.gateway.tls.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-https-redirect
  labels:
{{ include "epinio.labels" . | indent 4 }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
      namespace: {{ .Release.Namespace }}
      sectionName: {{ .Release.Name }}-http
  hostnames:
    - {{ include "epinio-gateway-hostname" . }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
# HttpRoute TLS conditional
{{- end }}


