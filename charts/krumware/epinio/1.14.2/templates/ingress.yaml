# Disable ingress if explicitly set to false
{{- if or .Values.ingress.enabled (not (hasKey .Values.ingress "enabled")) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: {{ .Values.ingress.nginxSSLRedirect | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.proxyBodySize | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.proxyReadTimeout | quote }}
    nginx.org/websocket-services: "epinio-server"
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key | quote }}: {{ $value | quote }}
    {{- end }}
  labels:
    app.kubernetes.io/name: epinio
  name: epinio
  namespace: {{ .Release.Namespace }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: "{{ .Values.ingress.ingressClassName }}"
  {{- end }}
  rules:
  - host: {{ (include "epinio-ingress-hostname" .) | quote }}
    http:
      paths:
      - backend:
          service:
            name: epinio-server
            port:
              number: {{ .Values.service.port | default 80 }}
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: epinio-server
            port:
              number: {{ .Values.service.port | default 80 }}
        path: /wapi
        pathType: Prefix
      - backend:
          service:
            name: epinio-server
            port:
              number: {{ .Values.service.port | default 80 }}
        path: /ready
        pathType: Exact
  {{- if .Values.epinioUI.enabled }}
      - backend:
          service:
            name: epinio-ui
            port:
              number: {{ .Values.epinioUI.service.port | default 80 }}
        path: /
        pathType: Prefix
  {{- end }}
  tls:
  - hosts:
    - {{ (include "epinio-ingress-hostname" .) | quote }}
    secretName: epinio-tls
{{- end }}