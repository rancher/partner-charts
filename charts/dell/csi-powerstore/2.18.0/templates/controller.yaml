{{- $authorizationConfigSecret := lookup "v1" "Secret" .Release.Namespace "karavi-authorization-config" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-controller
  namespace: {{ .Release.Namespace }}

---
# ClusterRole for Cluster-specific Permissions
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-controller
rules:
  - apiGroups: [ "" ]
    resources: [ "events" ]
    verbs: [ "list", "watch", "create", "update", "patch" ]
  - apiGroups: [""]
    resources: ["nodes"]
  {{- if hasKey .Values "podmon" }}
  {{- if eq .Values.podmon.enabled true }}
    verbs: ["get", "list", "watch", "patch"]
  {{- else }}
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- end }}
  - apiGroups: [ "" ]
    resources: [ "persistentvolumes" ]
    verbs: [ "get", "list", "watch", "create", "delete", "patch", "update" ]
  - apiGroups: [ "" ]
    resources: [ "persistentvolumeclaims" ]
    verbs: [ "get", "list", "watch", "update" ]
  - apiGroups: [ "storage.k8s.io" ]
    resources: [ "storageclasses" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "storage.k8s.io" ]
    resources: [ "volumeattributesclasses" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "storage.k8s.io" ]
    resources: [ "volumeattachments" ]
  {{- if hasKey .Values "podmon" }}
  {{- if eq .Values.podmon.enabled true }}
    verbs: ["get", "list", "watch", "patch", "delete"]
  {{- else }}
    verbs: ["get", "list", "watch", "patch"]
  {{- end }}
  {{- end }}
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshots/status"]
    verbs: ["get", "list"]
  # Permissions for volume group snapshots
  {{- $vgsnapshotEnabled := include "csi-powerstore.isVgsnapshotEnabled" . | eq "true" }}
  {{- if $vgsnapshotEnabled }}
  - apiGroups: ["groupsnapshot.storage.k8s.io"]
    resources: ["volumegroupsnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["groupsnapshot.storage.k8s.io"]
    resources: ["volumegroupsnapshotcontents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["groupsnapshot.storage.k8s.io"]
    resources: ["volumegroupsnapshotcontents/status"]
    verbs: ["update", "patch"]
  {{- end }}
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments/status"]
    verbs: ["patch"]
  - apiGroups: [ "" ]
    resources: [ "pods" ]
  {{- if hasKey .Values "podmon" }}
  {{- if .Values.podmon.enabled }}
    verbs: [ "get", "list", "watch", "delete" ]
  {{- else }}
    verbs: [ "get", "list", "watch" ]
  {{- end }}
  {{- end }}
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create", "list", "watch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  # below for resizer
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch"]
  # below for dell-csi-replicator
  {{- if hasKey .Values.controller "replication" }}
  {{- if eq .Values.controller.replication.enabled true}}
  - apiGroups: ["replication.storage.dell.com"]
    resources: ["dellcsireplicationgroups"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["replication.storage.dell.com"]
    resources: ["dellcsireplicationgroups/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]
  {{- end}}
  {{- end}}
  {{- if hasKey .Values.controller "csiAddonsReplication" }}
  {{- if eq .Values.controller.csiAddonsReplication.enabled true}}
  # below for csi-addons replication
  - apiGroups: ["replication.storage.openshift.io"]
    resources: ["volumegroupreplications", "volumegroupreplications/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["replication.storage.openshift.io"]
    resources: ["volumegroupreplicationcontents", "volumegroupreplicationcontents/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["csiaddons.openshift.io"]
    resources: ["csiaddonsnodes"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  {{- end}}
  {{- end}}
  # Permissions for CSIStorageCapacity
  {{- if eq (include "csi-powerstore.isStorageCapacitySupported" .) "true" }}
  - apiGroups: [ "storage.k8s.io" ]
    resources: [ "csistoragecapacities" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]
  {{- end }}
  - apiGroups: ["dr.storage.dell.com"]
    resources: ["volumejournals"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]
  {{- if eq (include "csi-powerstore.isMetricsEnabled" .) "true" }}
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  {{- end }}
---

kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-controller
  apiGroup: rbac.authorization.k8s.io

---

# Role for Driver-specific Permissions in a Namespace
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-controller
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
---
# RoleBinding for Driver-specific Role
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-controller
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-controller
  apiGroup: rbac.authorization.k8s.io
---

kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}-controller
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      name: {{ .Release.Name }}-controller
  {{- if lt (.Values.controller.controllerCount | toString | atoi ) 1 -}}
  {{- fail "value for .Values.controller.controllerCount should be atleast 1" }}
  {{- else }}
  replicas: {{ required "Must provide the number of controller instances to create." .Values.controller.controllerCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- /* calculate maxSurge and maxUnavailable to allow at least one controller to be available during upgrade */ -}}
      {{- $updateAllowance := max 1 (int (ceil (mulf .Values.controller.controllerCount 0.25))) }}
      maxSurge: {{ min 10 $updateAllowance }}
      maxUnavailable: {{ min 5 $updateAllowance }}
  {{- end }}
  template:
    metadata:
      labels:
        name: {{ .Release.Name }}-controller
      annotations:
        kubectl.kubernetes.io/default-container: driver
    spec:
      {{ if .Values.controller.nodeSelector }}
      nodeSelector:
      {{- toYaml .Values.controller.nodeSelector | nindent 8 }}
      {{ end }}
      {{ if .Values.controller.tolerations }}
      tolerations:
      {{- toYaml .Values.controller.tolerations | nindent 6 }}
      {{ end }}
      serviceAccountName: {{ .Release.Name }}-controller
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: "name"
                    operator: In
                    values:
                      - {{ .Release.Name }}-controller
              topologyKey: "kubernetes.io/hostname"
      containers:
        {{- if hasKey .Values "podmon" }}
        {{- if eq .Values.podmon.enabled true }}
        - name: podmon
          image: {{ required "Must provide the podmon container image." .Values.images.podmon.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            {{- toYaml .Values.podmon.controller.args | nindent 12 }}
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if and (hasKey .Values.podmon "metrics") .Values.podmon.metrics.enabled }}
            - name: X_CSI_METRICS_ENABLED
              value: "true"
            - name: X_CSI_METRICS_PORT
              value: "{{ .Values.podmon.metrics.port }}"
            - name: X_CSI_METRICS_COLLECTION_INTERVAL
              value: "{{ .Values.podmon.metrics.collection.interval }}"
            {{- if .Values.podmon.metrics.tlsCertSecret }}
            - name: X_CSI_METRICS_TLS_CERT_FILE
              value: /etc/metrics-tls/tls.crt
            - name: X_CSI_METRICS_TLS_KEY_FILE
              value: /etc/metrics-tls/tls.key
            {{- end }}
            {{- end }}
          {{- if and (hasKey .Values.podmon "metrics") .Values.podmon.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.podmon.metrics.port }}
              protocol: TCP
          {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
            - name: powerstore-config-params
              mountPath: /powerstore-config-params
            {{- if and (hasKey .Values.podmon "metrics") .Values.podmon.metrics.enabled .Values.podmon.metrics.tlsCertSecret }}
            - name: resiliency-metrics-tls
              mountPath: /etc/metrics-tls
              readOnly: true
            {{- end }}
        {{- end }}
        {{- end }}
        {{- if hasKey .Values "dev" }}
        {{ if .Values.dev.enableTracing }}{{- include "pstore.tracing" . | nindent 8 }}{{ end }}
        {{- end }}
        - name: attacher
          image: {{ required "Must provide the CSI attacher container image." .Values.images.attacher.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            - "--leader-election"
            - "--worker-threads=130"
            - "--resync=10s"
            - "--timeout=130s"
          env:
            - name: ADDRESS
              value: /var/run/csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
        {{- if hasKey .Values.controller "resizer" }}
        {{- if eq .Values.controller.resizer.enabled true }}
        - name: resizer
          image: {{ required "Must provide the CSI resizer container image." .Values.images.resizer.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            - "--leader-election"
            - "--feature-gates=VolumeAttributesClass=true"
          env:
            - name: ADDRESS
              value: /var/run/csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
        {{end}}
        {{end}}
        - name: provisioner
          image: {{ required "Must provide the CSI provisioner container image." .Values.images.provisioner.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "--csi-address=$(ADDRESS)"
            - "--volume-name-prefix={{ required "Must provide a value to prefix to driver created volume names" .Values.controller.volumeNamePrefix }}"
            - "--volume-name-uuid-length=10"
            - "--v=5"
            - "--timeout={{ .Values.controller.provisioner.timeout}}"
            - "--leader-election"
            - "--default-fstype={{ .Values.defaultFsType | default "ext4" }}"
            - "--extra-create-metadata"
            - "--feature-gates=Topology=true"
            - "--enable-capacity={{ (include "csi-powerstore.isStorageCapacitySupported" .) | default false }}"
            - "--capacity-ownerref-level=2"
            - "--capacity-poll-interval={{ .Values.storageCapacity.pollInterval | default "5m" }}"
          env:
            - name: ADDRESS
              value: /var/run/csi/csi.sock
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
        {{- if hasKey .Values.controller "snapshot" }}
        {{- if eq .Values.controller.snapshot.enabled true }}
        - name: snapshotter
          image: {{ required "Must provide the CSI snapshotter container image." .Values.images.snapshotter.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            - "--leader-election"
            - "--snapshot-name-prefix={{ required "Must provide a Snapshot Name Prefix" .Values.controller.snapshot.snapNamePrefix }}"
            - "--feature-gates=CSIVolumeGroupSnapshot={{ $vgsnapshotEnabled }}"
          env:
            - name: ADDRESS
              value: /var/run/csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
        {{end}}
        {{end}}
        {{- if hasKey .Values.controller "replication"}}
        {{- if eq .Values.controller.replication.enabled true}}
        - name: dell-csi-replicator
          image: {{ required "Must provide the Dell CSI Replicator image." .Values.images.replication.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "--csi-address=$(ADDRESS)"
            - "--leader-election=true"
            - "--worker-threads=2"
            - "--retry-interval-start=1s"
            - "--retry-interval-max=300s"
            - "--timeout=300s"
            - "--context-prefix={{ .Values.controller.replication.replicationContextPrefix}}"
            - "--prefix={{ .Values.controller.replication.replicationPrefix}}"
          env:
            - name: ADDRESS
              value: /var/run/csi/csi.sock
            - name: X_CSI_REPLICATION_CONFIG_DIR
              value: /powerstore-config-params
            - name: X_CSI_REPLICATION_CONFIG_FILE_NAME
              value: driver-config-params.yaml
{{- if and .Values.controller.replication.enabled (hasKey .Values.controller.replication "metrics") .Values.controller.replication.metrics.enabled }}
            - name: X_CSI_REPLICATION_METRICS_ENABLED
              value: "true"
            - name: X_CSI_REPLICATION_METRICS_PORT
              value: "{{ .Values.controller.replication.metrics.port | default 8445 }}"
            - name: X_CSI_REPLICATION_METRICS_COLLECTION_INTERVAL
              value: "{{ .Values.controller.replication.metrics.collection.interval | default "30s" }}"
{{- if .Values.controller.replication.metrics.tlsCertSecret }}
            - name: X_CSI_REPLICATION_METRICS_TLS_CERT_FILE
              value: /etc/replication-metrics-tls/tls.crt
            - name: X_CSI_REPLICATION_METRICS_TLS_KEY_FILE
              value: /etc/replication-metrics-tls/tls.key
{{- end }}
          ports:
            - name: repl-metrics
              containerPort: {{ .Values.controller.replication.metrics.port | default 8445 }}
              protocol: TCP
{{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
            - name: powerstore-config-params
              mountPath: /powerstore-config-params
{{- if and .Values.controller.replication.enabled (hasKey .Values.controller.replication "metrics") .Values.controller.replication.metrics.enabled .Values.controller.replication.metrics.tlsCertSecret }}
            - name: replication-metrics-tls
              mountPath: /etc/replication-metrics-tls
              readOnly: true
{{- end }}
        {{- end }}
        {{- end }}
        {{- if hasKey .Values.controller "healthMonitor" }}
        {{- if eq .Values.controller.healthMonitor.enabled true}}
        - name: csi-external-health-monitor-controller
          image: {{ required "Must provide the CSI external health monitor controller image." .Values.images.healthmonitor.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "--v=5"
            - "--csi-address=$(ADDRESS)"
            - "--leader-election"
            - "--http-endpoint=:{{ .Values.controller.healthMonitor.bindPort | default "8080" }}"
            - "--enable-node-watcher=true"
            - "--monitor-interval={{ .Values.controller.healthMonitor.interval | default "60s" }}"
            - "--timeout=180s"
          env:
            - name: ADDRESS
              value: /var/run/csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
        {{- end }}
        {{- end }}
        {{- if hasKey .Values.controller "csiAddonsReplication" }}
        {{- if eq .Values.controller.csiAddonsReplication.enabled true}}
        - name: csi-addons
          image: {{ required "Must provide the CSI Addons sidecar container image." .Values.images.csiAddons.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "--node-id=$(KUBE_NODE_NAME)"
            - "--v=5"
            - "--csi-addons-address=$(CSI_ADDONS_ENDPOINT)"
            - "--controller-port=9809"
            - "--pod=$(POD_NAME)"
            - "--namespace=$(POD_NAMESPACE)"
            - "--pod-uid=$(POD_UID)"
          env:
            - name: CSI_ADDONS_ENDPOINT
              value: /var/run/csi/csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
        {{- end }}
        {{- end }}
        - name: csi-metadata-retriever
          image: {{ required "Must provide the CSI Metadata retriever container image." .Values.images.metadataretriever.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [ "/csi-metadata-retriever" ]
          env:
            {{- if hasKey .Values "dev" }}
            - name: ENABLE_TRACING
              value: {{ .Values.dev.enableTracing | quote }}
            {{ if .Values.dev.enableTracing }}{{- include "pstore.tracingenvvars" . | nindent 12 }}{{ end }}
            {{- end }}
            - name: CSI_RETRIEVER_ENDPOINT
              value: /var/run/csi/csi_retriever.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
        - name: driver
          image: {{ required "Must provide the PowerStore driver image repository." .Values.images.driver.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [ "/csi-powerstore" ]
          env:
            {{- if hasKey .Values "dev" }}
            - name: ENABLE_TRACING
              value: {{ .Values.dev.enableTracing | quote }}
            {{ if .Values.dev.enableTracing }}{{- include "pstore.tracingenvvars" . | nindent 12 }}{{ end }}
            {{- end }}
            - name: CSI_ENDPOINT
              value: /var/run/csi/csi.sock
            - name: SSL_CERT_DIR
              value: /certs
            - name: CSI_RETRIEVER_ENDPOINT
              value: /var/run/csi/csi_retriever.sock
            - name: X_CSI_MODE
              value: controller
            - name: X_CSI_DRIVER_NAME
              value: {{ .Values.driverName }}
            - name: X_CSI_POWERSTORE_EXTERNAL_ACCESS
              value: {{ .Values.externalAccess }}
            - name: X_CSI_POWERSTORE_EXCLUSIVE_ACCESS
              value: "{{ .Values.exclusiveAccess }}"
            - name: X_CSI_POWERSTORE_NFS_AUTO_SELECT
              value: "{{ .Values.nfsAutoSelect }}"
            - name: X_CSI_NFS_ACLS
              value: "{{ .Values.nfsAcls }}"
            {{- if hasKey .Values "disasterRecovery" }}
            - name: X_CSM_DR_ENABLED
              value: "{{ .Values.disasterRecovery.enabled}}"
            - name: X_CSM_DR_BIND_PORT
              value: "{{ .Values.disasterRecovery.bindPort | default "8082" }}"
            {{- else }}
            - name: X_CSM_DR_ENABLED
              value: "true"
            - name: X_CSM_DR_BIND_PORT
              value: "8082"
            {{- end }}
            - name: X_CSI_POWERSTORE_CONFIG_PATH
              value: /powerstore-config/config
            - name: X_CSI_POWERSTORE_CONFIG_PARAMS_PATH
              value: /powerstore-config-params/driver-config-params.yaml
            - name: X_CSI_POWERSTORE_API_TIMEOUT
              value: {{ .Values.apiTimeout | default "120s" | quote }}
            - name: X_CSI_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: X_CSI_NFS_EXPORT_DIRECTORY
              value: {{ .Values.nfsExportDirectory | default "/var/lib/dell/nfs" }}
            - name: X_CSI_NFS_CLIENT_PORT
              value: "{{ .Values.nfsClientPort | default 2050 }}"
            - name: X_CSI_NFS_SERVER_PORT
              value: "{{ .Values.nfsServerPort | default 2049 }}"
            - name: X_CSI_MULTI_NAS_FAILURE_THRESHOLD
              value: "{{ .Values.multiNas.threshold | default 5 }}"
            - name: X_CSI_MULTI_NAS_COOLDOWN_PERIOD
              value: {{ .Values.multiNas.cooldownPeriod | default "5m" }}
            {{- if hasKey .Values "podmon" }}
            - name: X_CSI_PODMON_ENABLED
              value: "{{ .Values.podmon.enabled }}"
            {{- if eq .Values.podmon.enabled true }}
              {{- range $key, $value := .Values.podmon.controller.args }}
                {{- if contains "--arrayConnectivityPollRate" $value }}
            - name: X_CSI_PODMON_ARRAY_CONNECTIVITY_POLL_RATE
              value: "{{ (split "=" $value)._1 }}"
                {{- end }}
              {{- end }}
            {{- end }}
            {{- end }}
            - name: X_CSI_PODMON_API_PORT
              value: "{{ .Values.podmonAPIPort }}"
            {{- if .Values.podmonAPITokenSecret }}
            - name: X_CSI_PODMON_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.podmonAPITokenSecret.name }}
                  key: {{ .Values.podmonAPITokenSecret.key | default "podmon-api-token" }}
            {{- else if .Values.podmonAPIToken }}
            - name: X_CSI_PODMON_API_TOKEN
              value: "{{ .Values.podmonAPIToken }}"
            {{- end }}
            - name: X_CSI_PODMON_ARRAY_CONNECTIVITY_TIMEOUT
              value: {{ .Values.podmon.arrayConnectivityTimeout | default "10s" | quote}}
            {{- if hasKey .Values.controller "replication" }}
            {{- if eq .Values.controller.replication.enabled true}}
            - name: X_CSI_REPLICATION_CONTEXT_PREFIX
              value: {{ .Values.controller.replication.replicationContextPrefix | default "powerstore"}}
            - name: X_CSI_REPLICATION_PREFIX
              value: {{ .Values.controller.replication.replicationPrefix | default "replication.storage.dell.com"}}
            {{- end }}
            {{- end }}
            {{- if hasKey .Values.controller "healthMonitor" }}
            {{- if eq .Values.controller.healthMonitor.enabled true}}
            - name: X_CSI_HEALTH_MONITOR_ENABLED
              value: "{{ .Values.controller.healthMonitor.enabled }}"
            {{- end }}
            {{- end }}
            {{- if hasKey .Values.controller "csiAddonsReplication" }}
            - name: X_CSI_CSIADDONS_REPLICATION_ENABLED
              value: "{{ .Values.controller.csiAddonsReplication.enabled }}"
            {{- end }}
            {{- if hasKey .Values.disasterRecovery "monitor" }}
            - name: X_CSI_ALERT_MONITOR_ENABLED
              value: "{{ .Values.disasterRecovery.monitor.enabled | default true }}"
            - name: X_CSI_ALERT_MONITOR_POLL_INTERVAL
              value: "{{ .Values.disasterRecovery.monitor.pollInterval | default "5m" }}"
            {{- end }}
            - name: GOPOWERSTORE_DEBUG
              value: "true"
            - name: CSI_AUTO_ROUND_OFF_FILESYSTEM_SIZE
              value: "{{ .Values.allowAutoRoundOffFilesystemSize | default true }}"
            - name: X_CSI_DRIVER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if eq (include "csi-powerstore.isMetricsEnabled" .) "true" }}
            - name: X_CSI_METRICS_ENABLED
              value: "true"
            - name: X_CSI_METRICS_PORT
              value: "{{ .Values.metrics.port | default 8443 }}"
            - name: X_CSI_METRICS_COLLECTION_INTERVAL
              value: "{{ .Values.metrics.collection.interval | default "30s" }}"
            - name: X_CSI_METRICS_COLLECTION_CACHE_TTL
              value: "{{ .Values.metrics.collection.cacheTTL | default "25s" }}"
            - name: X_CSI_METRICS_ARRAY_RATE_LIMIT
              value: "{{ .Values.metrics.array.rateLimit | default 100 }}"
            - name: X_CSI_METRICS_ARRAY_TIMEOUT
              value: "{{ .Values.metrics.array.timeout | default "30s" }}"
            - name: X_CSI_METRICS_ARRAY_CB_THRESHOLD
              value: "{{ .Values.metrics.array.circuitBreaker.threshold | default 3 }}"
            - name: X_CSI_METRICS_ARRAY_CB_RESET_TIMEOUT
              value: "{{ .Values.metrics.array.circuitBreaker.resetTimeout | default "30s" }}"
            {{- if .Values.metrics.tlsCertSecret }}
            - name: X_CSI_METRICS_TLS_CERT_FILE
              value: "/etc/metrics-tls/tls.crt"
            - name: X_CSI_METRICS_TLS_KEY_FILE
              value: "/etc/metrics-tls/tls.key"
            {{- end }}
            {{- if hasKey .Values.metrics "leaderElection" }}
            - name: X_CSI_METRICS_LEADER_ELECTION_ENABLED
              value: "{{ .Values.metrics.leaderElection.enabled | default false }}"
            - name: X_CSI_METRICS_LEADER_ELECTION_LEASE_DURATION
              value: "{{ .Values.metrics.leaderElection.leaseDuration | default "60s" }}"
            - name: X_CSI_METRICS_LEADER_ELECTION_RENEW_DEADLINE
              value: "{{ .Values.metrics.leaderElection.renewDeadline | default "40s" }}"
            - name: X_CSI_METRICS_LEADER_ELECTION_RETRY_PERIOD
              value: "{{ .Values.metrics.leaderElection.retryPeriod | default "5s" }}"
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
            - name: powerstore-config
              mountPath: /powerstore-config
            - name: powerstore-config-params
              mountPath: /powerstore-config-params
            {{- if ge (int .Values.certSecretCount) 1 }}
            - name: certs
              mountPath: /certs
              readOnly: true
            {{- end }}
{{- if eq (include "csi-powerstore.isMetricsEnabled" .) "true" }}
{{- if .Values.metrics.tlsCertSecret }}
            - name: metrics-tls
              mountPath: /etc/metrics-tls
              readOnly: true
{{- end }}
{{- end }}
      {{- if hasKey .Values "authorization" }}
      {{- if eq .Values.authorization.enabled true }}
        - name: karavi-authorization-proxy
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          image: {{ required "Must provide the authorization sidecar container image." .Values.images.authorization.image | quote }}
          env:
            - name: PROXY_HOST
              value: "{{ .Values.authorization.proxyHost }}"
            - name: SKIP_CERTIFICATE_VALIDATION
              value: "{{ .Values.authorization.skipCertificateValidation }}"
            - name: PLUGIN_IDENTIFIER
              value: powerstore
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: proxy-authz-tokens
                  key: access
            - name: REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: proxy-authz-tokens
                  key: refresh
          volumeMounts:
            {{- if $authorizationConfigSecret }}
            - name: karavi-authorization-config
              mountPath: /etc/karavi-authorization/config
            {{- else }}
            - name: powerstore-config
              mountPath: /powerstore-config
            {{- end }}
            {{- if not .Values.authorization.skipCertificateValidation }}
            - name: proxy-server-root-certificate
              mountPath: /etc/karavi-authorization/root-certificates
            {{- end }}
            - name: powerstore-config-params
              mountPath: /etc/karavi-authorization
        {{ end }}
        {{ end }}
      volumes:
        # for authorization
        {{- if hasKey .Values "authorization" }}
        {{- if eq .Values.authorization.enabled true }}
        {{- if $authorizationConfigSecret }}
        - name: karavi-authorization-config
          secret:
            secretName: karavi-authorization-config
        {{- end }}
        {{- if not .Values.authorization.skipCertificateValidation }}
        - name: proxy-server-root-certificate
          secret:
            secretName: proxy-server-root-certificate
        {{- end }}
        {{ end }}
        {{ end }}
        - name: socket-dir
          emptyDir:
        - name: powerstore-config-params
          configMap:
            name: {{ .Release.Name }}-config-params
        - name: powerstore-config
          secret:
            secretName: {{ .Release.Name }}-config
{{- if ge (int .Values.certSecretCount) 1 }}
        - name: certs
          projected:
            sources:
{{- range $i, $e := until (int .Values.certSecretCount ) }}
              - secret:
                  name: {{ print $.Release.Name "-certs-" $e }}
                  items:
                    - key: cert-{{ $e }}
                      path: cert-{{ $e }}
{{- end }}
{{- end }}
{{- if eq (include "csi-powerstore.isMetricsEnabled" .) "true" }}
{{- if .Values.metrics.tlsCertSecret }}
        - name: metrics-tls
          secret:
            secretName: {{ .Values.metrics.tlsCertSecret }}
{{- end }}
{{- end }}
        {{- if and (hasKey .Values "podmon") .Values.podmon.enabled (hasKey .Values.podmon "metrics") .Values.podmon.metrics.enabled .Values.podmon.metrics.tlsCertSecret }}
        - name: resiliency-metrics-tls
          secret:
            secretName: {{ .Values.podmon.metrics.tlsCertSecret }}
{{- end }}
{{- if hasKey .Values.controller "replication" }}
{{- if and .Values.controller.replication.enabled (hasKey .Values.controller.replication "metrics") .Values.controller.replication.metrics.enabled .Values.controller.replication.metrics.tlsCertSecret }}
        - name: replication-metrics-tls
          secret:
            secretName: {{ .Values.controller.replication.metrics.tlsCertSecret }}
{{- end }}
{{- end }}
