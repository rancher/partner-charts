## K8S/DRIVER ATTRIBUTES
########################

# driverName: defines the name of driver
# Allowed values: string
# Default value: None
driverName: "csi-powerstore.dellemc.com"
# "version" is used to verify the values file matches driver version
# Not recommend to change
version: v2.18.0

# "images" defines every container images used for the driver and its sidecars.
#  To use your own images, or a private registry, change the values here.
images:
  # "driver" defines the container image, used for the driver container.
  driver:
    image: quay.io/dell/container-storage-modules/csi-powerstore:v2.18.0
  # CSI sidecars
  attacher:
    image: registry.k8s.io/sig-storage/csi-attacher:v4.13.0
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
  snapshotter:
    image: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0
  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
  healthmonitor:
    image: registry.k8s.io/sig-storage/csi-external-health-monitor-controller:v0.18.0

  # CSI Addons sidecar
  csiAddons:
    image: quay.io/csiaddons/k8s-sidecar:v0.15.0

  # CSM sidecars
  replication:
    image: quay.io/dell/container-storage-modules/dell-csi-replicator:v1.16.0
  podmon:
    image: quay.io/dell/container-storage-modules/podmon:v1.17.0
  metadataretriever:
    image: quay.io/dell/container-storage-modules/csi-metadata-retriever:v1.15.0
  authorization:
    image: quay.io/dell/container-storage-modules/csm-authorization-sidecar:v2.6.0

# Represents number of certificate secrets, which user is going to create for ssl authentication. (powerstore-cert-0..powerstore-cert-n)
# If user does not use certificate, set to 0
certSecretCount: 0

# Specify kubelet config dir path.
# Ensure that the config.yaml file is present at this path.
# Default value: /var/lib/kubelet
kubeletConfigDir: /var/lib/kubelet

# nodeFCPortsFilterFile: It is the name of the environment variable which store path to the file which
# provide list of WWPN which should be used by the driver for FC connection on this node
# If file not exist or empty or in invalid format, then the driver will use all available FC ports
# Allowed Values: string
# Default Value: None
# Example:
# content of the file:
#   21:00:00:29:ff:48:9f:6e,21:00:00:29:ff:48:9f:6e
nodeFCPortsFilterFile: /etc/fc-ports-filter

# externalAccess: allows to specify additional entries for hostAccess of NFS volumes. Both single IP address and subnet are valid entries.
# Allowed Values: x.x.x.x/xx, x.x.x.x, fd00::/64, <IPv6_ADDRESS>/128
# Default Value: None
externalAccess:

# exclusiveAccess: controls whether only externalAccess entries are added to the NFS export.
# If set to true → only IP/CIDR specified in externalAccess will be included (node IP excluded).
# If set to false (default) → both node IP and externalAccess entry will be added to the export.
# Allowed Values: true or false
# Default Value: false
exclusiveAccess: false

# nfsAutoSelect: enables NFS source IP auto-discovery via kernel routing query (ER-K8S-JA18622-001-powerstore-nfs-auto-selection).
# When enabled, the driver discovers which node IP can reach the NAS server's file interface
# and automatically adds it to the NFS export, eliminating the need for manual host configuration.
# When externalAccess is also set, both auto-discovered and external IPs are added to the export.
# When exclusiveAccess is true, nfsAutoSelect is ignored (exclusiveAccess takes precedence).
# Allowed Values: true or false
# Default Value: false
nfsAutoSelect: false

# imagePullPolicy: Policy to determine if the image should be pulled prior to starting the container.
# Allowed values:
#  Always: Always pull the image.
#  IfNotPresent: Only pull the image if it does not already exist on the node.
#  Never: Never pull the image.
# Default value: None
imagePullPolicy: IfNotPresent

# maxPowerstoreVolumesPerNode: Specify default value for maximum number of volumes that controller can publish to the node.
# If value is zero CO SHALL decide how many volumes of this type can be published by the controller to the node.
# This limit is applicable to all the nodes in the cluster for which node label 'max-powerstore-volumes-per-node' is not set.
# Allowed values: n, where n >= 0
# Default value: 0
maxPowerstoreVolumesPerNode: 0

# nfsAcls: enables setting permissions on NFS mount directory
# This value acts as default value for NFS ACL (nfsAcls), if not specified for an array config in secret
# Permissions can be specified in two formats:
#   1) Unix mode (NFSv3)
#   2) NFSv4 ACLs (NFSv4)
#      NFSv4 ACLs are supported on NFSv4 share only.
# Allowed values:
#   1) Unix mode: valid octal mode number
#      Examples: "0777", "777", "0755"
#   2) NFSv4 acls: valid NFSv4 acls, seperated by comma
#      Examples: "A::OWNER@:RWX,A::GROUP@:RWX", "A::OWNER@:rxtncy"
# Optional: true
# Default value: "0777"
nfsAcls: "0777"

# podmonAPIPort: Defines the port to be used within the kubernetes cluster
# Allowed values:
#   Any valid and free port.
# Default value: 8083
podmonAPIPort: 8083

# podmonAPIToken: Shared secret token for authenticating podmon API requests
# When set, the driver will require Bearer token authentication on /array-status endpoints
# Allowed values: Any string (recommend using a randomly generated token)
# Security note: podmon API is HTTP; use this token only on trusted cluster-internal networks.
# For production, use podmonAPITokenSecret to source this value from a Kubernetes Secret.
# Default value: "" (empty - authentication disabled for backward compatibility)
podmonAPIToken: ""

# podmonAPITokenSecret: Kubernetes Secret containing the podmon API token
# When set, the token will be sourced from the specified Secret instead of podmonAPIToken value
# Allowed values:
#   name: Secret name (required)
#   key: Secret key containing the token (required, default: "podmon-api-token")
# Example:
#   podmonAPITokenSecret:
#     name: my-podmon-secret
#     key: api-token
# Default value: null (use podmonAPIToken value instead)
podmonAPITokenSecret: null

# apiTimeout: Defines the timeout for PowerStore API calls in seconds
# Allowed values: Number followed by unit (s,m,h)
# Examples: 60s, 5m, 1h
# Default value: 120s
apiTimeout: "120s"

# fsCheck: configure automatic file system check before mount
fsCheck:
  # enabled: Enable/Disable automatic file system check before mount
  # Allowed values:
  #   true: enable file system check
  #   false: disable file system check
  # Default value: false
  enabled: false

  # mode: Controls the file system check mode
  # Allowed values: "checkOnly", "checkAndRepair"
  # Default value: "checkOnly"
  mode: "checkOnly"

# spaceReclamation: Settings for space reclamation (fstrim/blkdiscard)
# Reclaims unused storage blocks from Persistent Volumes.
# Allowed Values:
#   enabled: "true"/"false" - enable/disable space reclamation
#   schedule: cron expression for reclamation schedule
#   maxConcurrentVolumes: max number of concurrent reclamation operations per node
#   timeoutSeconds: timeout for each reclamation operation in seconds
# Default values shown below
spaceReclamation:
  enabled: false
  schedule: "0 2 * * 0"
  maxConcurrentVolumes: 2
  timeoutSeconds: 14400

# controller: configure controller specific parameters
controller:
  # controllerCount: defines the number of csi-powerstore controller pods to deploy to
  # the Kubernetes release.
  # Allowed values: n, where n > 0
  # Default value: None
  controllerCount: 2

  # volumeNamePrefix: defines a string prepended to each volume created by the CSI driver.
  # Allowed values: string
  # Default value: csivol
  # Examples: "k8s", "app1"
  volumeNamePrefix: csivol

  # vgsnapshot: allows to configure volumegroup snapshots
  # volumegroupsnapshot CRDs must be installed before installing driver
  volumeGroupSnapshot:
    # enabled: Enable/Disable native container orchestrator volume group snapshot capabilities
    # Allowed values:
    #   true: Enable volumegroup snapshot feature-gate on snapshotter sidecar
    #   false: Disable volumegroup snapshot feature-gate on snapshotter sidecar
    # Default value: false
    enabled: false

  # snapshot: allows to enable/disable snapshot feature
  # snapshot CRDs needs to be installed before enabling this feature
  snapshot:
    # enabled: Enable/Disable volume snapshot feature
    # Allowed values:
    #   true: enable volume snapshot feature(install snapshotter sidecar)
    #   false: disable volume snapshot feature(do not install snapshotter sidecar)
    # Default value: None
    enabled: true

    # snapNamePrefix: Prefix to apply to the names of a created snapshots
    # Allowed values: string
    # Default value: csi-snap
    # Examples: "snap", "snapshot"
    snapNamePrefix: csi-snap
  # provisioner: allows to provision volumes of CSI drivers
  # csi-provisioner is installed as a sidecar for CSI drivers
  provisioner:
    ## timeout: Defines the timeout for csi-provisoner sidecar in seconds
    # Allowed values: Number followed by unit (s)
    # Examples: 60s
    # Default value: 10s
    timeout: 10s
  # resizer: allows to enable/disable resizer feature
  resizer:
    # enabled: Enable/Disable volume expansion feature
    # Allowed values:
    #   true: enable volume expansion feature(install resizer sidecar)
    #   false: disable volume expansion feature(do not install resizer sidecar)
    # Default value: true
    enabled: true

  healthMonitor:
    # enabled: Enable/Disable health monitor of CSI volumes
    # Allowed values:
    #   true: enable checking of health condition of CSI volumes
    #   false: disable checking of health condition of CSI volumes
    # Default value: false
    enabled: false

    # interval: Interval of monitoring volume health condition
    # Allowed values: Number followed by unit (s,m,h)
    # Examples: 60s, 5m, 1h
    # Default value: 60s
    interval: 60s

    # bindPort: Defines the port for the Health Monitor service
    # Allowed values: Any valid and free port
    # Default value: 8080
    bindPort: 8080

  # replication: allows to configure replication
  # Replication CRDs must be installed before installing driver
  replication:
    # enabled: Enable/Disable replication feature
    # Allowed values:
    #   true: enable replication feature(install dell-csi-replicator sidecar)
    #   false: disable replication feature(do not install dell-csi-replicator sidecar)
    # Default value: false
    enabled: false

    # replicationContextPrefix: prefix to use for naming of resources created by replication feature
    # Allowed values: string
    # Default value: powerstore
    replicationContextPrefix: "powerstore"

    # replicationPrefix: prefix to prepend to storage classes parameters
    # Allowed values: string
    # Default value: replication.storage.dell.com
    replicationPrefix: "replication.storage.dell.com"

    # Metrics configuration for replication sidecar
    metrics:
      enabled: false
      port: 8445
      tlsCertSecret: ""
      collection:
        interval: 30s
      serviceMonitor:
        enabled: false
        interval: 30s
        scrapeTimeout: ""
        insecureSkipVerify: false

  # csiAddonsReplication: allows to configure CSI Addons replication
  # CSI Addons provides additional capabilities like volume group replication
  # CSI Addons CRDs (VolumeGroupReplication, VolumeReplicationClass) must be installed
  # before enabling this feature.
  csiAddonsReplication:
    # enabled: Enable/Disable CSI Addons replication feature
    # Allowed values:
    #   true: enable CSI Addons replication feature (install csi-addons sidecar)
    #   false: disable CSI Addons replication feature (do not install csi-addons sidecar)
    # Default value: false
    enabled: false

  # nodeSelector: Define node selection constraints for controller pods.
  # For the pod to be eligible to run on a node, the node must have each
  # of the indicated key-value pairs as labels.
  # Leave as blank to consider all nodes
  # Allowed values: map of key-value pairs
  # Default value: None
  nodeSelector:
  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/master taint
  #  node-role.kubernetes.io/master
  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
  #  node-role.kubernetes.io/control-plane

  # tolerations: Define tolerations for the controllers, if required.
  # Leave as blank to install controller on worker nodes
  # Default value: None
  tolerations:
  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/master taint
  # - key: "node-role.kubernetes.io/master"
  #   operator: "Exists"
  #   effect: "NoSchedule"
  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
  # tolerations:
  # - key: "node-role.kubernetes.io/control-plane"
  #   operator: "Exists"
  #   effect: "NoSchedule"

# node: configure node pod specific parameters
node:
  # nodeNamePrefix: defines a string prepended to each node registered by the CSI driver.
  # Allowed values: string
  # Default value: None
  nodeNamePrefix: csi-node

  # nodeIDPath: defines the path to file with node identifier (e.g. /etc/machine-id, /etc/hostname).
  # Allowed values: string
  # Default value: None
  nodeIDPath: /etc/machine-id

  # volumeDisconnectMaxRetries: Maximum number of retries for volume disconnect
  # Allowed values: Integer
  # Example: 5
  # Default value: 5
  volumeDisconnectMaxRetries: "5"

  # volumeDisconnectRetryInterval: Interval between retries for volume disconnect
  # Allowed values: Duration with unit (s, m, h)
  # Example: 5s, 1m
  # Default value: 5s
  volumeDisconnectRetryInterval: "5s"

  # volumeDisconnectTimeoutSeconds: Total timeout for volume disconnect operation
  # Allowed values: Duration with unit (s, m, h)
  # Example: 120s, 2m
  # Default value: 120s
  volumeDisconnectTimeoutSeconds: "120s"

  healthMonitor:
    # enabled: Enable/Disable health monitor of CSI volumes- volume usage, volume condition
    # Allowed values:
    #   true: enable checking of health condition of CSI volumes
    #   false: disable checking of health condition of CSI volumes
    # Default value: None
    enabled: false

  # nodeSelector: Define node selection constraints for node pods.
  # For the pod to be eligible to run on a node, the node must have each
  # of the indicated key-value pairs as labels.
  # Leave as blank to consider all nodes
  # Allowed values: map of key-value pairs
  # Default value: None
  nodeSelector:
  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/master taint
  #  node-role.kubernetes.io/master
  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
  #  node-role.kubernetes.io/control-plane

  # tolerations: Define tolerations for the node pods, if required.
  # Leave as blank to consider all worker nodes
  # Default value: None
  tolerations:
  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/master taint
  # - key: "node-role.kubernetes.io/master"
  #   operator: "Exists"
  #   effect: "NoSchedule"
  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
  # tolerations:
  # - key: "node-role.kubernetes.io/control-plane"
  #   operator: "Exists"
  #   effect: "NoSchedule"

  # Uncomment if CSM for Resiliency and CSI Driver pods monitor are enabled
  # tolerations:
  #  - key: "offline.vxflexos.storage.dell.com"
  #    operator: "Exists"
  #    effect: "NoSchedule"
  #  - key: "vxflexos.podmon.storage.dell.com"
  #    operator: "Exists"
  #    effect: "NoSchedule"
  #  - key: "offline.unity.storage.dell.com"
  #    operator: "Exists"
  #    effect: "NoSchedule"
  #  - key: "unity.podmon.storage.dell.com"
  #    operator: "Exists"
  #    effect: "NoSchedule"
  #  - key: "offline.isilon.storage.dell.com"
  #    operator: "Exists"
  #    effect: "NoSchedule"
  #  - key: "isilon.podmon.storage.dell.com"
  #    operator: "Exists"
  #    effect: "NoSchedule"
  #  - key: "offline.powerstore.storage.dell.com"
  #    operator: "Exists"
  #    effect: "NoSchedule"
  #  - key: "powerstore.podmon.storage.dell.com"
  #    operator: "Exists"
  #    effect: "NoSchedule"

## PLATFORM ATTRIBUTES
######################

# connection: allows to configure connection to storage array
connection:
  # connection.enableCHAP: allows to enable CHAP for iSCSI connections
  # CHAP password will be autogenerated by driver
  # Allowed values:
  #   true : enable CHAP
  #   false: disable CHAP
  # Default value: false
  enableCHAP: false

# CSI driver log level
# Allowed values: "error", "warn"/"warning", "info", "debug", "error"
# Default value: "info"
logLevel: "info"

# CSI driver log format
# Allowed values: "TEXT" or "JSON"
# Default value: "JSON"
logFormat: "JSON"

# Following modes are supported: None, File and ReadWriteOnceWithFSType
fsGroupPolicy: ReadWriteOnceWithFSType

# Allows the controller to round off filesystem to 3Gi which is the minimum supported value
allowAutoRoundOffFilesystemSize: true

# Storage Capacity Tracking
# Note: Capacity tracking is supported in kubernetes v1.24 and above, this feature will be automatically disabled in older versions.
storageCapacity:
  # enabled : Enable/Disable storage capacity tracking
  # Allowed values:
  #   true: enable storage capacity tracking
  #   false: disable storage capacity tracking
  # Default value: true
  enabled: true
  # pollInterval : Configure how often external-provisioner polls the driver to detect changed capacity
  # Allowed values: 1m,2m,3m,...,10m,...,60m etc
  # Default value: 5m
  pollInterval: 5m

# Enable this feature only after contact support for additional information
podmon:
  enabled: false
  controller:
    args:
      - "--csisock=unix:/var/run/csi/csi.sock"
      - "--labelvalue=csi-powerstore"
      - "--arrayConnectivityPollRate=60"
      - "--driverPath=csi-powerstore.dellemc.com"
      - "--mode=controller"
      - "--skipArrayConnectionValidation=false"
      - "--driver-config-params=/powerstore-config-params/driver-config-params.yaml"
      - "--driverPodLabelValue=dell-storage"
      - "--ignoreVolumelessPods=false"

  node:
    args:
      - "--csisock=unix:/var/lib/kubelet/plugins/csi-powerstore.dellemc.com/csi_sock"
      - "--labelvalue=csi-powerstore"
      - "--arrayConnectivityPollRate=60"
      - "--driverPath=csi-powerstore.dellemc.com"
      - "--mode=node"
      - "--leaderelection=false"
      - "--driver-config-params=/powerstore-config-params/driver-config-params.yaml"
      - "--driverPodLabelValue=dell-storage"
      - "--ignoreVolumelessPods=false"

  # Metrics configuration for podmon resiliency
  metrics:
    # enabled: Set to true to expose the metrics endpoint on the podmon containers.
    # Default value: false
    enabled: false
    # port: Port on which the metrics endpoint is exposed. Default for podmon: 8444.
    port: 8444
    # tlsCertSecret: Name of a Kubernetes TLS Secret (tls.crt / tls.key) used to serve metrics over HTTPS.
    # When set the operator mounts the secret and configures HTTPS automatically.
    # Leave unset to serve metrics over plain HTTP.
    tlsCertSecret: ""
    # collection: Controls metrics collection cadence inside the resiliency module.
    collection:
      interval: 30s
    # serviceMonitor: Creates a Prometheus Operator ServiceMonitor targeting the controller pods.
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: ""
      insecureSkipVerify: false
    # podMonitor: Creates a Prometheus Operator PodMonitor targeting the node pods.
    podMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: ""
      insecureSkipVerify: false
    # prometheusRule: Controls optional Prometheus Operator PrometheusRule creation for resiliency alerts.
    prometheusRule:
      # enabled: When true, a PrometheusRule CR is created for resiliency alerting rules.
      # Type: bool
      # Default: true
      # Effect: Requires the Prometheus Operator CRDs to be installed in the cluster.
      enabled: true
      # connectivitySuccessRatio: Minimum acceptable connectivity success ratio as percentage (0-100).
      # Used by RES-02 (CSMResiliencyConnectivityLost) alert threshold.
      # Type: integer
      # Default: 90 (alert fires when connectivity drops below 90%)
      connectivitySuccessRatio: 90

  # arrayConnectivityTimeout: Defines the timeout (in seconds) for podmon array connectivity timeout check
  # Allowed values: Number followed by unit (s,m,h)
  # Examples: 10s, 1m, 1h
  # Default value: 10s
  arrayConnectivityTimeout: "10s"

# Define multi NAS parameters
multiNas:
  # threshold: Number of consecutive FS creation failures after which a NAS is put into cooldown.
  # If a NAS is in cooldown, it will not be considered for new FS creation attempts for cooldownPeriod amount of time.
  # Allowed values: n, where n >= 0
  # Default value: 5
  threshold: 5
  # cooldownPeriod: Duration for which a NAS remains in cooldown once the threshold is reached.
  # During this period, the NAS will not be considered for new FS creation attempts.
  # Allowed values: Number followed by unit (s,m,h) e.g. 60s,1m,2m,3m,...,1h etc
  # Default value: 5m
  cooldownPeriod: 5m

# CSM module attributes
# authorization: enable csm-authorization for RBAC
# Deploy and configure authorization before installing driver
# Allowed values:
#   "true" - authorization is enabled
#   "false" - authorization is disabled
# Default value: "false"
authorization:
  enabled: false
  # proxyHost: hostname of the csm-authorization server
  # Default value: None
  proxyHost:
  # skipCertificateValidation: certificate validation of the csm-authorization server
  # Allowed Values:
  #   "true" - TLS certificate verification will be skipped
  #   "false" - TLS certificate will be verified
  # Default value: "true"
  skipCertificateValidation: true

# Enable installation of Custom Resource Definitions (CRDs) required for Disaster Recovery.
# This is necessary when using the PowerStore Metro feature.
# Set `enabled` to `true` to install the Disaster Recovery CRDs.
disasterRecovery:
  # Possible values:
  #   true  - Installs the Disaster Recovery CRDs.
  #   false - Does not install the Disaster Recovery CRDs.
  enabled: true
  # bindPort: Defines the port for the Disaster Recovery service
  # Allowed values: Any valid and free port
  # Default value: 8082
  bindPort: 8082
  # monitor: Configuration for the PowerStore alert monitor service
  monitor:
    # enabled: Enable or disable the alert monitor service
    # Allowed values: true, false
    # Default value: true
    enabled: true
    # pollInterval: How often the monitor polls for new alerts
    # Allowed values: Any valid Go duration string (e.g., "30s", "1m", "5m")
    # Default value: "5m"
    pollInterval: "5m"

# metrics: configuration for driver metrics and monitoring
metrics:
  # enabled: Enable/Disable the shared Prometheus metrics HTTP server.
  # Type: bool
  # Default: false
  # Effect: When true, the controller Deployment receives X_CSI_METRICS_ENABLED=true,
  #         X_CSI_METRICS_PORT, and a metrics Service is created.
  enabled: false

  # port: Port on which the shared driver metrics endpoint is exposed.
  # Type: integer
  # Default: 8443
  # Effect: Passed as X_CSI_METRICS_PORT to the driver container; used as targetPort in the Service.
  port: 8443

  # tlsCertSecret: Name of a Kubernetes TLS Secret whose "tls.crt" and "tls.key" entries
  # are used to serve the metrics endpoint over HTTPS instead of plain HTTP.
  # Leave empty (the default) to use plain HTTP.
  # Type: string
  # Default: "" (disabled - plain HTTP)
  tlsCertSecret: ""

  # leaderElection: Configure leader election for array-level metrics collection.
  # Only the leader controller will collect array-level metrics to avoid duplicate API calls.
  leaderElection:
    # enabled: When true, leader election is enabled for the metrics server.
    # Type: bool
    # Default: false
    enabled: false
    # leaseDuration: Duration in seconds that the current leader will hold the lease.
    # Type: string (Prometheus duration, e.g. "15s", "30s")
    # Default: "60s"
    leaseDuration: "60s"
    # renewDeadline: Duration in seconds that the leader will attempt to renew the lease.
    # Type: string (Prometheus duration, e.g. "10s", "20s")
    # Default: "40s"
    renewDeadline: "40s"
    # retryPeriod: Duration in seconds that the leader will wait before attempting to acquire the lease.
    # Type: string (Prometheus duration, e.g. "5s", "10s")
    # Default: "5s"
    retryPeriod: "5s"

  # serviceMonitor: Controls optional Prometheus Operator ServiceMonitor creation.
  serviceMonitor:
    # enabled: When true, a ServiceMonitor CR is created for automatic Prometheus Operator integration.
    # Type: bool
    # Default: false
    # Effect: Requires the Prometheus Operator CRDs to be installed in the cluster.
    enabled: false
    # interval: Prometheus scrape interval for the metrics endpoint.
    # Type: string (Prometheus duration, e.g. "30s", "1m")
    # Default: "30s"
    interval: "30s"
    # scrapeTimeout: Prometheus scrape timeout for the metrics endpoint.
    # Type: string (Prometheus duration, e.g. "10s")
    # Default: "" (unset)
    scrapeTimeout: ""
    # insecureSkipVerify: Controls TLS certificate verification when scraping metrics.
    # Only used when metrics.tlsCertSecret is set (HTTPS endpoint).
    # Type: bool
    # Default: false
    insecureSkipVerify: false

  # prometheusRule: Controls optional Prometheus Operator PrometheusRule creation
  # and configurable alert thresholds.
  prometheusRule:
    # enabled: When true, a PrometheusRule CR is created for alerting rules.
    # Type: bool
    # Default: true (auto-deploys when metrics.enabled is true; requires Prometheus Operator CRDs)
    # Effect: Requires the Prometheus Operator CRDs to be installed in the cluster.
    #         Auto-deploys when metrics.enabled is true. Set to false to disable bundled alerts.
    enabled: true
    # applianceWarningThreshold: Appliance utilization percent (0-100) that triggers a warning alert.
    # Type: integer
    # Default: 80 (80%)
    applianceWarningThreshold: 80
    # applianceCriticalThreshold: Appliance utilization percent (0-100) that triggers a critical alert.
    # Type: integer
    # Default: 90 (90%)
    applianceCriticalThreshold: 90
    # apiErrorRateThreshold: API error rate percent (0-100) above which a warning alert fires.
    # Type: integer
    # Default: 10 (10%)
    apiErrorRateThreshold: 10
    # apiErrorRateWindow: Prometheus range duration for rate() calculations (P4.PST.13).
    # Type: string (Prometheus duration, e.g. "5m", "10m")
    # Default: "5m"
    apiErrorRateWindow: "5m"
    # cpuWarningThreshold: CPU usage percent (0-100) that triggers a warning alert.
    # Matches the dell_csi_driver_cpu_usage_percent metric which is already 0-100 scale.
    # Type: integer
    # Default: 80 (80%)
    cpuWarningThreshold: 80
    # memoryWarningThreshold: Memory usage in bytes above which a warning alert fires.
    # Type: integer
    # Default: 2147483648 (2 GiB)
    memoryWarningThreshold: 2147483648
    # driverCrashLoopWindow: Prometheus range duration for delta() restart count alert (P4.PST.10).
    # Type: string (Prometheus duration, e.g. "15m", "10m")
    # Default: "15m"
    driverCrashLoopWindow: "15m"
    # driverCrashLoopRestartThreshold: Number of driver restarts within driverCrashLoopWindow that triggers a warning alert.
    # Type: integer
    # Default: 3
    driverCrashLoopRestartThreshold: 3
    # volumeOperationFailureThreshold: Minimum number of volume operation failures in the 5-minute window
    # that triggers a warning alert (PST-01 to PST-08). Set to 0 to fire on any failure.
    # Type: integer
    # Default: 3
    volumeOperationFailureThreshold: 3

  # podMonitor: Controls optional Prometheus Operator PodMonitor creation for node DaemonSet pods.
  podMonitor:
    # enabled: When true, a PodMonitor CR is created for scraping metrics from node pods.
    # Type: bool
    # Default: false
    # Effect: Requires the Prometheus Operator CRDs to be installed in the cluster.
    enabled: false
    # interval: Prometheus scrape interval for the node metrics endpoint.
    # Type: string (Prometheus duration, e.g. "30s", "1m")
    # Default: "30s"
    interval: "30s"
    # scrapeTimeout: Prometheus scrape timeout for the node metrics endpoint.
    # Type: string (Prometheus duration, e.g. "10s")
    # Default: "" (unset)
    scrapeTimeout: ""
    # insecureSkipVerify: Controls TLS certificate verification when scraping node metrics.
    # Only used when metrics.tlsCertSecret is set (HTTPS endpoint).
    # Type: bool
    # Default: false
    insecureSkipVerify: false

  # collection: Controls how frequently metrics are collected.
  collection:
    # interval: How often the driver collects metrics from the array.
    # Type: string (duration, e.g. "30s", "1m")
    interval: "30s"
    # cacheTTL: How long collected values are cached before re-querying the array.
    # Type: string (duration, e.g. "25s")
    cacheTTL: "25s"

  # array: Array-specific collector tuning.
  array:
    # rateLimit: Maximum array API requests per second.
    # Type: integer
    rateLimit: 100
    # timeout: Per-request timeout for array API calls.
    # Type: string (duration)
    timeout: "30s"
    # circuitBreaker: Circuit-breaker settings for array API calls.
    circuitBreaker:
      # threshold: Number of consecutive failures before the circuit opens.
      threshold: 3
      # resetTimeout: How long the circuit stays open before allowing a retry.
      resetTimeout: "30s"
