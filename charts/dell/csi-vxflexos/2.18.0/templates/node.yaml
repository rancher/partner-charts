{{- $authorizationConfigSecret := lookup "v1" "Secret" .Release.Namespace "karavi-authorization-config" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-node
  namespace: {{ .Release.Namespace }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-node
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["security.openshift.io"]
    resourceNames: ["privileged"]
    resources: ["securitycontextconstraints"]
    verbs: ["use"]
{{- if hasKey .Values "podmon" }}
{{- if eq .Values.podmon.enabled true }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
{{ end }}
{{ end }}
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-node
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-node
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-node
  apiGroup: rbac.authorization.k8s.io
---
# RoleBinding for Driver-specific Role
{{- if hasKey .Values "podmon" }}
{{- if eq .Values.podmon.enabled true }}
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-node
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-node
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-node
  apiGroup: rbac.authorization.k8s.io
---
# Role for Driver-specific Permissions in a Namespace
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-node
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [ "coordination.k8s.io" ]
    resources: [ "leases" ]
    verbs: [ "get", "watch", "list", "delete", "update", "create" ]
{{ end }}
{{ end }}
---

kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}-node
  namespace: {{ .Release.Namespace }}
  {{- if hasKey .Values "authorization" }}
  {{- if eq .Values.authorization.enabled true }}
  annotations:
    com.dell.karavi-authorization-proxy: "true"
  {{ end }}
  {{ end }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-node
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-node
{{- if eq .Values.podmon.enabled true }}
        driver.dellemc.com: dell-storage
{{- end }}
      annotations:
        kubectl.kubernetes.io/default-container: "driver"
    spec:
      {{- if .Values.node.nodeSelector }}
      nodeSelector:
      {{- toYaml .Values.node.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.node.tolerations }}
      tolerations:
      {{- toYaml .Values.node.tolerations | nindent 6 }}
      {{- end }}
      serviceAccount: {{ .Release.Name }}-node
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      {{- if and .Values.monitor.enabled .Values.monitor.hostPID }}
      hostPID: true
      {{- else }}
      hostPID: false
      {{- end }}
      containers:
{{- if hasKey .Values "podmon" }}
{{- if eq .Values.podmon.enabled true }}
        - name: podmon
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          image: {{ required "Must provide the podmon container image." .Values.images.podmon.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            {{- toYaml .Values.podmon.node.args | nindent 12 }}
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: X_CSI_PRIVATE_MOUNT_DIR
              value: "{{ .Values.kubeletConfigDir }}/plugins/vxflexos.emc.dell.com/disks"
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: X_CSI_METRICS_ENABLED
              value: {{ include "csi-vxflexos.isResiliencyMetricsEnabled" . | quote }}
            - name: X_CSI_METRICS_PORT
              value: "{{ .Values.podmon.metrics.port }}"
            - name: X_CSI_METRICS_COLLECTION_INTERVAL
              value: "{{ .Values.podmon.metrics.collection.interval }}"
            {{- if eq (include "csi-vxflexos.isResiliencyMetricsTLSEnabled" .) "true" }}
            - name: X_CSI_METRICS_TLS_CERT_FILE
              value: /etc/metrics-tls/tls.crt
            - name: X_CSI_METRICS_TLS_KEY_FILE
              value: /etc/metrics-tls/tls.key
            {{- else }}
            - name: X_CSI_METRICS_TLS_CERT_FILE
              value: ""
            - name: X_CSI_METRICS_TLS_KEY_FILE
              value: ""
            {{- end }}
          {{- if eq (include "csi-vxflexos.isResiliencyMetricsEnabled" .) "true" }}
          ports:
            - name: resiliency-metrics
              containerPort: {{ .Values.podmon.metrics.port }}
              protocol: TCP
          {{- end }}
          volumeMounts:
            - name: kubelet-pods
              mountPath: {{ .Values.kubeletConfigDir }}/pods
              mountPropagation: "Bidirectional"
            - name: driver-path
              mountPath: {{ .Values.kubeletConfigDir }}/plugins/vxflexos.emc.dell.com
              mountPropagation: "Bidirectional"
            - name: usr-bin
              mountPath: /usr-bin
            - name: var-run
              mountPath: /var/run
            - name: vxflexos-config-params
              mountPath: /vxflexos-config-params
            {{- if eq (include "csi-vxflexos.isResiliencyMetricsTLSEnabled" .) "true" }}
            - name: resiliency-metrics-tls
              mountPath: /etc/metrics-tls
              readOnly: true
            {{- end }}
{{- end }}
{{- end }}
{{- if hasKey .Values "authorization" }}
{{- if eq .Values.authorization.enabled true }}
        - name: karavi-authorization-proxy
          image: {{ required "Must provide the authorization sidecar container image." .Values.images.authorization.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: PROXY_HOST
              value: "{{ .Values.authorization.proxyHost }}"
            - name: SKIP_CERTIFICATE_VALIDATION
              value: "{{ .Values.authorization.skipCertificateValidation }}"
            - name: PLUGIN_IDENTIFIER
              value: powerflex
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: proxy-authz-tokens
                  key: access
            - name: REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: proxy-authz-tokens
                  key: refresh
          volumeMounts:
            {{- if $authorizationConfigSecret }}
            - name: karavi-authorization-config
              mountPath: /etc/karavi-authorization/config
            {{- else }}
            - name: vxflexos-config
              mountPath: /vxflexos-config
            {{- end }}
            {{- if not .Values.authorization.skipCertificateValidation }}
            - name: proxy-server-root-certificate
              mountPath: /etc/karavi-authorization/root-certificates
            {{- end }}
            - name: vxflexos-config-params
              mountPath: /etc/karavi-authorization
{{ end }}
{{ end }}
        - name: driver
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              add: ["SYS_ADMIN"]
          image: "{{ required "Must provide the driver image repository." .Values.images.driver.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [ "/csi-vxflexos.sh" ]
          args:
            - "--array-config=/vxflexos-config/config"
            - "--driver-config-params=/vxflexos-config-params/driver-config-params.yaml"
          env:
            - name: CSI_ENDPOINT
              value: unix://{{ .Values.kubeletConfigDir }}/plugins/vxflexos.emc.dell.com/csi_sock
            - name: X_CSI_MODE
              value: node
            - name: X_CSI_PRIVATE_MOUNT_DIR
              value: "{{ .Values.kubeletConfigDir }}/plugins/vxflexos.emc.dell.com/disks"
            - name: X_CSI_ALLOW_RWO_MULTI_POD_ACCESS
              value: "{{ required "Must provide a true/false string to allow RWO multi pod access." .Values.allowRWOMultiPodAccess }}"
            - name: X_CSI_MAX_VOLUMES_PER_NODE
              value: "{{ .Values.maxVxflexosVolumesPerNode }}"
            - name: SSL_CERT_DIR
              value: /certs
            - name: X_CSI_POWERFLEX_NODE_CHROOT_PATH
              value: /noderoot
            - name: X_CSI_DRIVER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: X_CSI_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if hasKey .Values.node "healthMonitor" }}
            - name: X_CSI_HEALTH_MONITOR_ENABLED
              value: "{{ .Values.node.healthMonitor.enabled }}"
            {{- end }}
            {{- if hasKey .Values.node "approveSDC" }}
            - name: X_CSI_APPROVE_SDC_ENABLED
              value: "{{ .Values.node.approveSDC.enabled }}"
            {{- end }}
            {{- if hasKey .Values.node "renameSDC" }}
            - name: X_CSI_RENAME_SDC_ENABLED
              value: "{{ .Values.node.renameSDC.enabled }}"
            {{- if eq .Values.node.renameSDC.enabled true }}
            - name: X_CSI_RENAME_SDC_PREFIX
              value: "{{ .Values.node.renameSDC.prefix }}"
            {{- end }}
            {{- end }}
            {{- if hasKey .Values.node "trimSDCName" }}
            - name: X_CSI_TRIM_SDC_NAME_ENABLED
              value: "{{ .Values.node.trimSDCName.enabled }}"
            {{- end }}
            - name: X_CSI_POWERFLEX_KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: RELEASE_NAME
              value: {{ .Release.Name }}
            - name: X_CSI_PROBE_TIMEOUT
              value: {{ .Values.probeTimeout | default "10s"}}
            - name: X_CSI_AUTH_TYPE
              value: {{.Values.authType | default ""}}
            {{- if hasKey .Values "fsCheck" }}
            - name: X_CSI_FS_CHECK_ENABLED
              value: "{{ .Values.fsCheck.enabled }}"
            - name: X_CSI_FS_CHECK_MODE
              value: "{{ .Values.fsCheck.mode }}"
            {{- end }}
            {{- if hasKey .Values "spaceReclamation" }}
            - name: X_CSI_SPACE_RECLAMATION_ENABLED
              value: "{{ .Values.spaceReclamation.enabled }}"
            - name: X_CSI_SPACE_RECLAMATION_SCHEDULE
              value: "{{ .Values.spaceReclamation.schedule }}"
            - name: X_CSI_SPACE_RECLAMATION_MAX_CONCURRENT
              value: "{{ .Values.spaceReclamation.maxConcurrentVolumes }}"
            - name: X_CSI_SPACE_RECLAMATION_TIMEOUT
              value: "{{ .Values.spaceReclamation.timeoutSeconds }}"
            {{- end }}
            {{- if hasKey .Values "podmon" }}
            - name: X_CSI_PODMON_ENABLED
              value: "{{ .Values.podmon.enabled }}"
            {{- if eq .Values.podmon.enabled true }}
              {{- range $key, $value := .Values.podmon.node.args }}
                {{- if contains "--arrayConnectivityPollRate" $value }}
            - name: X_CSI_PODMON_ARRAY_CONNECTIVITY_POLL_RATE
              value: "{{ (split "=" $value)._1 }}"
                {{- end }}
              {{- end }}
            {{- end }}
            {{- end }}
            - name: X_CSI_PODMON_API_PORT
              value: "{{ .Values.podmonAPIPort }}"
            {{- if .Values.podmonAPITokenSecret }}
            - name: X_CSI_PODMON_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.podmonAPITokenSecret.name }}
                  key: {{ .Values.podmonAPITokenSecret.key | default "podmon-api-token" }}
            {{- else if .Values.podmonAPIToken }}
            - name: X_CSI_PODMON_API_TOKEN
              value: "{{ .Values.podmonAPIToken }}"
            {{- end }}
            {{- if eq (include "csi-vxflexos.isMetricsEnabled" .) "true" }}
            - name: X_CSI_METRICS_ENABLED
              value: "true"
            - name: X_CSI_METRICS_PORT
              value: "{{ .Values.metrics.port | default 9090 }}"
            {{- if .Values.metrics.tlsCertSecret }}
            - name: X_CSI_METRICS_TLS_CERT_FILE
              value: "/etc/metrics-tls/tls.crt"
            - name: X_CSI_METRICS_TLS_KEY_FILE
              value: "/etc/metrics-tls/tls.key"
            {{- end }}
            {{- if hasKey .Values.metrics "collection" }}
            - name: X_CSI_METRICS_COLLECTION_INTERVAL
              value: "{{ .Values.metrics.collection.interval | default "30s" }}"
            - name: X_CSI_METRICS_COLLECTION_CACHE_TTL
              value: "{{ .Values.metrics.collection.cacheTTL | default "25s" }}"
            {{- end }}
            {{- if hasKey .Values.metrics "array" }}
            - name: X_CSI_METRICS_ARRAY_TIMEOUT
              value: "{{ .Values.metrics.array.timeout | default "30s" }}"
            - name: X_CSI_METRICS_ARRAY_RATE_LIMIT
              value: "{{ .Values.metrics.array.rateLimit | default 100 }}"
            - name: X_CSI_METRICS_ARRAY_CB_THRESHOLD
              value: "{{ .Values.metrics.array.circuitBreaker.threshold | default 3 }}"
            - name: X_CSI_METRICS_ARRAY_CB_RESET_TIMEOUT
              value: "{{ .Values.metrics.array.circuitBreaker.resetTimeout | default "30s" }}"
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: driver-path
              mountPath: {{ .Values.kubeletConfigDir }}/plugins/vxflexos.emc.dell.com
              mountPropagation: "Bidirectional"
            - name: pods-path
              mountPath: {{ .Values.kubeletConfigDir }}/pods
              mountPropagation: "Bidirectional"
            - name: csi-path
              mountPath: {{ .Values.kubeletConfigDir }}/plugins/kubernetes.io/csi
              mountPropagation: "Bidirectional"
            - name: scaleio-path-opt
              mountPath: {{ .Values.node.sdc.sdcHostDrvCfgPath }}
              readOnly: true
            - name: vxflexos-config
              mountPath: /vxflexos-config
            - name: vxflexos-config-params
              mountPath: /vxflexos-config-params
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
            - name: run-udev
              mountPath: /run/udev
            # sbin trees (mount whole sbin so other admin tools are available)
            - name: sbin
              mountPath: /noderoot/sbin
              readOnly: true
            - name: usrsbin
              mountPath: /noderoot/usr/sbin
              readOnly: true
            # host glibc + libs (so chroot uses host loader + libraries)
            - name: lib64
              mountPath: /noderoot/lib64
              readOnly: true
            - name: usrlib64
              mountPath: /noderoot/usr/lib64
              readOnly: true
            # kernel interfaces and device nodes
            - name: dev
              mountPath: /noderoot/dev
            - name: sys
              mountPath: /noderoot/sys
            - name: proc
              mountPath: /noderoot/proc
            - name: run-udev
              mountPath: /noderoot/run/udev
            # nvme nqn
            - name: hostnqn
              mountPath: /noderoot/etc/nvme
              readOnly: true
{{- if ge (int .Values.certSecretCount) 1 }}
            - name: certs
              mountPath: /certs
              readOnly: true
{{- end}}
{{- if eq (include "csi-vxflexos.isMetricsEnabled" .) "true" }}
{{- if .Values.metrics.tlsCertSecret }}
            - name: metrics-tls
              mountPath: /etc/metrics-tls
              readOnly: true
{{- end }}
{{- end }}
        - name: registrar
          image: {{ required "Must provide the CSI registrar container image." .Values.images.registrar.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "--v=5"
            - "--csi-address=$(ADDRESS)"
            - --kubelet-registration-path={{ .Values.kubeletConfigDir }}/plugins/vxflexos.emc.dell.com/csi_sock
          env:
            - name: ADDRESS
              value: /csi/csi_sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: registration-dir
              mountPath: /registration
            - name: driver-path
              mountPath: /csi
        {{- if eq .Values.monitor.enabled true }}
        - name: sdc-monitor
          securityContext:
            privileged: true
          image: {{ required "Must provide the PowerFlex SDC container image." .Values.images.powerflexSdc.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            {{ if eq .Values.monitor.hostPID true }}
            - name: HOST_PID
              value: "1"
            {{ else }}
            - name: HOST_PID
              value: "0"
            {{ end }}
            - name: HOST_NET
              value: "1"
            - name: NODENAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MODE
              value: "monitoring"
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: os-release
              mountPath: /host-os-release
            - name: sdc-storage
              mountPath: /storage
            - name: udev-d
              mountPath: /rules.d
            - name: host-opt-emc-path
              mountPath: /host_opt_emc_path
        {{- end }}
      {{- if or (not (hasKey (.Values.node.sdc) "enabled")) (eq .Values.node.sdc.enabled true) }}
      initContainers:
        - name: mdm-container
          image: "{{ required "Must provide the driver image repository." .Values.images.driver.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/csi-vxflexos.sh"]
          args:
            - "--array-config=/vxflexos-config/config"
            - "--driver-config-params=/vxflexos-config-params/driver-config-params.yaml"
          env:
            - name: X_CSI_MODE
              value: mdm-info
            - name: NODENAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: vxflexos-config
              mountPath: /vxflexos-config
            - name: vxflexos-config-params
              mountPath: /vxflexos-config-params
            - name: mdm-dir
              mountPath: /data
{{- if ge (int .Values.certSecretCount) 1 }}
            - name: certs
              mountPath: /certs
              readOnly: true
{{- end }}
        - name: sdc
          securityContext:
            privileged: true
          image: {{ required "Must provide the PowerFlex SDC container image." .Values.images.powerflexSdc.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            - "/bin/sh"
            - "-c"
            - |
              set -e
              if [ ! -f /data/node_mdms.txt ]; then
                echo "ERROR: /data/node_mdms.txt not generated" >&2
                exit 1
              fi
              set -a
              source /data/node_mdms.txt
              set +a
              /files/scripts/init.sh
          env:
            {{- if eq .Values.node.sdc.sdcSFTPRepo.enabled true }}
            - name: REPO_ADDRESS
              value: "{{ .Values.node.sdc.sdcSFTPRepo.sdcSFTPRepoAddress }}"
            - name: REPO_USER
              value: "{{ .Values.node.sdc.sdcSFTPRepo.sdcSFTPRepoUser }}"
            {{- end }}
            - name: MODULE_SIGCHECK
              value: "0"
            - name: NODENAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MODE
              value: "config"
            - name: HOST_DRV_CFG_PATH
              value: {{ .Values.node.sdc.sdcHostDrvCfgPath }}
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: os-release
              mountPath: /host-os-release
            - name: host-opt-emc-path
              mountPath: /host_opt_emc_path
            - name: sdc-storage
              mountPath: /storage
            - name: udev-d
              mountPath: /rules.d
            - name: scaleio-path-opt
              mountPath: /host_drv_cfg_path
            - name: mdm-dir
              mountPath: /data
            {{- if eq .Values.node.sdc.sdcSFTPRepo.enabled true }}
            - name: sftp-keys
              mountPath: /config/
            {{- end }}
      {{- end }}
      volumes:
        - name: registration-dir
          hostPath:
            path: {{ .Values.kubeletConfigDir }}/plugins_registry/
            type: DirectoryOrCreate
        - name: driver-path
          hostPath:
            path: {{ .Values.kubeletConfigDir }}/plugins/vxflexos.emc.dell.com
            type: DirectoryOrCreate
        - name: volumedevices-path
          hostPath:
            path: {{ .Values.kubeletConfigDir }}/plugins/kubernetes.io/csi/volumeDevices
            type: DirectoryOrCreate
        - name: pods-path
          hostPath:
            path: {{ .Values.kubeletConfigDir }}/pods
            type: Directory
        - name: csi-path
          hostPath:
            path: {{ .Values.kubeletConfigDir }}/plugins/kubernetes.io/csi
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: run-udev
          hostPath:
            path: /run/udev
            type: DirectoryOrCreate
        - name: sbin
          hostPath:
            path: /sbin
            type: Directory
        - name: usrsbin
          hostPath:
            path: /usr/sbin
            type: Directory
        - name: lib64
          hostPath:
            path: /lib64
            type: Directory
        - name: usrlib64
          hostPath:
            path: /usr/lib64
            type: Directory
        - name: hostnqn
          hostPath:
            path: /etc/nvme
            type: DirectoryOrCreate
        - name: scaleio-path-opt
          hostPath:
            path: {{ .Values.node.sdc.sdcHostDrvCfgPath }}
            type: DirectoryOrCreate
        {{- if eq .Values.node.sdc.sdcSFTPRepo.enabled true }}
        - name: sftp-keys
          projected:
            defaultMode: 384
            sources:
            - secret:
                name: "{{ .Values.node.sdc.sdcSFTPRepo.sdcSFTPRepoPrivateSecret }}"
            - secret:
                name: "{{ .Values.node.sdc.sdcSFTPRepo.sdcSFTPRepoPublicSecret }}"
        {{- end }}
        - name: sdc-storage
          hostPath:
            path: /var/emc-scaleio
            type: DirectoryOrCreate
        - name: udev-d
          hostPath:
            path: /etc/udev/rules.d
            type: Directory
        - name: os-release
          hostPath:
            path: /etc/os-release
            type: File
        - name: host-opt-emc-path
          hostPath:
            path: /opt/emc
            type: DirectoryOrCreate
        - name: mdm-dir
          emptyDir: {}
        - name: vxflexos-config
          secret:
            secretName: {{ .Release.Name }}-config
        - name: vxflexos-config-params
          configMap:
            name: {{ .Release.Name }}-config-params
{{- if ge (int .Values.certSecretCount) 1 }}
        - name: certs
          projected:
            sources:
{{- range $i, $e := until (int .Values.certSecretCount ) }}
              - secret:
                  name: {{ print $.Release.Name "-certs-" $e }}
                  items:
                    - key: cert-{{ $e }}
                      path: cert-{{ $e }}
{{- end }}
{{- end }}
{{- if eq (include "csi-vxflexos.isMetricsEnabled" .) "true" }}
{{- if .Values.metrics.tlsCertSecret }}
        - name: metrics-tls
          secret:
            secretName: {{ .Values.metrics.tlsCertSecret }}
{{- end }}
{{- end }}
{{- if eq (include "csi-vxflexos.isResiliencyMetricsEnabled" .) "true" }}
{{- if eq (include "csi-vxflexos.isResiliencyMetricsTLSEnabled" .) "true" }}
        - name: resiliency-metrics-tls
          secret:
            secretName: {{ .Values.podmon.metrics.tlsCertSecret }}
{{- end }}
{{- end }}
{{- if hasKey .Values "authorization" }}
{{- if eq .Values.authorization.enabled true }}
        {{- if $authorizationConfigSecret }}
        - name: karavi-authorization-config
          secret:
            secretName: karavi-authorization-config
        {{- end }}
        {{- if not .Values.authorization.skipCertificateValidation }}
        - name: proxy-server-root-certificate
          secret:
            secretName: proxy-server-root-certificate
        {{- end }}
{{ end }}
{{ end }}
{{- if hasKey .Values "podmon" }}
{{- if eq .Values.podmon.enabled true }}
        - name: usr-bin
          hostPath:
            path: /usr/bin
            type: Directory
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: var-run
          hostPath:
            path: /var/run
            type: Directory
{{- end }}
{{- end }}
