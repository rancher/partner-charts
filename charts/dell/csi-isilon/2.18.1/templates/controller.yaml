{{- $authorizationConfigSecret := lookup "v1" "Secret" .Release.Namespace "karavi-authorization-config" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-controller
  namespace: {{ .Release.Namespace }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-controller
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
  {{- if hasKey .Values "podmon" }}
  {{- if eq .Values.podmon.enabled true }}
    verbs: ["get", "list", "watch", "patch"]
  {{- else }}
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- else }}
    verbs: ["get", "list", "watch"]
  {{- end }}
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
  {{- if hasKey .Values "podmon" }}
  {{- if eq .Values.podmon.enabled true }}
    verbs: ["get", "list", "watch", "delete"]
  {{- else }}
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- else }}
    verbs: ["get", "list", "watch"]
  {{- end }}
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattributesclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
  {{- if hasKey .Values "podmon" }}
  {{- if eq .Values.podmon.enabled true }}
    verbs: ["get", "list", "watch", "patch", "delete"]
  {{- else }}
    verbs: ["get", "list", "watch", "patch"]
  {{- end }}
  {{- else }}
    verbs: ["get", "list", "watch", "patch"]
  {{- end }}
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments/status"]
    verbs: ["patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
# below for snapshotter
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create", "list", "watch", "delete"]
 # below for resizer
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch"]
  # below for dell-csi-replicator
  {{- if hasKey .Values.controller "replication" }}
  {{- if eq .Values.controller.replication.enabled true}}
  - apiGroups: ["replication.storage.dell.com"]
    resources: ["dellcsireplicationgroups"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["replication.storage.dell.com"]
    resources: ["dellcsireplicationgroups/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]
  {{- end}}
  {{- end}}
  {{- if eq (include "csi-isilon.isStorageCapacitySupported" .) "true" }}
  - apiGroups: ["storage.k8s.io"]
    resources: ["csistoragecapacities"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  # below for CPU/memory metrics collection from Kubernetes Metrics API
  {{- if eq (include "csi-isilon.isMetricsEnabled" .) "true" }}
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  {{- end }}
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-controller
  apiGroup: rbac.authorization.k8s.io
---

# Role for Driver-specific Permissions in a Namespace
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-controller
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
---
# RoleBinding for Driver-specific Role
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-controller
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-controller
  apiGroup: rbac.authorization.k8s.io
---

kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}-controller
  namespace: {{ .Release.Namespace }}
  {{- if hasKey .Values "authorization" }}
  {{- if eq .Values.authorization.enabled true }}
  annotations:
    com.dell.karavi-authorization-proxy: "true"
  {{ end }}
  {{ end }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-controller
  {{- if lt (.Values.controller.controllerCount | toString | atoi ) 1 -}}
  {{- fail "value for .Values.controller.controllerCount should be atleast 1" }}
  {{- else }}
  replicas: {{ required "Must provide the number of controller instances to create." .Values.controller.controllerCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: "driver"
      labels:
        app: {{ .Release.Name }}-controller
    spec:
      serviceAccount: {{ .Release.Name }}-controller
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                  - {{ .Release.Name }}-controller
            topologyKey: kubernetes.io/hostname
      {{ if .Values.controller.nodeSelector }}
      nodeSelector:
      {{- toYaml .Values.controller.nodeSelector | nindent 8 }}
      {{ end }}
      {{ if .Values.controller.tolerations }}
      tolerations:
      {{- toYaml .Values.controller.tolerations | nindent 8 }}
      {{ end }}
      containers:
        {{- $driverSock := "csi.sock" }}
        {{- $csiSidecarSuffix := "" }}
        {{- $driverSockPath := printf "/var/run/csi/%s" $driverSock }}
        {{- if hasKey .Values "podmon" }}
        {{- if eq .Values.podmon.enabled true }}
        - name: podmon
          image: {{ required "Must provide the podmon container image." .Values.images.podmon.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            {{- toYaml .Values.podmon.controller.args | nindent 12 }}
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if and (hasKey .Values.podmon "metrics") .Values.podmon.metrics.enabled }}
            - name: X_CSI_METRICS_ENABLED
              value: "true"
            - name: X_CSI_METRICS_PORT
              value: "{{ .Values.podmon.metrics.port }}"
            - name: X_CSI_METRICS_COLLECTION_INTERVAL
              value: "{{ .Values.podmon.metrics.collection.interval }}"
            {{- if .Values.podmon.metrics.tlsCertSecret }}
            - name: X_CSI_METRICS_TLS_CERT_FILE
              value: /etc/metrics-tls/tls.crt
            - name: X_CSI_METRICS_TLS_KEY_FILE
              value: /etc/metrics-tls/tls.key
            {{- end }}
            {{- end }}
          {{- if and (hasKey .Values.podmon "metrics") .Values.podmon.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.podmon.metrics.port }}
              protocol: TCP
          {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
            - name: csi-isilon-config-params
              mountPath: /csi-isilon-config-params
            {{- if and (hasKey .Values.podmon "metrics") .Values.podmon.metrics.enabled .Values.podmon.metrics.tlsCertSecret }}
            - name: resiliency-metrics-tls
              mountPath: /etc/metrics-tls
              readOnly: true
            {{- end }}
        {{- end }}
        {{- if hasKey .Values.controller "replication" }}
        {{- if eq .Values.controller.replication.enabled true}}
        - name: dell-csi-replicator
          image: {{ required "Must provide the Dell CSI Replicator image." .Values.images.replication.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "--csi-address={{ $driverSockPath }}"
            - "--leader-election=true"
            - "--worker-threads=2"
            - "--retry-interval-start=1s"
            - "--retry-interval-max=300s"
            - "--timeout=300s"
            - "--context-prefix={{ .Values.controller.replication.replicationContextPrefix}}"
            - "--prefix={{ .Values.controller.replication.replicationPrefix}}"
          env:
            - name: X_CSI_REPLICATION_CONFIG_DIR
              value: /csi-isilon-config-params
            - name: X_CSI_REPLICATION_CONFIG_FILE_NAME
              value: driver-config-params.yaml
{{- if and .Values.controller.replication.enabled (hasKey .Values.controller.replication "metrics") .Values.controller.replication.metrics.enabled }}
            - name: X_CSI_REPLICATION_METRICS_ENABLED
              value: "true"
            - name: X_CSI_REPLICATION_METRICS_PORT
              value: "{{ .Values.controller.replication.metrics.port | default 8445 }}"
            - name: X_CSI_REPLICATION_METRICS_COLLECTION_INTERVAL
              value: "{{ .Values.controller.replication.metrics.collection.interval | default "30s" }}"
{{- if .Values.controller.replication.metrics.tlsCertSecret }}
            - name: X_CSI_REPLICATION_METRICS_TLS_CERT_FILE
              value: /etc/replication-metrics-tls/tls.crt
            - name: X_CSI_REPLICATION_METRICS_TLS_KEY_FILE
              value: /etc/replication-metrics-tls/tls.key
{{- end }}
          ports:
            - name: repl-metrics
              containerPort: {{ .Values.controller.replication.metrics.port | default 8445 }}
              protocol: TCP
{{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
            - name: csi-isilon-config-params
              mountPath: /csi-isilon-config-params
{{- if and .Values.controller.replication.enabled (hasKey .Values.controller.replication "metrics") .Values.controller.replication.metrics.enabled .Values.controller.replication.metrics.tlsCertSecret }}
            - name: replication-metrics-tls
              mountPath: /etc/replication-metrics-tls
              readOnly: true
{{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if hasKey .Values.controller "resizer" }}
        {{- if eq .Values.controller.resizer.enabled true }}
        - name: resizer{{ $csiSidecarSuffix }}
          image: {{ required "Must provide the CSI resizer container image." .Values.images.resizer.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "--csi-address={{ $driverSockPath }}"
            - "--leader-election"
            - "--timeout=120s"
            - "--v=5"
            - "--feature-gates=VolumeAttributesClass=true"
            {{- if eq (include "csi-isilon.isMetricsEnabled" .) "true" }}
            - "--http-endpoint=:8082"
            {{- end }}
            {{- if hasKey .Values.controller "leaderElection" }}
            {{- if hasKey .Values.controller.leaderElection "leaderElectionRenewDeadline" }}
            - "--leader-election-renew-deadline={{ .Values.controller.leaderElection.leaderElectionRenewDeadline }}"
            {{end}}
            {{- if hasKey .Values.controller.leaderElection "leaderElectionLeaseDuration" }}
            - "--leader-election-lease-duration={{ .Values.controller.leaderElection.leaderElectionLeaseDuration }}"
            {{end}}
            {{- if hasKey .Values.controller.leaderElection "leaderElectionLeaseDuration" }}
            - "--leader-election-retry-period={{ .Values.controller.leaderElection.leaderElectionRetryPeriod }}"
            {{end}}
            {{end}}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
        {{ end }}
        {{ end }}
        - name: attacher{{ $csiSidecarSuffix }}
          image: {{ required "Must provide the CSI attacher container image." .Values.images.attacher.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "--csi-address={{ $driverSockPath }}"
            - "--v=5"
            - "--leader-election"
            - "--timeout=180s"
            {{- if eq (include "csi-isilon.isMetricsEnabled" .) "true" }}
            - "--http-endpoint=:8081"
            {{- end }}
            {{- if hasKey .Values.controller "leaderElection" }}
            {{- if hasKey .Values.controller.leaderElection "leaderElectionRenewDeadline" }}
            - "--leader-election-renew-deadline={{ .Values.controller.leaderElection.leaderElectionRenewDeadline }}"
            {{end}}
            {{- if hasKey .Values.controller.leaderElection "leaderElectionLeaseDuration" }}
            - "--leader-election-lease-duration={{ .Values.controller.leaderElection.leaderElectionLeaseDuration }}"
            {{end}}
            {{- if hasKey .Values.controller.leaderElection "leaderElectionLeaseDuration" }}
            - "--leader-election-retry-period={{ .Values.controller.leaderElection.leaderElectionRetryPeriod }}"
            {{end}}
            {{end}}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
        - name: csi-metadata-retriever
          image: {{ required "Must provide the CSI metadata retriever container image." .Values.images.metadataretriever.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [ "/csi-metadata-retriever" ]
          env:
            - name: CSI_RETRIEVER_ENDPOINT
              value: /var/run/csi/csi_retriever.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
        {{- if hasKey .Values.controller "healthMonitor" }}
        {{- if eq .Values.controller.healthMonitor.enabled true }}
        - name: external-health-monitor-controller
          image: {{ required "Must provide the CSI external-health-monitor-controller container image." .Values.images.healthmonitor.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "--csi-address={{ $driverSockPath }}"
            - "--v=5"
            - "--leader-election"
            - "--enable-node-watcher=true"
            - "--monitor-interval={{ .Values.controller.healthMonitor.interval | default "60s" }}"
            - "--timeout=180s"
            - "--http-endpoint=:8080"
            {{- if hasKey .Values.controller "leaderElection" }}
            {{- if hasKey .Values.controller.leaderElection "leaderElectionRenewDeadline" }}
            - "--leader-election-renew-deadline={{ .Values.controller.leaderElection.leaderElectionRenewDeadline }}"
            {{end}}
            {{- if hasKey .Values.controller.leaderElection "leaderElectionLeaseDuration" }}
            - "--leader-election-lease-duration={{ .Values.controller.leaderElection.leaderElectionLeaseDuration }}"
            {{end}}
            {{- if hasKey .Values.controller.leaderElection "leaderElectionLeaseDuration" }}
            - "--leader-election-retry-period={{ .Values.controller.leaderElection.leaderElectionRetryPeriod }}"
            {{end}}
            {{end}}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
        {{end}}
        {{end}}
        - name: provisioner{{ $csiSidecarSuffix }}
          image: {{ required "Must provide the CSI provisioner container image." .Values.images.provisioner.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "--csi-address={{ $driverSockPath }}"
            - "--volume-name-prefix={{ required "Must provide a value to prefix to driver created volume names" .Values.controller.volumeNamePrefix }}"
            {{- if eq (include "csi-isilon.isMetricsEnabled" .) "true" }}
            - "--http-endpoint=:8084"
            {{- end }}
            - "--volume-name-uuid-length=10"
            - "--worker-threads=5"
            - "--timeout=120s"
            - "--v=5"
            - "--feature-gates=Topology=true"
            - "--leader-election"
            - "--extra-create-metadata"
            - "--enable-capacity={{ (include "csi-isilon.isStorageCapacitySupported" .) | default false }}"
            - "--capacity-ownerref-level=2"
            - "--capacity-poll-interval={{ .Values.storageCapacity.pollInterval | default "5m" }}"
            {{- if hasKey .Values.controller "leaderElection" }}
            {{- if hasKey .Values.controller.leaderElection "leaderElectionRenewDeadline" }}
            - "--leader-election-renew-deadline={{ .Values.controller.leaderElection.leaderElectionRenewDeadline }}"
            {{end}}
            {{- if hasKey .Values.controller.leaderElection "leaderElectionLeaseDuration" }}
            - "--leader-election-lease-duration={{ .Values.controller.leaderElection.leaderElectionLeaseDuration }}"
            {{end}}
            {{- if hasKey .Values.controller.leaderElection "leaderElectionLeaseDuration" }}
            - "--leader-election-retry-period={{ .Values.controller.leaderElection.leaderElectionRetryPeriod }}"
            {{end}}
            {{end}}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
        {{- if hasKey .Values.controller "snapshot" }}
        {{- if eq .Values.controller.snapshot.enabled true }}
        - name: snapshotter{{ $csiSidecarSuffix }}
          image: {{ required "Must provide the CSI snapshotter container image." .Values.images.snapshotter.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "--csi-address={{ $driverSockPath }}"
            - "--timeout=120s"
            - "--v=5"
            - "--snapshot-name-prefix={{ required "Must privided a Snapshot Name Prefix" .Values.controller.snapshot.snapNamePrefix }}"
            {{- if eq (include "csi-isilon.isMetricsEnabled" .) "true" }}
            - "--http-endpoint=:8083"
            {{- end }}
            - "--leader-election"
            {{- if hasKey .Values.controller "leaderElection" }}
            {{- if hasKey .Values.controller.leaderElection "leaderElectionRenewDeadline" }}
            - "--leader-election-renew-deadline={{ .Values.controller.leaderElection.leaderElectionRenewDeadline }}"
            {{end}}
            {{- if hasKey .Values.controller.leaderElection "leaderElectionLeaseDuration" }}
            - "--leader-election-lease-duration={{ .Values.controller.leaderElection.leaderElectionLeaseDuration }}"
            {{end}}
            {{- if hasKey .Values.controller.leaderElection "leaderElectionLeaseDuration" }}
            - "--leader-election-retry-period={{ .Values.controller.leaderElection.leaderElectionRetryPeriod }}"
            {{end}}
            {{end}}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
        {{end}}
        {{end}}
        - name: driver
          image: {{ required "Must provide the Isilon driver image repository." .Values.images.driver.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [ "/csi-isilon" ]
          args:
            - "--driver-config-params=/csi-isilon-config-params/driver-config-params.yaml"
          {{- if eq (include "csi-isilon.isMetricsEnabled" .) "true" }}
          ports:
            - containerPort: {{ .Values.metrics.port | default 8443 }}
              name: metrics
              protocol: TCP
          {{- end }}
          env:
            - name: CSI_ENDPOINT
              value: "{{ $driverSockPath }}"
            - name: CSI_RETRIEVER_ENDPOINT
              value: /var/run/csi/csi_retriever.sock
            - name: X_CSI_MODE
              value: controller
            - name: X_CSI_ISI_SKIP_CERTIFICATE_VALIDATION
              value: "{{ .Values.skipCertificateValidation }}"
            - name: X_CSI_ISI_AUTH_TYPE
              value: "{{ .Values.isiAuthType }}"
            - name: X_CSI_ALLOWED_NETWORKS
              value: "{{ .Values.allowedNetworks }}"
            - name: X_CSI_ALLOWED_NETWORKS_MODE
              value: "{{ .Values.allowedNetworksMode | default "single" }}"
            - name: X_CSI_VERBOSE
              value: "{{ .Values.verbose }}"
            - name: X_CSI_ISI_PORT
              value: "{{ .Values.endpointPort }}"
            - name: X_CSI_ISI_AUTOPROBE
              value: "{{ .Values.autoProbe }}"
            - name: X_CSI_ISI_QUOTA_ENABLED
              value: "{{ .Values.enableQuota }}"
            - name: X_CSI_ISI_ACCESS_ZONE
              value: {{ .Values.isiAccessZone }}
            - name: X_CSI_CUSTOM_TOPOLOGY_ENABLED
              value: "{{ .Values.enableCustomTopology }}"
            - name: X_CSI_ISI_PATH
              value: {{ .Values.isiPath }}
            - name: X_CSI_ISI_VOLUME_PATH_PERMISSIONS
              value: "{{ .Values.isiVolumePathPermissions }}"
            - name: X_CSI_ISI_IGNORE_UNRESOLVABLE_HOSTS
              value: "{{ .Values.ignoreUnresolvableHosts }}"
            - name: X_CSI_ISI_NFS_MOUNT_FQDN
              value: "{{ .Values.nfsMountFQDN }}"
            - name: X_CSI_ISI_TLS_HANDSHAKE_TIMEOUT_SECONDS
              value: "{{ .Values.tlsHandshakeTimeoutSeconds }}"
            - name: X_CSI_ISI_NO_PROBE_ON_START
              value: "{{ .Values.noProbeOnStart }}"
            - name: X_CSI_PODMON_ENABLED
              value: "{{ .Values.podmon.enabled }}"
            - name: X_CSI_PODMON_API_PORT
              value: "{{ .Values.podmonAPIPort }}"
            {{- if .Values.podmonAPITokenSecret }}
            - name: X_CSI_PODMON_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.podmonAPITokenSecret.name }}
                  key: {{ .Values.podmonAPITokenSecret.key | default "podmon-api-token" }}
            {{- else if .Values.podmonAPIToken }}
            - name: X_CSI_PODMON_API_TOKEN
              value: "{{ .Values.podmonAPIToken }}"
            {{- end }}
            {{- if eq .Values.podmon.enabled true }}
              {{- range $key, $value := .Values.podmon.controller.args }}
                {{- if contains "--arrayConnectivityPollRate" $value }}
            - name: X_CSI_PODMON_ARRAY_CONNECTIVITY_POLL_RATE
              value: "{{ (split "=" $value)._1 }}"
                {{ end }}
              {{ end }}
            {{ end }}
            {{- if hasKey .Values.controller "replication" }}
            {{- if eq .Values.controller.replication.enabled true}}
            - name: X_CSI_REPLICATION_CONTEXT_PREFIX
              value: {{ .Values.controller.replication.replicationContextPrefix | default "powerscale"}}
            - name: X_CSI_REPLICATION_PREFIX
              value: {{ .Values.controller.replication.replicationPrefix | default "replication.storage.dell.com"}}
            {{- end }}
            {{- end }}
            {{- if hasKey .Values.controller "healthMonitor" }}
            {{- if eq .Values.controller.healthMonitor.enabled true }}
            - name: X_CSI_HEALTH_MONITOR_ENABLED
              value: "{{ .Values.controller.healthMonitor.enabled }}"
            {{end}}
            {{end}}
            - name: X_CSI_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SSL_CERT_DIR
              value: /certs
            - name: X_CSI_ISI_CONFIG_PATH
              value: /isilon-configs/config
            - name: X_CSI_MAX_PATH_LIMIT
              value: "{{ .Values.maxPathLen }}"
            - name: X_CSI_DRIVER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if eq (include "csi-isilon.isMetricsEnabled" .) "true" }}
            - name: X_CSI_METRICS_ENABLED
              value: "true"
            - name: X_CSI_METRICS_PORT
              value: "{{ .Values.metrics.port | default 8443 }}"
            - name: X_CSI_METRICS_COLLECTION_INTERVAL
              value: "{{ .Values.metrics.collection.interval | default "30s" }}"
            - name: X_CSI_METRICS_COLLECTION_CACHE_TTL
              value: "{{ .Values.metrics.collection.cacheTTL | default "25s" }}"
            - name: X_CSI_METRICS_ARRAY_RATE_LIMIT
              value: "{{ .Values.metrics.array.rateLimit | default 100 }}"
            - name: X_CSI_METRICS_ARRAY_TIMEOUT
              value: "{{ .Values.metrics.array.timeout | default "30s" }}"
            - name: X_CSI_METRICS_ARRAY_CB_THRESHOLD
              value: "{{ .Values.metrics.array.circuitBreaker.threshold | default 3 }}"
            - name: X_CSI_METRICS_ARRAY_CB_RESET_TIMEOUT
              value: "{{ .Values.metrics.array.circuitBreaker.resetTimeout | default "30s" }}"
            {{- if .Values.metrics.tlsCertSecret }}
            - name: X_CSI_METRICS_TLS_CERT_FILE
              value: "/etc/metrics-tls/tls.crt"
            - name: X_CSI_METRICS_TLS_KEY_FILE
              value: "/etc/metrics-tls/tls.key"
            {{- end }}
            {{- if hasKey .Values.metrics "leaderElection" }}
            - name: X_CSI_METRICS_LEADER_ELECTION_ENABLED
              value: "{{ .Values.metrics.leaderElection.enabled | default false }}"
            - name: X_CSI_METRICS_LEADER_ELECTION_LEASE_DURATION
              value: "{{ .Values.metrics.leaderElection.leaseDuration | default "60s" }}"
            - name: X_CSI_METRICS_LEADER_ELECTION_RENEW_DEADLINE
              value: "{{ .Values.metrics.leaderElection.renewDeadline | default "40s" }}"
            - name: X_CSI_METRICS_LEADER_ELECTION_RETRY_PERIOD
              value: "{{ .Values.metrics.leaderElection.retryPeriod | default "5s" }}"
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/csi
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: isilon-configs
              mountPath: /isilon-configs
            - name: csi-isilon-config-params
              mountPath: /csi-isilon-config-params
{{- if eq (include "csi-isilon.isMetricsEnabled" .) "true" }}
{{- if .Values.metrics.tlsCertSecret }}
            - name: metrics-tls
              mountPath: /etc/metrics-tls
              readOnly: true
{{- end }}
{{- end }}
        {{- if hasKey .Values "authorization" }}
        {{- if eq .Values.authorization.enabled true }}
        - name: karavi-authorization-proxy
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          image: {{ required "Must provide the authorization sidecar container image." .Values.images.authorization.image }}
          env:
            - name: PROXY_HOST
              value: "{{ .Values.authorization.proxyHost }}"
            - name: SKIP_CERTIFICATE_VALIDATION
              value: "{{ .Values.authorization.skipCertificateValidation }}"
            - name: PLUGIN_IDENTIFIER
              value: powerscale
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: proxy-authz-tokens
                  key: access
            - name: REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: proxy-authz-tokens
                  key: refresh
          volumeMounts:
            {{- if $authorizationConfigSecret }}
            - name: karavi-authorization-config
              mountPath: /etc/karavi-authorization/config
            {{- else }}
            - name: isilon-configs
              mountPath: /isilon-configs
            {{- end }}
            {{- if not .Values.authorization.skipCertificateValidation }}
            - name: proxy-server-root-certificate
              mountPath: /etc/karavi-authorization/root-certificates
            {{- end }}
            - name: csi-isilon-config-params
              mountPath: /etc/karavi-authorization
        {{ end }}
        {{ end }}
      volumes:
        - name: socket-dir
          emptyDir:
        - name: certs
          projected:
            sources:
{{- range $i, $e := until (int .Values.certSecretCount ) }}
              - secret:
                  name: {{ print $.Release.Name "-certs-" $e }}
                  items:
                    - key: cert-{{ $e }}
                      path: cert-{{ $e }}
{{- end }}
        - name: isilon-configs
          secret:
            secretName: {{ .Release.Name }}-creds
        - name: csi-isilon-config-params
          configMap:
             name: {{ .Release.Name }}-config-params
        {{- if eq (include "csi-isilon.isMetricsEnabled" .) "true" }}
        {{- if .Values.metrics.tlsCertSecret }}
        - name: metrics-tls
          secret:
            secretName: {{ .Values.metrics.tlsCertSecret }}
        {{- end }}
        {{- end }}
        {{- if and (hasKey .Values "podmon") .Values.podmon.enabled (hasKey .Values.podmon "metrics") .Values.podmon.metrics.enabled .Values.podmon.metrics.tlsCertSecret }}
        - name: resiliency-metrics-tls
          secret:
            secretName: {{ .Values.podmon.metrics.tlsCertSecret }}
        {{- end }}
        {{- if hasKey .Values.controller "replication" }}
        {{- if and .Values.controller.replication.enabled (hasKey .Values.controller.replication "metrics") .Values.controller.replication.metrics.enabled .Values.controller.replication.metrics.tlsCertSecret }}
        - name: replication-metrics-tls
          secret:
            secretName: {{ .Values.controller.replication.metrics.tlsCertSecret }}
        {{- end }}
        {{- end }}
        {{- if hasKey .Values "authorization" }}
        {{- if eq .Values.authorization.enabled true }}
        {{- if $authorizationConfigSecret }}
        - name: karavi-authorization-config
          secret:
            secretName: karavi-authorization-config
        {{- end }}
        {{- if not .Values.authorization.skipCertificateValidation }}
        - name: proxy-server-root-certificate
          secret:
            secretName: proxy-server-root-certificate
        {{- end }}
        {{ end }}
        {{ end }}
