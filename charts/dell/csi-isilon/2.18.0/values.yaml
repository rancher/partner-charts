## K8S/DRIVER ATTRIBUTES
########################
# version: version of this values file
# Note: Do not change this value
version: "v2.18.0"

images:
  # "driver" defines the container image, used for the driver container.
  driver:
    image: quay.io/dell/container-storage-modules/csi-isilon:v2.18.0
  # CSI sidecars
  attacher:
    image: registry.k8s.io/sig-storage/csi-attacher:v4.13.0
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
  snapshotter:
    image: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0
  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
  healthmonitor:
    image: registry.k8s.io/sig-storage/csi-external-health-monitor-controller:v0.18.0

  # CSM sidecars
  replication:
    image: quay.io/dell/container-storage-modules/dell-csi-replicator:v1.16.0
  podmon:
    image: quay.io/dell/container-storage-modules/podmon:v1.17.0
  authorization:
    image: quay.io/dell/container-storage-modules/csm-authorization-sidecar:v2.6.0
  metadataretriever:
    image: quay.io/dell/container-storage-modules/csi-metadata-retriever:v1.15.0

# CSI driver log level
# Allowed values: "error", "warn"/"warning", "info", "debug"
# Default value: "info"
logLevel: "info"

# certSecretCount: Represents number of certificate secrets, which user is going to create for
# ssl authentication. (isilon-cert-0..isilon-cert-n)
# Allowed values: n, where n > 0
# Default value: None
certSecretCount: 1

# allowedNetworks: Custom networks for PowerScale export
#   Specify list of networks which can be used for NFS I/O traffic; CIDR format should be used.
#   The driver will select the first node IP that falls within any of the specified CIDR ranges.
# Allowed values: a quoted, bracketed, comma-separated string of one or more networks in CIDR notation
# Default value: None
# Examples: "[192.168.1.0/24, 192.168.100.0/22]"
allowedNetworks: ""

# allowedNetworksMode: Controls how the driver selects NFS client IP(s) from the
# interfaces matching allowedNetworks. "single" preserves the existing first-match
# behavior. "multi" adds ALL matching IPs to the NFS export client list, enabling
# multi-path storage access for nodes with multiple network interfaces. "multi"
# requires allowedNetworks to be set.
# Allowed values: single, multi
# Default value: single
allowedNetworksMode: single

# maxIsilonVolumesPerNode: Specify default value for maximum number of volumes that controller can publish to the node.
# If value is zero CO SHALL decide how many volumes of this type can be published by the controller to the node.
# This limit is applicable to all the nodes in the cluster for which node label 'max-isilon-volumes-per-node' is not set.
# Allowed values: n, where n >= 0
# Default value: 0
maxIsilonVolumesPerNode: 0

# imagePullPolicy: Policy to determine if the image should be pulled prior to starting the container.
# Allowed values:
#  Always: Always pull the image.
#  IfNotPresent: Only pull the image if it does not already exist on the node.
#  Never: Never pull the image.
# Default value: None
imagePullPolicy: IfNotPresent

# verbose: Indicates what content of the OneFS REST API message should be logged in debug level logs
# Allowed Values:
#   0: log full content of the HTTP request and response
#   1: log without the HTTP response body
#   2: log only 1st line of the HTTP request and response
# Default value: 0
verbose: 1

# Specify kubelet config dir path.
# Ensure that the config.yaml file is present at this path.
# Default value: /var/lib/kubelet
kubeletConfigDir: /var/lib/kubelet

# enableCustomTopology: Specify if custom topology label <provisionerName>.dellemc.com/<powerscalefqdnorip>:<provisionerName>
# has to be used for making connection to backend PowerScale Array.
# If enableCustomTopology is set to true, then do not specify allowedTopologies in storage class.
# Allowed values:
#   true : enable custom topology
#   false: disable custom topology
# Default value: false
enableCustomTopology: false

# fsGroupPolicy: Defines if the underlying volume supports changing ownership and permission of the volume before being mounted.
# Allowed values:
#   ReadWriteOnceWithFSType: supports volume ownership and permissions change only if the fsType is defined
#   and the volume's accessModes contains ReadWriteOnce.
#   File: kubernetes may use fsGroup to change permissions and ownership of the volume
#   to match user requested fsGroup in the pod's security policy regardless of fstype or access mode.
#   None: volumes will be mounted with no modifications.
# Default value: ReadWriteOnceWithFSType
fsGroupPolicy: ReadWriteOnceWithFSType

# podmonAPIPort: Defines the port to be used within the kubernetes cluster
# Allowed values:
#   Any valid and free port.
# Default value: 8083
podmonAPIPort: 8083

# podmonAPIToken: Shared secret token for authenticating podmon API requests
# When set, the driver will require Bearer token authentication on /array-status endpoints
# Allowed values: Any string (recommend using a randomly generated token)
# Security note: podmon API is HTTP; use this token only on trusted cluster-internal networks.
# For production, use podmonAPITokenSecret to source this value from a Kubernetes Secret.
# Default value: "" (empty - authentication disabled for backward compatibility)
podmonAPIToken: ""

# podmonAPITokenSecret: Kubernetes Secret containing the podmon API token
# When set, the token will be sourced from the specified Secret instead of podmonAPIToken value
# Allowed values:
#   name: Secret name (required)
#   key: Secret key containing the token (required, default: "podmon-api-token")
# Example:
#   podmonAPITokenSecret:
#     name: my-podmon-secret
#     key: api-token
# Default value: null (use podmonAPIToken value instead)
podmonAPITokenSecret: null

# maxPathLen: this parameter is used for setting the maximum Path length for the given volume.
# Default value: 192
# Examples: 192, 256
maxPathLen: 192

# azReconcileInterval: Interval to monitor and reconcile network interface labels on nodes.
# Allowed values: Number followed by unit of time (s,m,h)
# Default value: 1h
azReconcileInterval: 1h

# controller: configure controller pod specific parameters
controller:
  # controllerCount: defines the number of csi-powerscale controller pods to deploy to
  # the Kubernetes release.
  # Allowed values: n, where n > 0
  # Default value: None
  controllerCount: 2

  # volumeNamePrefix: Prefix of PersistentVolume names created
  # Allowed values: string
  # Default value: csivol
  # Examples: "k8s", "app1"
  volumeNamePrefix: csivol

  # leaderElection: configure leader election parameters
  leaderElection:
    # Duration, that non-leader candidates will wait to force acquire leadership
    # Allowed values: Duration, in seconds. Must be greater than leaderElectionRenewDeadline
    # Default value: 15s
    leaderElectionLeaseDuration: 15s

    # Duration, that the acting leader will retry refreshing leadership before giving up
    # Allowed values: Duration, in seconds. Must be greater than leaderElectionRetryPeriod
    # Default value: 10s
    leaderElectionRenewDeadline: 10s

    # Duration, the LeaderElector clients should wait between tries of actions.
    # Allowed values: Duration, in seconds
    # Default value: 5s
    leaderElectionRetryPeriod: 5s

  # replication: allows to configure replication
  # Replication CRDs must be installed before installing driver
  replication:
    # enabled: Enable/Disable replication feature
    # Allowed values:
    #   true: enable replication feature(install dell-csi-replicator sidecar)
    #   false: disable replication feature(do not install dell-csi-replicator sidecar)
    # Default value: false
    enabled: false

    # replicationContextPrefix: prefix to use for naming of resources created by replication feature
    # Allowed values: string
    # Default value: powerscale
    replicationContextPrefix: "powerscale"

    # replicationPrefix: prefix to prepend to storage classes parameters
    # Allowed values: string
    # Default value: replication.storage.dell.com
    replicationPrefix: "replication.storage.dell.com"

    # Metrics configuration for replication sidecar
    metrics:
      enabled: false
      port: 8445
      tlsCertSecret: ""
      collection:
        interval: 30s
      serviceMonitor:
        enabled: false
        interval: 30s
        scrapeTimeout: ""
        insecureSkipVerify: false

  snapshot:
    # enabled: Enable/Disable volume snapshot feature
    # Allowed values:
    #   true: enable volume snapshot feature(install snapshotter sidecar)
    #   false: disable volume snapshot feature(do not install snapshotter sidecar)
    # Default value: None
    enabled: true

    # snapNamePrefix: Prefix to apply to the names of a created snapshots
    # Allowed values: string
    # Default value: csi-snap
    # Examples: "snap", "snapshot"
    snapNamePrefix: csi-snap

  resizer:
    # enabled: Enable/Disable volume expansion feature
    # Allowed values:
    #   true: enable volume expansion feature(install resizer sidecar)
    #   false: disable volume snapshot feature(do not install resizer sidecar)
    # Default value: None
    enabled: true

  healthMonitor:
    # enabled: Enable/Disable health monitor of CSI volumes- volume status, volume condition
    # Allowed values:
    #   true: enable checking of health condition of CSI volumes
    #   false: disable checking of health condition of CSI volumes
    # Default value: None
    enabled: false

    # interval: Interval of monitoring volume health condition
    # Allowed values: Number followed by unit of time (s,m,h)
    # Default value: 60s
    interval: 60s

  # nodeSelector: Define node selection constraints for pods of controller deployment.
  # For the pod to be eligible to run on a node, the node must have each
  # of the indicated key-value pairs as labels.
  # Leave as blank to consider all nodes
  # Allowed values: map of key-value pairs
  # Default value: None
  nodeSelector:
  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/master taint
  #  node-role.kubernetes.io/master: ""
  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
  #  node-role.kubernetes.io/control-plane: ""

  # tolerations: Define tolerations for the controller deployment, if required.
  # Default value: None
  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/master taint
  tolerations:
  # - key: "node-role.kubernetes.io/master"
  #   operator: "Exists"
  #   effect: "NoSchedule"
  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
  # tolerations:
  # - key: "node-role.kubernetes.io/control-plane"
  #   operator: "Exists"
  #   effect: "NoSchedule"

# node: configure node pod specific parameters
node:
  # nodeSelector: Define node selection constraints for pods of node daemonset
  # For the pod to be eligible to run on a node, the node must have each
  # of the indicated key-value pairs as labels.
  # Leave as blank to consider all nodes
  # Allowed values: map of key-value pairs
  # Default value: None
  nodeSelector:
  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/master taint
  #  node-role.kubernetes.io/master: ""
  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
  #  node-role.kubernetes.io/control-plane: ""

  # tolerations: Define tolerations for the node daemonset, if required.
  # Default value: None
  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/master taint
  tolerations:
  #  - key: "node.kubernetes.io/memory-pressure"
  #    operator: "Exists"
  #    effect: "NoExecute"
  #  - key: "node.kubernetes.io/disk-pressure"
  #    operator: "Exists"
  #    effect: "NoExecute"
  #  - key: "node.kubernetes.io/network-unavailable"
  #    operator: "Exists"
  #    effect: "NoExecute"
  # - key: "node-role.kubernetes.io/master"
  #   operator: "Exists"
  #   effect: "NoSchedule"
  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
  # tolerations:
  # - key: "node-role.kubernetes.io/control-plane"
  #   operator: "Exists"
  #   effect: "NoSchedule"

  # Uncomment if CSM for Resiliency and CSI Driver pods monitor are enabled
  # tolerations:
  #  - key: "offline.vxflexos.storage.dell.com"
  #    operator: "Exists"
  #    effect: "NoSchedule"
  #  - key: "vxflexos.podmon.storage.dell.com"
  #    operator: "Exists"
  #    effect: "NoSchedule"
  #  - key: "offline.unity.storage.dell.com"
  #    operator: "Exists"
  #    effect: "NoSchedule"
  #  - key: "unity.podmon.storage.dell.com"
  #    operator: "Exists"
  #    effect: "NoSchedule"
  #  - key: "offline.isilon.storage.dell.com"
  #    operator: "Exists"
  #    effect: "NoSchedule"
  #  - key: "isilon.podmon.storage.dell.com"
  #    operator: "Exists"
  #    effect: "NoSchedule"

  # dnsPolicy: Determines the DNS Policy of the Node service.
  # Allowed values:
  #   Default: The Pod inherits the name resolution configuration from the node that the pods run on.
  #   ClusterFirst: Any DNS query that does not match the configured cluster domain suffix, such as "www.kubernetes.io",
  #   is forwarded to the upstream nameserver inherited from the node.
  #   ClusterFirstWithHostNet:  For Pods running with hostNetwork, you should explicitly set this DNS policy.
  #   None: It allows a Pod to ignore DNS settings from the Kubernetes environment.
  #   All DNS settings are supposed to be provided using the dnsConfig field in the Pod Spec.
  # Default value: ClusterFirst
  # ClusterFirstWithHostNet is the recommended DNS policy.
  # Prior to v1.5 of the driver, the default DNS policy was ClusterFirst.
  # In certain scenarios, users might need to change the default dnsPolicy.
  dnsPolicy: ClusterFirstWithHostNet

  healthMonitor:
    # enabled: Enable/Disable health monitor of CSI volumes- volume usage, volume condition
    # Allowed values:
    #   true: enable checking of health condition of CSI volumes
    #   false: disable checking of health condition of CSI volumes
    # Default value: None
    enabled: false

## PLATFORM ATTRIBUTES
######################
# endpointPort: Specify the HTTPs port number of the PowerScale OneFS API server
# Formerly this attribute was named as "isiPort"
# This value acts as a default value for endpointPort, if not specified for a cluster config in secret
# If authorization is enabled, endpointPort must match the port specified in the endpointPort parameter of the isilon-creds secret
# Allowed value: valid port number
# Default value: 8080
endpointPort: 8080

# skipCertificateValidation: Specify whether the PowerScale OneFS API server's certificate chain and host name should be verified.
# Formerly this attribute was named as "isiInsecure"
# This value acts as a default value for skipCertificateValidation, if not specified for a cluster config in secret
# Allowed values:
#   true: skip OneFS API server's certificate verification
#   false: verify OneFS API server's certificates
# Default value: false
skipCertificateValidation: true

# isiAuthType: Indicates whether the authentication will be session-based or basic.
# Allowed values:
#   0: enables basic Authentication
#   1: enables session-based Authentication
# Default value: 1
isiAuthType: 1

# isiAccessZone: The name of the access zone a volume can be created in.
# If storageclass is missing with AccessZone parameter, then value of isiAccessZone is used for the same.
# Default value: System
# Examples: System, zone1
isiAccessZone: System

# enableQuota: Indicates whether the provisioner should attempt to set (later unset) quota
# on a newly provisioned volume.
# This requires SmartQuotas to be enabled on PowerScale cluster.
# Allowed values:
#   true: set quota for volume
#   false: do not set quota for volume
enableQuota: true

# isiPath: The base path for the volumes to be created on PowerScale cluster.
# This value acts as a default value for isiPath, if not specified for a cluster config in secret
# Ensure that this path exists on PowerScale cluster.
# Allowed values: unix absolute path
# Default value: /ifs
# Examples: /ifs/data/csi, /ifs/engineering
isiPath: /ifs/data/csi

# isiVolumePathPermissions: The permissions for isi volume directory path
# This value acts as a default value for isiVolumePathPermissions, if not specified for a cluster config in secret
# Allowed values: valid octal mode number
# Default value: "0777"
# Examples: "0777", "777", "0755"
isiVolumePathPermissions: "0777"

# ignoreUnresolvableHosts: Ignore unresolvable hosts on the OneFS
# When set to true, OneFS allows new host to add to existing export list though any of the existing hosts from the
# same exports are unresolvable/doesn't exist anymore.
# Allowed values:
#   true: ignore existing unresolvable hosts and append new host to the existing export
#   false: exhibits OneFS default behavior i.e. if any of existing hosts are unresolvable while adding new one it fails
# Default value: false
ignoreUnresolvableHosts: false

# noProbeOnStart: Indicates whether the controller/node should probe all the PowerScale clusters during driver initialization
# When set to true, the driver will not set node labels, please manually add
# the label <provisionerName>.dellemc.com/<powerscalefqdnorip>:<provisionerName> on the nodes for each of the clusters reachable from the node.
# Allowed values:
#   true : do not probe all PowerScale clusters during driver initialization
#   false: probe all PowerScale clusters during driver initialization
# Default value: false
noProbeOnStart: false

# autoProbe: automatically probe the PowerScale cluster if not done already during CSI calls.
# Allowed values:
#   true : enable auto probe.
#   false: disable auto probe.
# Default value: false
autoProbe: true

# nfsMountFQDN: Specify the global fallback FQDN for NFS mount targets.
# StorageClass SmartConnectZoneFQDN takes precedence, followed by the selected cluster's
# nfsMountFQDN. NFSTransportSecurity remains explicit and StorageClass-scoped.
# Allowed values: A valid FQDN (e.g., "smartconnect.isilon.example.com")
# Optional: true
# Default value: None
nfsMountFQDN: ""

# tlsHandshakeTimeoutSeconds: Specify the TLS handshake timeout in seconds for NFS over TLS/mTLS.
# This timeout is applied only by the mTLS mount path.
# Allowed values: positive integer (seconds)
# Default value: 30
tlsHandshakeTimeoutSeconds: "30"

authorization:
  enabled: false
  # proxyHost: hostname of the csm-authorization server
  # Default value: None
  proxyHost:
  # skipCertificateValidation: certificate validation of the csm-authorization server
  # Allowed Values:
  #   "true" - TLS certificate verification will be skipped
  #   "false" - TLS certificate will be verified
  # Default value: "true"
  skipCertificateValidation: true

# Storage Capacity Tracking
# Note: Capacity tracking is supported in kubernetes v1.24 and above, this feature will be automatically disabled in older versions.
storageCapacity:
  # enabled : Enable/Disable storage capacity tracking
  # Allowed values:
  #   true: enable storage capacity tracking
  #   false: disable storage capacity tracking
  # Default value: true
  enabled: true
  # pollInterval : Configure how often external-provisioner polls the driver to detect changed capacity
  # Allowed values: 1m,2m,3m,...,10m,...,60m etc
  # Default value: 5m
  pollInterval: 5m

# Enable this feature only after contact support for additional information
podmon:
  enabled: false
  controller:
    args:
      - "--csisock=unix:/var/run/csi/csi.sock"
      - "--labelvalue=csi-isilon"
      - "--arrayConnectivityPollRate=60"
      - "--driverPath=csi-isilon.dellemc.com"
      - "--mode=controller"
      - "--skipArrayConnectionValidation=false"
      - "--driver-config-params=/csi-isilon-config-params/driver-config-params.yaml"
      - "--driverPodLabelValue=dell-storage"
      - "--ignoreVolumelessPods=false"

  node:
    args:
      - "--csisock=unix:/var/lib/kubelet/plugins/csi-isilon/csi_sock"
      - "--labelvalue=csi-isilon"
      - "--arrayConnectivityPollRate=60"
      - "--driverPath=csi-isilon.dellemc.com"
      - "--mode=node"
      - "--leaderelection=false"
      - "--driver-config-params=/csi-isilon-config-params/driver-config-params.yaml"
      - "--driverPodLabelValue=dell-storage"
      - "--ignoreVolumelessPods=false"

  # Metrics configuration for podmon resiliency
  metrics:
    # enabled: Set to true to expose the metrics endpoint on the podmon containers.
    # Default value: false
    enabled: false
    # port: Port on which the metrics endpoint is exposed. Default for podmon: 8444.
    port: 8444
    # tlsCertSecret: Name of a Kubernetes TLS Secret (tls.crt / tls.key) used to serve metrics over HTTPS.
    # When set the operator mounts the secret and configures HTTPS automatically.
    # Leave unset to serve metrics over plain HTTP.
    tlsCertSecret: ""
    # collection: Controls metrics collection cadence inside the resiliency module.
    collection:
      interval: 30s
    # serviceMonitor: Creates a Prometheus Operator ServiceMonitor targeting the controller pods.
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: ""
      insecureSkipVerify: false
    # podMonitor: Creates a Prometheus Operator PodMonitor targeting the node pods.
    podMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: ""
      insecureSkipVerify: false
    # prometheusRule: Controls optional Prometheus Operator PrometheusRule creation for resiliency alerts.
    prometheusRule:
      # enabled: When true, a PrometheusRule CR is created for resiliency alerting rules.
      # Type: bool
      # Default: true
      # Effect: Requires the Prometheus Operator CRDs to be installed in the cluster.
      enabled: true
      # connectivitySuccessRatio: Minimum acceptable connectivity success ratio as percentage (0-100).
      # Used by RES-02 (CSMResiliencyConnectivityLost) alert threshold.
      # Type: integer
      # Default: 90 (alert fires when connectivity drops below 90%)
      connectivitySuccessRatio: 90

# metrics: configuration for driver metrics and monitoring
metrics:
  # enabled: Enable/Disable the shared Prometheus metrics HTTP server.
  # Type: bool
  # Default: false
  # Effect: When true, the controller Deployment receives X_CSI_METRICS_ENABLED=true,
  #         X_CSI_METRICS_PORT, and a metrics Service is created.
  enabled: false

  # port: Port on which the shared driver metrics endpoint is exposed.
  # Type: integer
  # Default: 8443
  # Effect: Passed as X_CSI_METRICS_PORT to the driver container; used as targetPort in the Service.
  port: 8443

  # tlsCertSecret: Name of a Kubernetes TLS Secret whose "tls.crt" and "tls.key" entries
  # are used to serve the metrics endpoint over HTTPS instead of plain HTTP.
  # Leave empty (the default) to use plain HTTP.
  # Type: string
  # Default: "" (disabled - plain HTTP)
  tlsCertSecret: ""

  # leaderElection: Configure leader election for array-level metrics collection.
  # Only the leader controller will collect array-level metrics to avoid duplicate API calls.
  leaderElection:
    # enabled: When true, leader election is enabled for the metrics server.
    # Type: bool
    # Default: false
    enabled: false
    # leaseDuration: Duration in seconds that the current leader will hold the lease.
    # Type: string (Prometheus duration, e.g. "15s", "30s")
    # Default: "60s"
    leaseDuration: "60s"
    # renewDeadline: Duration in seconds that the leader will attempt to renew the lease.
    # Type: string (Prometheus duration, e.g. "10s", "20s")
    # Default: "40s"
    renewDeadline: "40s"
    # retryPeriod: Duration in seconds that the leader will wait before attempting to acquire the lease.
    # Type: string (Prometheus duration, e.g. "5s", "10s")
    # Default: "5s"
    retryPeriod: "5s"

  # serviceMonitor: Controls optional Prometheus Operator ServiceMonitor creation.
  serviceMonitor:
    # enabled: When true, a ServiceMonitor CR is created for automatic Prometheus Operator integration.
    # Type: bool
    # Default: false
    # Effect: Requires the Prometheus Operator CRDs to be installed in the cluster.
    enabled: false
    # interval: Prometheus scrape interval for the metrics endpoint.
    # Type: string (Prometheus duration, e.g. "30s", "1m")
    # Default: "30s"
    interval: "30s"
    # scrapeTimeout: Prometheus scrape timeout for the metrics endpoint.
    # Type: string (Prometheus duration, e.g. "10s")
    # Default: "" (unset)
    scrapeTimeout: ""
    # insecureSkipVerify: Controls TLS certificate verification when scraping metrics.
    # Only used when metrics.tlsCertSecret is set (HTTPS endpoint).
    # Type: bool
    # Default: false
    insecureSkipVerify: false

  # podMonitor: Controls optional Prometheus Operator PodMonitor creation for node DaemonSet pods.
  podMonitor:
    # enabled: When true, a PodMonitor CR is created for scraping metrics from node pods.
    # Type: bool
    # Default: false
    # Effect: Requires the Prometheus Operator CRDs to be installed in the cluster.
    enabled: false
    # interval: Prometheus scrape interval for the node metrics endpoint.
    # Type: string (Prometheus duration, e.g. "30s", "1m")
    # Default: "30s"
    interval: "30s"
    # scrapeTimeout: Prometheus scrape timeout for the node metrics endpoint.
    # Type: string (Prometheus duration, e.g. "10s")
    # Default: "" (unset)
    scrapeTimeout: ""
    # insecureSkipVerify: Controls TLS certificate verification when scraping node metrics.
    # Only used when metrics.tlsCertSecret is set (HTTPS endpoint).
    # Type: bool
    # Default: false
    insecureSkipVerify: false

  # prometheusRule: Controls optional Prometheus Operator PrometheusRule creation for alerting.
  # When enabled, deploys 22 PowerScale-specific alert rules covering volume operations,
  # driver health, quota capacity, node pool capacity, access control, and NFS performance.
  prometheusRule:
    # enabled: When true, a PrometheusRule CR is created with all PowerScale alert rules.
    # Type: bool
    # Default: true
    # Effect: Requires the Prometheus Operator CRDs to be installed in the cluster.
    #         Auto-deploys when metrics.enabled is true. Set to false to disable bundled alerts.
    enabled: true
    # volumeOperationFailureThreshold: Volume operation failure count threshold in 5m window
    volumeOperationFailureThreshold: 3
    # quotaWarningThreshold: Quota utilization warning threshold (percent, 0-100).
    # Type: integer
    # Default: 80 (triggers warning at 80% quota usage)
    quotaWarningThreshold: 80
    # quotaCriticalThreshold: Quota utilization critical threshold (percent, 0-100).
    # Type: integer
    # Default: 90 (triggers critical alert at 90% quota usage)
    quotaCriticalThreshold: 90
    # nodepoolWarningThreshold: Node pool utilization warning threshold (percent, 0-100).
    # Type: integer
    # Default: 80 (triggers warning at 80% node pool usage)
    nodepoolWarningThreshold: 80
    # nodepoolCriticalThreshold: Node pool utilization critical threshold (percent, 0-100).
    # Type: integer
    # Default: 90 (triggers critical alert at 90% node pool usage)
    nodepoolCriticalThreshold: 90
    # apiErrorRateThreshold: API error rate warning threshold (percent, 0-100).
    # Type: integer
    # Default: 10 (triggers warning when API error rate exceeds 10%)
    apiErrorRateThreshold: 10
    # apiErrorRateWindow: Time window for API error rate calculation.
    # Type: string (Prometheus duration, e.g. "5m", "10m")
    # Default: "5m"
    apiErrorRateWindow: "5m"
    # cpuWarningThreshold: Driver CPU usage warning threshold (percent, 0-100).
    # Type: integer
    # Default: 80 (triggers warning at 80% CPU usage)
    cpuWarningThreshold: 80
    # memoryWarningThreshold: Driver memory usage warning threshold (bytes).
    # Type: integer
    # Default: 2147483648 (2 GiB in bytes)
    memoryWarningThreshold: 2147483648
    # nfsV3LatencyWarningSeconds: NFSv3 P99 latency warning threshold (seconds).
    # Type: integer
    # Default: 10 (triggers warning when P99 latency exceeds 10 seconds)
    nfsV3LatencyWarningSeconds: 10
    # nfsV4LatencyWarningSeconds: NFSv4 P99 latency warning threshold (seconds).
    # Type: integer
    # Default: 10 (triggers warning when P99 latency exceeds 10 seconds)
    nfsV4LatencyWarningSeconds: 10
    # driverCrashLoopRestartThreshold: Number of driver restarts to trigger crash loop alert.
    # Type: integer
    # Default: 3 (triggers warning after 3 restarts within the window)
    driverCrashLoopRestartThreshold: 3
    # driverCrashLoopWindow: Time window for crash loop restart detection.
    # Type: string (Prometheus duration, e.g. "15m", "30m")
    # Default: "15m"
    driverCrashLoopWindow: "15m"

  # collection: Controls how frequently metrics are collected.
  collection:
    # interval: How often the driver collects metrics from the array.
    # Type: string (duration, e.g. "30s", "1m")
    interval: "30s"
    # cacheTTL: How long collected values are cached before re-querying the array.
    # Type: string (duration, e.g. "25s")
    cacheTTL: "25s"

  # array: Array-specific collector tuning.
  array:
    # rateLimit: Maximum array API requests per second.
    # Type: integer
    rateLimit: 100
    # timeout: Per-request timeout for array API calls.
    # Type: string (duration)
    timeout: "30s"
    # circuitBreaker: Circuit-breaker settings for array API calls.
    circuitBreaker:
      # threshold: Number of consecutive failures before the circuit opens.
      threshold: 3
      # resetTimeout: How long the circuit stays open before allowing a retry.
      resetTimeout: "30s"

# fsGroupChown: Configure driver-side recursive fsGroup chown for export-backed volumes.
# This is only used when fsGroupPolicy is ReadWriteOnceWithFSType and the volume's fsType is set.
fsGroupChown:
  # enabled: Enable the driver's parallel recursive chown for export-backed volumes.
  # When disabled, the driver falls back to a sequential recursive chown within the configured timeout.
  # Default value: true
  enabled: true

  # workers: Number of parallel os.Chown workers for recursive fsGroup application.
  # Default value: 8
  workers: 8

  # writeBatch: Number of completed file paths to buffer before writing the resumable state file.
  # Default value: 1000
  writeBatch: 1000

  # timeoutSeconds: Per-NodeStageVolume/NodePublishVolume timeout for recursive chown in seconds.
  # Default value: 30
  timeoutSeconds: 30
