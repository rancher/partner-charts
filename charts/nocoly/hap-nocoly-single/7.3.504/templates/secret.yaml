{{- $configuredToken := .Values.hap.apiToken | default "" -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "hap-secret" -}}
{{- $existingToken := "" -}}
{{- if and $existingSecret $existingSecret.data -}}
{{- $existingToken = (index $existingSecret.data "ENV_API_TOKEN" | default "") -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: hap-secret
type: Opaque
{{- if $configuredToken }}
stringData:
  ENV_API_TOKEN: {{ $configuredToken | quote }}
{{- else if $existingToken }}
data:
  ENV_API_TOKEN: {{ $existingToken | quote }}
{{- else }}
stringData:
  ENV_API_TOKEN: {{ randAlphaNum 32 | quote }}
{{- end }}
