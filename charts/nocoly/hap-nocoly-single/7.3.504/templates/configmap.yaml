apiVersion: v1
kind: ConfigMap
metadata:
  name: hap-env
data:
  ENV_ADDRESS_MAIN: {{ required "hap.addressMain is required and must include the browser access URL and port" .Values.hap.addressMain | quote }}
  ENV_CAPTAIN_ENDPOINT: {{ required "hap.captainEndpoint is required: install Captain matching the HAP x.y.z version on a Linux AMD64 VM or physical server, then supply its reachable HTTP URL (port 38880 by default)" .Values.hap.captainEndpoint | quote }}
  ENV_FLINK_URL: "http://flink:8081"
  ENV_APP_VERSION: {{ .Values.hap.appVersion | quote }}
  ENV_TIME_ZONE: {{ .Values.hap.timeZone | quote }}
  ENV_LITE_ENABLE: {{ .Values.hap.liteEnable | quote }}
