hap:
  addressMain: ""                              # Required: browser access URL, including the port
  captainEndpoint: ""                         # Required: reachable Captain 7.3.5 URL, e.g. http://captain.example.internal:38880
  appVersion: "7.3.5"
  apiToken: ""                                 # Optional: generate 32 characters on first install and reuse on upgrades
  timeZone: "Asia/Shanghai"
  liteEnable: "false"
  nodePort: 30880                              # NodePort exposing app port 8880

images:
  registry: "nocoly"
  app: "hap:7.3.5"
  sc: "sc:3.2.0"
  command: "command:node2011-python312"
  doc: "doc:2.0.0"
  flink: "flink:1.19.720"
  pullPolicy: "IfNotPresent"

flink:
  enabled: true
  s3Endpoint: "sc:9010"

persistence:
  storageClass: ""          # Required: use local-path for a single-node RKE2 or k3s cluster
  sharedDataSize: "30Gi"    # Shared by app, sc, and flink at /data
  hapDataSize: "10Gi"       # Mounted by app at /data/hap/data

resources:
  sc:      { cpu: "1",    memory: "4Gi" }
  app:     { cpu: "1",    memory: "4Gi" }
  command: { cpu: "200m", memory: "256Mi" }
  doc:     { cpu: "200m", memory: "512Mi" }
  flink:   { cpu: "500m", memory: "1Gi" }
