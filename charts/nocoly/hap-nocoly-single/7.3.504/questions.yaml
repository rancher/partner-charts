questions:
  - variable: hap.addressMain
    label: Main access URL
    description: "Browser access URL including the port, for example http://host.example.com:30880. It must match the URL used to access HAP."
    type: string
    required: true
    default: ""
    group: Required
  - variable: persistence.storageClass
    label: StorageClass name
    description: "Name of an existing StorageClass used by both volumes. Select local-path only if that provisioner is installed in your single-node cluster."
    type: string
    required: true
    default: ""
    group: Required
  - variable: hap.captainEndpoint
    label: Captain endpoint (install Captain first)
    description: "Required external license manager. Before installing HAP 7.3.5, install Captain 7.3.5 on a Linux AMD64 VM or physical server using https://pdpublic.nocoly.com/7.3.5/hap_captain_linux_amd64.tar.gz. Follow the chart README, then enter a URL reachable from HAP pods, e.g. http://captain.example.internal:38880. Do not use the installer UI port 38881. Support: ops@nocoly.com."
    type: string
    required: true
    default: ""
    group: Required
  - variable: hap.nodePort
    label: Application NodePort
    type: int
    default: 30880
    group: General
  - variable: hap.apiToken
    label: API token (optional)
    description: "When empty, the chart generates a 32-character token on first install and reuses the existing Secret on upgrades. Enter a value to supply or rotate the token."
    type: string
    default: ""
    group: General
  - variable: flink.enabled
    label: Enable Flink data integration
    type: boolean
    default: true
    group: Components
  - variable: persistence.sharedDataSize
    label: Shared data volume size
    type: string
    default: "30Gi"
    group: Storage
