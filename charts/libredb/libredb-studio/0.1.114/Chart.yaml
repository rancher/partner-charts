annotations:
  artifacthub.io/category: database
  artifacthub.io/changes: |
    - "authProvider: openshift signs people in with their OpenShift account: the chart annotates the ServiceAccount as the OAuth client, mounts its client token and the cluster CA, writes the OPENSHIFT_* variables and the admin review target, and refuses every values set the mode cannot run; it needs the next Studio image and fails the render on 1.1.0"
    - "openshift.consoleLink renders a console.openshift.io/v1 ConsoleLink to Studio in the application menu or a namespace dashboard"
    - "In openshift mode with Kubernetes discovery on, custom connections default off and the NetworkPolicy renders by default, confining database egress to the discovered namespaces; networkPolicy.enabled=false opts out"
    - "Under the OLM operator, a discovered namespace other than the release's and the ConsoleLink render only for the LibreDBStudio in operator.clusterStudioNamespace"
    - "discovery.kubernetes.clusterDomain sets SEED_KUBERNETES_DISCOVERY_CLUSTER_DOMAIN for a cluster domain other than cluster.local"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:1.1.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/libredb/libredb-studio#readme
    - name: Container Image
      url: https://github.com/libredb/libredb-studio/pkgs/container/libredb-studio
    - name: Source
      url: https://github.com/libredb/libredb-studio
  artifacthub.io/prerelease: "false"
