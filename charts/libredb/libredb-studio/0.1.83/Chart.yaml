annotations:
  artifacthub.io/category: database
  artifacthub.io/changes: |
    - "Security: the pod spec carries serviceAccount.automountServiceAccountToken (default false), so with serviceAccount.create=false the pod no longer mounts the API token of the account it runs as, usually the namespace's default one. Studio reads that token only for Vault Kubernetes auth: an install with serviceAccount.create=false that sets VAULT_ROLE sets the value to true, or projects a token through extraVolumes and points VAULT_K8S_TOKEN_PATH at it"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:0.18.2
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/libredb/libredb-studio#readme
    - name: Container Image
      url: https://github.com/libredb/libredb-studio/pkgs/container/libredb-studio
    - name: Source
      url: https://github.com/libredb/libredb-studio
  artifacthub.io/prerelease: "false"
