annotations:
  artifacthub.io/category: database
  artifacthub.io/changes: |
    - "Every tag now ships on three bases, published for the first time with this release. `0.16.1`, `0.16.1-alpine` and `0.16.1-alpine-slim` are the same build on Debian, on Alpine, and on Alpine with its own nodejs package; set image.tag to a suffixed tag to pin one. The chart default stays the Debian tag, which is the only one Oracle Thick mode can be layered onto"
    - "The two Alpine tags exist for their OS posture: measured with Trivy 0.73.0 on 2026-09-15, the Debian base carried 3 CRITICAL and 52 HIGH distro findings against 0 and 2 for the Alpine base. `-alpine` is the same product as the default image; `-alpine-slim` is the only variant that trades a feature for size, dropping the DuckDB driver, and a DuckDB connection on it answers with a message naming the tags that do carry it"
    - "With AUTH_BOOTSTRAP off and no JWT secret, the container started, passed its own liveness probe and answered every login with a 503. It now prints the missing variable and exits, so a pod that cannot serve a login says so at boot rather than reading as healthy"
    - "An inline cell edit is written to the row it was made on. Until this release the grid keyed a revealed cell to the position it sat at rather than to its row, so an edit made after a sort or a refresh could land on a different row; measured on live engines alongside eight further defects in the SQLite, libSQL and MySQL paths"
    - "GET /health and GET /api/health answer beside /api/db/health, so a platform whose probe path is not configurable has one to reach. The chart probes are unchanged and still use /api/db/health"
    - "Agent mode runs on SQL Server, which is the fourth engine it executes statements on. Seed connection credentials can now be resolved from HashiCorp Vault instead of being written into the seed file"
    - "Schema diff compares against the live schema rather than the cached copy, and drops the previous connection objects when the connection changes, so a diff can no longer describe a schema that is no longer there"
    - "The object browser lists tables on a PostgreSQL-wire engine whose pg_class reports no reltuples, where the row previously read as an empty table rather than as an uncounted one"
    - "Icon-only buttons in the sidebar and the grid toolbars carry accessible names, and the Admin Audit tab states that it shows application-recorded denials only, not the ones the proxy records"
    - "Track app release 0.16.1 (appVersion bump; default image tag follows)"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:0.16.1
      platforms:
        - linux/amd64
        - linux/arm64
