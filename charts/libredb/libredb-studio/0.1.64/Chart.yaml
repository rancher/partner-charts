annotations:
  artifacthub.io/category: database
  artifacthub.io/changes: |
    - "A transaction now belongs to the session that opened it. Until this release every account reaching one connection id drove a single provider-level transaction, so a second Studio user could roll back the first one's uncommitted work; measured through the product's own route on PostgreSQL 18.4. Ownership is a five-minute idle lease, so an abandoned transaction still frees the connection"
    - "secrets.adminTotpSecret and secrets.userTotpSecret add an optional TOTP second factor to the local auth provider. Each is written into the chart Secret and referenced as an optional env ref, so a secret nobody set can never keep the pod from starting, and values.schema.json applies the app's own base32 and 128-bit test at install time rather than at the login screen"
    - "secrets.existingSecretKeys gains admin-totp-secret and user-totp-secret, so an external Secret can carry the second factor too. Both refs stay optional in every mode, strict included"
    - "Those two TOTP values shipped in chart 0.1.63, whose changelog repeated the previous version's entry instead of describing them. 0.1.63 is published and frozen under issue 167, so they are recorded here"
    - "The object browser is a lazy tree of containers and kinds on all seventeen shipped type-ids, an object's definition text reads on fifteen of them, and an edit applies the DDL on three. This is a breaking change in the application, not in the chart: the old schema API routes are gone. No template, value or default moves in this chart version; config.basePath arrived in 0.1.62 and the two TOTP values in 0.1.63, and all three default to empty"
    - "Monitoring reads checkpoint timings from pg_stat_checkpointer on PostgreSQL 17 and newer, where PostgreSQL moved them out of pg_stat_bgwriter. Those servers used to report N/A and log a column error on every refresh. Measured on PostgreSQL 14 through 18"
    - "Table and database sizes on the MySQL wire no longer read 0 B when the engine answers a NULL INDEX_LENGTH, which is what StarRocks does for every base table. A view still reads as unmeasured, which is correct"
    - "Storage provider initialization is shared across concurrent first calls, so a burst of requests against a cold pod initializes the configured store once rather than racing"
    - "The image is built on node 26.8.2-trixie-slim and accepts a BASE_PATH build argument, which is the build-time prefix config.basePath expects a custom image to carry"
    - "Track app release 0.16.0 (appVersion bump; default image tag follows)"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:0.16.0
      platforms:
