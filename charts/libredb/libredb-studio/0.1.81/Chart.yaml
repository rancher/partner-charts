annotations:
  artifacthub.io/category: database
  artifacthub.io/changes: |
    - "Databend shows its official icon from the Databend brand assets in place of the warehouse drawn for Studio"
    - "A new connection starts with Environment set to Other, which shows no badge, instead of Local"
    - "Generate Test Data leaves foreign-key columns out and keeps primary-key and unique values distinct, MongoDB included"
    - "A Source tab re-reads its object when opened again and has a refresh control"
    - "Fixes across PostgreSQL and its relatives, the wire-compatible engines, Vitess, MongoDB, Redis and Oracle Schema Diff"
    - "Track app release 0.18.2 (appVersion bump; default image tag follows)"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:0.18.2
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/libredb/libredb-studio#readme
    - name: Container Image
      url: https://github.com/libredb/libredb-studio/pkgs/container/libredb-studio
    - name: Source
      url: https://github.com/libredb/libredb-studio
  artifacthub.io/prerelease: "false"
