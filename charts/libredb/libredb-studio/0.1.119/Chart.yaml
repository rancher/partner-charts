annotations:
  artifacthub.io/category: database
  artifacthub.io/changes: |
    - "Default image 1.2.0 is the first that authProvider openshift accepts, so OpenShift sign-in renders without an image.tag override"
    - "Sign in through the cluster's OAuth server with authProvider openshift, and gate discovered connections and admin with a Kubernetes access review"
    - "openshift.consolePlugin (default false) installs the OpenShift console plugin 0.1.0, pinned by digest: on a Helm install in a namespace of its own, and under the OLM operator, in the operator's own namespace"
    - "Discover CloudNativePG, EDB, Crunchy PGO and MongoDB Community databases, with a Service check, fully qualified hosts and 32 hex connection ids"
    - "Action required: Kubernetes-discovered connection ids change from 12 to 32 hex characters, so old seed links stop resolving"
    - "Action required: off cluster.local, set discovery.kubernetes.clusterDomain, or no discovered database is listed"
    - "Refuse to start when the trusted CA bundle file is missing, unreadable, empty or holds no PEM certificate"
    - "Hardening: host-only __Host- session cookie on HTTPS, which signs every browser out once, display masking in charts, pivot and result cards, and dependency advisories closed"
    - "An unknown NEXT_PUBLIC_AUTH_PROVIDER now refuses boot instead of falling back"
    - "Track app release 1.2.0 (appVersion bump; default image tag follows)"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:1.2.0
      platforms:
        - linux/amd64
        - linux/arm64
    - name: libredb-studio-openshift-plugin
      image: ghcr.io/libredb/libredb-studio-openshift-plugin:0.1.0@sha256:39698233d019f4e69fe106e634af789291011d59d27d5858a7e4d0b41283d86e
      platforms:
        - linux/amd64
        - linux/arm64
