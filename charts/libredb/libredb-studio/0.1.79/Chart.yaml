annotations:
  artifacthub.io/category: database
  artifacthub.io/changes: |
    - "Security: with config.storageProvider sqlite or postgres, an account that signed in on a browser profile another account had signed out of received that account's browser copy of the workspace, the connections it had added with their saved credentials and its query history, from 0.8.0 through 0.18.0 (GHSA-jwvh-6phv-j9jh). The copy is now bound to the signed-in account, and the first sign-in after the upgrade starts from the account's server data. Such an install should upgrade"
    - "Databend joins as a connection type of its own, over its HTTP query API, for self-hosted Databend and Databend Cloud warehouses; with a warehouse set, Studio sends no background check that would resume it"
    - "A Seed sources card on the admin Overview page. A seed connectionString on a type that does not read it, and a seed file with a YAML warning, now fail the seed file at load: move the value into the connection fields, or quote it"
    - "Query results export as Markdown or HTML, the object tree has a filter box, and a result column no longer loses its name or value to another column of the same name"
    - "The image carries sharp 0.35.5 (GHSA-wq5f-xc86-pv6w)"
    - "The chart description, keywords and README name Databend"
    - "Track app release 0.18.1 (appVersion bump; default image tag follows)"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:0.18.1
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/libredb/libredb-studio#readme
    - name: Container Image
      url: https://github.com/libredb/libredb-studio/pkgs/container/libredb-studio
    - name: Source
      url: https://github.com/libredb/libredb-studio
  artifacthub.io/prerelease: "false"
  catalog.cattle.io/certified: partner
  catalog.cattle.io/display-name: LibreDB Studio
  catalog.cattle.io/kube-version: '>=1.26.0-0'
