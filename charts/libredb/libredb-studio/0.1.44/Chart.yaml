annotations:
  artifacthub.io/category: database
  artifacthub.io/changes: |
    - "Four more database engines, fourteen in all: Apache Cassandra over CQL, Apache Trino over its own client protocol with no runtime dependency added, and Elasticsearch and OpenSearch as two engines over one shared SQL transport"
    - "Eighteen further engines are published as wire-compatible, each measured against a live instance rather than assumed from a protocol - MariaDB, TiDB, Vitess, StarRocks, OceanBase, SingleStore, Citus, TimescaleDB, YugabyteDB, AlloyDB Omni, Apache Cloudberry, CockroachDB, Materialize, RisingWave, Valkey, DragonflyDB, KeyDB and FerretDB - so fourteen drivers now reach thirty-two named products"
    - "How much of the product each of those eighteen gives you differs per engine and is published per engine: full, partial, or SQL editor only. The connection dialog names the relatives a driver serves, and the docs table records the exact version probed and what was found broken"
    - "Monitoring stops reporting an absent measurement as a measurement: five panels that printed a confident 0 for engines that keep no such counter now leave the field blank"
    - "The schema explorer emits Redis commands for Redis instead of SQL it cannot run there, from a generator of its own"
    - "OIDC logout resolves generic end-session URLs from the provider's discovery document rather than building one by hand"
    - "The query agent enforces single-drive ownership and refuses appends once a run has closed, and its rail answers first instead of narrating its steps"
    - "Chart 0.1.44 changes no template: its content is the appVersion move to 0.13.0 and the cassandra keyword that ArtifactHub search needs. The IPv6 bind behaviour is 0.1.42's, unchanged"
    - "Track app release 0.13.0 (appVersion bump; default image tag follows)"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:0.13.0
      platforms:
        - linux/amd64
        - linux/arm64
