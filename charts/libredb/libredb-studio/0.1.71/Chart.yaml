annotations:
  artifacthub.io/category: database
  artifacthub.io/changes: |
    - "The image serves a read-only Model Context Protocol server at /api/mcp, so the mcp block added in chart 0.1.70 takes effect with this release. Nothing is served until mcp.enabled is true. A client authenticates with a bearer token each user mints at /settings/mcp, reaches only seed connections marked mcp true whose roles admit it, and gets three read-only tools; run_read_query runs on PostgreSQL, SQLite, DuckDB and SQL Server and needs a least-privilege login on PostgreSQL and SQL Server. Setup and limits are in docs/MCP.md"
    - "Prometheus joins as a read-only provider over its HTTP API, with no driver dependency: PromQL in the editor, and metrics, rule groups, rules, scrape pools and targets in the explorer. VictoriaMetrics connects through it. A response is parsed whole under a 32 MiB cap, and a body well under that cap can exhaust the 384 MiB heap the image runs with, so an install pointed at a large server should raise resources.limits.memory and NODE_OPTIONS together (D110 in docs/BACKLOG.md)"
    - "Apache Kafka joins as a read-only provider: topics, consumer groups and brokers in the explorer, messages read with one JSON request from earliest, latest, an offset or a timestamp, and consumer lag per partition. It never joins a consumer group, commits an offset or creates a topic, it refuses a SASL login without TLS, and it needs Apache Kafka 3.1 or later. Redpanda connects through it"
    - "GET /api/connections/managed withholds every field the connection store classifies as secret. It removed only password and connectionString, so the Elasticsearch API key pair and ssl.clientKey of a managed seed reached every signed-in user whose role matched the seed. A seed file that fails to parse no longer quotes the failing line in the error body of every seed route"
    - "The ClickHouse, Druid, Elasticsearch, OpenSearch, Trino, libSQL and Couchbase transports validate host and port before a URL exists and refuse to follow a redirect, and Trino holds every nextUri link to the connection's own origin, where it used to request any link the coordinator sent with the connection's Authorization header attached"
    - "Redis connections walk one database's key space in the sidebar with SCAN, shown as a sample against the server's DBSIZE, and a Redis database that is not a number or that the server does not have is refused at connect instead of reading database 0; a MongoDB collection in a database other than the connected one is read from its own database instead of answering 0 rows; and a table row in the object tree expands to its columns again"
    - "Agent mode can pause and resume a run from the rail, a run a crashed process left running is picked up and driven again by a sweep instead of staying open, and a resumed run continues its statement and database-time spend instead of starting a fresh budget"
    - "Track app release 0.17.0 (appVersion bump; default image tag follows)"
