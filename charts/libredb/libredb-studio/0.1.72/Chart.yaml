annotations:
  artifacthub.io/category: database
  artifacthub.io/changes: |
    - "New value config.passkeyOrigin, written to PASSKEY_ORIGIN only when set: the public origin people open Studio at (scheme, host and port, no path), such as https://studio.example.com. Passkeys also need config.storageProvider sqlite or postgres and authProvider local, and browsers offer them only over https or on http://localhost; NOTES.txt warns about a value that cannot work. It needs an application image that includes passkey sign-in (#785): appVersion 0.17.0 does not read it, so it acts once an application release moves appVersion. Guide: docs/PASSKEYS.md"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:0.17.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/license: MIT
  artifacthub.io/links: |
