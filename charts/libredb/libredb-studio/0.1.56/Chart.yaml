annotations:
  artifacthub.io/category: database
  artifacthub.io/changes: |
    - "The sign-in page no longer shows a bare Encrypted badge beside the SSO button. It named no subject, and on the default local storage provider it had no referent beyond the TLS the browser already indicates - saved connections live in the browser localStorage in plaintext by design, and the at-rest AES-256-GCM covers the sqlite and postgres server store only"
    - "Track app release 0.13.6 (appVersion bump; default image tag follows)"
  artifacthub.io/containsSecurityUpdates: "false"
