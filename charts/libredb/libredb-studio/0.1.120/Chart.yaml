annotations:
  artifacthub.io/category: database
  artifacthub.io/changes: |
    - "MCP and the read-only agent read on many more engines, each MCP token lists only its own tools, and inspect_schema reports foreign keys under a deadline"
    - "A seed connection can carry a separate agent credential, and the connection form shows a fixed Read-only label where Studio has no write path"
    - "Action required: an OPC UA seed must declare agentReadRoots, or agents and MCP can no longer read it"
    - "TOTP enrolment shows a QR code, and the OIDC callback keeps the configured base path"
    - "Hardening of the AI prompt routes and of seed connection input, plus fixes on Redis, SQL Server, Kafka, MQTT, Db2 and data profiling"
    - "Track app release 1.3.0 (appVersion bump; default image tag follows)"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: libredb-studio
      image: ghcr.io/libredb/libredb-studio:1.3.0
      platforms:
        - linux/amd64
        - linux/arm64
    - name: libredb-studio-openshift-plugin
