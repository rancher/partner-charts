{{- /*
Not created when the postgres password comes from an existing secret: either an
explicitly configured one (postgres.external.secret.name), or the yugaware global
config secret in sub-chart mode.
*/}}
{{- if and (not .Values.postgres.external.secret.name) (not .Values.yugaware.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres-password
  namespace: {{ include "perf-advisor-chart.namespace" . }}
  labels:
    app: {{ .Release.Name }}-postgres
    chart: {{ include "perf-advisor-chart.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service | quote }}
{{- if .Values.commonLabels }}
{{ include "perf-advisor-chart.commonLabels" . | indent 4 }}
{{- end }}
type: Opaque
data:
  # quote - makes single quote
  # b64enc - encodes to base64
  {{- if .Values.postgres.external.host }}
  POSTGRES_PASSWORD: {{ .Values.postgres.external.pass | b64enc | quote }}
  {{- else }}
  POSTGRES_PASSWORD: {{ .Values.postgres.env.postgresPassword | b64enc | quote }}
  {{- end }}
{{- end }}
