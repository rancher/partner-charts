{{/*
TODO: switch to policy/v1 completely when we stop supporting
Kubernetes versions < 1.21
*/}}
{{- if .Values.pdbPolicyVersionOverride }}
apiVersion: policy/{{ .Values.pdbPolicyVersionOverride }}
{{- else if .Capabilities.APIVersions.Has "policy/v1/PodDisruptionBudget" }}
apiVersion: policy/v1
{{- else }}
apiVersion: policy/v1beta1
{{- end }}
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-perf-advisor-pdb
  namespace: {{ include "perf-advisor-chart.namespace" . }}
  labels:
    app: {{ .Release.Name }}-perf-advisor
    chart: {{ include "perf-advisor-chart.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service | quote }}
{{- if .Values.commonLabels }}
{{ include "perf-advisor-chart.commonLabels" . | indent 4 }}
{{- end }}
spec:
  {{- if contains "collector" (include "perf-advisor-chart.springProfiles" .) }}
  {{- /* When collector is present, replicas is forced to 1. maxUnavailable: 1 allows disruptions/evictions. */}}
  maxUnavailable: 1
  {{- else }}
  {{- /* When collector is not present, multiple replicas are supported, use configured maxUnavailable */}}
  maxUnavailable: {{ .Values.perfAdvisor.podDisruptionBudget.maxUnavailable | toJson }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-perf-advisor
