# yaml-language-server: $schema=https://raw.githubusercontent.com/quintush/helm-unittest/master/schema/helm-testsuite.json
suite: postgres Service
templates:
- service.yaml
release:
  name: yba-test
tests:
- it: publishes the YBA pod while it is not Ready
  documentSelector:
    path: metadata.name
    value: yba-test-postgres
  asserts:
  - equal:
      path: spec.publishNotReadyAddresses
      value: true
