apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-yugaware-test
  labels:
    app: {{ .Release.Name }}-yugaware-test
    chart: {{ template "yugaware.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Values.helm2Legacy | ternary "Tiller" (.Release.Service | quote) }}
{{- if .Values.commonLabels }}
{{ include "yugaware.commonLabels" . | indent 4 }}
{{- end }}
  annotations:
    "helm.sh/hook": test
spec:
  terminationGracePeriodSeconds: 30
  imagePullSecrets:
  - name: {{ .Values.image.pullSecret }}
  {{- if .Values.securityContext.enabled }}
  securityContext:
    fsGroup: {{ .Values.securityContext.fsGroup }}
    runAsUser: {{ required "runAsUser cannot be empty" .Values.securityContext.runAsUser }}
    {{- if ne .Values.securityContext.runAsGroup nil }}
    runAsGroup: {{ .Values.securityContext.runAsGroup }}
    {{- else }}
    runAsGroup: {{ .Values.securityContext.runAsUser }}
    {{- end }}
    runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
    {{- if (semverCompare ">=1.20-x" .Capabilities.KubeVersion.Version) }}
    fsGroupChangePolicy: {{ .Values.securityContext.fsGroupChangePolicy }}
    {{- end }}
    {{- if .Values.securityContext.additionalSettings }}
    {{- toYaml .Values.securityContext.additionalSettings | nindent 4 }}
    {{- end }}
  {{- end }}
  containers:
    - name: yugaware-test
      image: {{ include "full_yugaware_image" . }}
      {{- if .Values.containerSecurityContext.enabled }}
      {{- include "getSecurityContext" . | nindent 6 }}
      {{- end }}
      command:
        - '/bin/bash'
        - '-ec'
        - >
          sleep 60s;
        {{- if .Values.tls.enabled }}
        - >
           curl --head -k https://{{ .Release.Name }}-yugaware-ui
        {{- else }}
        - >
            curl --head http://{{ .Release.Name }}-yugaware-ui
        {{- end }}
      # Hard coded resources to the test pod.
      resources:
        limits:
          cpu: "1"
          memory: "512Mi"
        requests:
          cpu: "0.5"
          memory: "256Mi"
  restartPolicy: Never
